<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#355c3a"><title>属から判定・花の数性 50問</title><style>*{box-sizing:border-box}body{margin:0;background:#f4f7f1;color:#203125;font-family:system-ui,-apple-system,"Noto Sans JP",sans-serif}main{max-width:600px;margin:auto;padding:18px 16px 40px}h1{font-size:24px;margin:8px 0}p{line-height:1.6}.muted{color:#607263;font-size:14px}.panel{background:white;border:1px solid #d8e5d7;border-radius:18px;padding:18px;margin:15px 0;box-shadow:0 3px 12px #2139210b}button,select{font:inherit;border-radius:12px;padding:13px;border:1px solid #bfd2bf;background:white;color:#21412b}button{cursor:pointer}button:disabled{opacity:.4}.primary{background:#355f40;color:white;border-color:#355f40;font-weight:750}.wide{width:100%;margin:7px 0}.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}.grid button{width:100%}.top{display:flex;justify-content:space-between;align-items:center;gap:8px}.top button{font-size:13px;padding:9px}.q{font-size:21px;font-weight:750;line-height:1.5;margin:13px 0 20px}.option{display:block;text-align:left;width:100%;margin:9px 0;line-height:1.45}.chosen{border:2px solid #355f40;background:#e5f1e5}.answer{background:#edf4e9;border-radius:12px;padding:13px;margin-top:13px;line-height:1.7}.hidden{display:none}.pill{display:inline-block;border-radius:40px;background:#e1ebe0;padding:6px 11px;font-size:12px}a{color:#376442}#bottom{margin-top:7px}label{display:block;margin:14px 0}.bar{height:7px;border-radius:6px;background:#dce7d9;overflow:hidden;margin:12px 0}.bar>div{height:100%;background:#45764c;transition:width .2s}</style></head><body><main><div class="top"><a href="./index.html">‹ 学習ホームへ</a><span class="pill">生物分類技能検定2級</span></div><h1>🌺 属から判定・花の数性</h1><p class="muted">3・4・5数性／50属・科と花の構造の解説　全50問</p><section id="settings" class="panel"><strong>出題設定</strong><label>出題範囲<br><select id="size"><option value="10">10問</option><option value="20">20問</option><option value="all">全50問</option></select></label><label><input id="miss" type="checkbox"> 前回までに間違えた問題だけ</label><label><input id="random" type="checkbox" checked> 出題順をシャッフル</label><button class="primary wide" id="start">学習スタート</button><p class="muted">一問ずつ正誤判定。途中で「一問戻る」も使えます。間違い履歴はこのブラウザに保存。</p></section><section id="study" class="panel hidden"><div class="top"><span id="progress" class="muted"></span><button id="home">設定へ戻る</button></div><div class="bar"><div id="fill"></div></div><div class="q" id="question"></div><div id="options"></div><div class="answer hidden" id="feedback"></div><div id="bottom" class="grid"><button id="prev">← 一問戻る</button><button class="primary" id="next" disabled>次の問題 →</button></div></section><section id="done" class="panel hidden"><h2>学習結果</h2><p id="summary"></p><button class="primary wide" id="again">設定へ戻る</button></section></main><script>
const DATA=[{"q":"ユリ属（Lilium）の花は基本的に何数性？","a":"3数性","exp":"ユリ科。3数性が基本。花被片6・雄しべ6。"},{"q":"カタクリ属（Erythronium）の花は基本的に何数性？","a":"3数性","exp":"ユリ科。3数性が基本。花被片6・雄しべ6。"},{"q":"チューリップ属（Tulipa）の花は基本的に何数性？","a":"3数性","exp":"ユリ科。3数性が基本。花被片6・雄しべ6。"},{"q":"バイモ属（Fritillaria）の花は基本的に何数性？","a":"3数性","exp":"ユリ科。3数性が基本。花被片6・雄しべ6。"},{"q":"キバナノアマナ属（Gagea）の花は基本的に何数性？","a":"3数性","exp":"ユリ科。3数性が基本。花被片6・雄しべ6。"},{"q":"ネギ属（Allium）の花は基本的に何数性？","a":"3数性","exp":"ヒガンバナ科。3数性が基本。花被片6・雄しべ6。"},{"q":"スイセン属（Narcissus）の花は基本的に何数性？","a":"3数性","exp":"ヒガンバナ科。3数性が基本。花被片6・雄しべ6。"},{"q":"ヒガンバナ属（Lycoris）の花は基本的に何数性？","a":"3数性","exp":"ヒガンバナ科。3数性が基本。花被片6・雄しべ6。"},{"q":"アヤメ属（Iris）の花は基本的に何数性？","a":"3数性","exp":"アヤメ科。3数性が基本。花被片6・雄しべ3。"},{"q":"サフラン属（Crocus）の花は基本的に何数性？","a":"3数性","exp":"アヤメ科。3数性が基本。花被片6・雄しべ3。"},{"q":"グラジオラス属（Gladiolus）の花は基本的に何数性？","a":"3数性","exp":"アヤメ科。3数性が基本。花被片6・雄しべ3。"},{"q":"シュンラン属（Cymbidium）の花は基本的に何数性？","a":"3数性","exp":"ラン科。3数性が基本。花被片6・雄しべと雌しべが合着。"},{"q":"セッコク属（Dendrobium）の花は基本的に何数性？","a":"3数性","exp":"ラン科。3数性が基本。花被片6・唇弁をもつ。"},{"q":"ネジバナ属（Spiranthes）の花は基本的に何数性？","a":"3数性","exp":"ラン科。3数性が基本。花被片6・唇弁をもつ。"},{"q":"コチョウラン属（Phalaenopsis）の花は基本的に何数性？","a":"3数性","exp":"ラン科。3数性が基本。花被片6・唇弁をもつ。"},{"q":"ムラサキツユクサ属（Tradescantia）の花は基本的に何数性？","a":"3数性","exp":"ツユクサ科。3数性が基本。萼片3・花弁3。"},{"q":"ツユクサ属（Commelina）の花は基本的に何数性？","a":"3数性","exp":"ツユクサ科。3数性が基本。萼片3・花弁3。"},{"q":"ワスレグサ属（Hemerocallis）の花は基本的に何数性？","a":"3数性","exp":"ツルボラン科。3数性が基本。花被片6・雄しべ6。"},{"q":"クサスギカズラ属（Asparagus）の花は基本的に何数性？","a":"3数性","exp":"キジカクシ科。3数性が基本。花被片6。"},{"q":"アマドコロ属（Polygonatum）の花は基本的に何数性？","a":"3数性","exp":"キジカクシ科。3数性が基本。花被片6。"},{"q":"スズラン属（Convallaria）の花は基本的に何数性？","a":"3数性","exp":"キジカクシ科。3数性が基本。花被6裂。"},{"q":"アブラナ属（Brassica）の花は基本的に何数性？","a":"4数性","exp":"アブラナ科。4数性が基本。花弁4・四強雄しべ6。"},{"q":"ダイコン属（Raphanus）の花は基本的に何数性？","a":"4数性","exp":"アブラナ科。4数性が基本。花弁4・四強雄しべ6。"},{"q":"ナズナ属（Capsella）の花は基本的に何数性？","a":"4数性","exp":"アブラナ科。4数性が基本。花弁4・四強雄しべ6。"},{"q":"シロイヌナズナ属（Arabidopsis）の花は基本的に何数性？","a":"4数性","exp":"アブラナ科。4数性が基本。花弁4・四強雄しべ6。"},{"q":"タネツケバナ属（Cardamine）の花は基本的に何数性？","a":"4数性","exp":"アブラナ科。4数性が基本。花弁4・四強雄しべ6。"},{"q":"エゾスズシロ属（Erysimum）の花は基本的に何数性？","a":"4数性","exp":"アブラナ科。4数性が基本。花弁4・四強雄しべ6。"},{"q":"マツヨイグサ属（Oenothera）の花は基本的に何数性？","a":"4数性","exp":"アカバナ科。4数性が基本。花弁4・雄しべ8。"},{"q":"アカバナ属（Epilobium）の花は基本的に何数性？","a":"4数性","exp":"アカバナ科。4数性が基本。花弁4・雄しべ8。"},{"q":"クラーキア属（Clarkia）の花は基本的に何数性？","a":"4数性","exp":"アカバナ科。4数性が基本。花弁4・雄しべの数に変異あり。"},{"q":"ヤエムグラ属（Galium）の花は基本的に何数性？","a":"4数性","exp":"アカバナ科。4数性が基本。4数性が基本・種により数性に変異あり。"},{"q":"ミズキ属（Cornus）の花は基本的に何数性？","a":"4数性","exp":"ミズキ科。4数性が基本。花弁4・雄しべ4。"},{"q":"ナス属（Solanum）の花は基本的に何数性？","a":"5数性","exp":"ナス科。5数性が基本。花冠5裂・雄しべ5。"},{"q":"トウガラシ属（Capsicum）の花は基本的に何数性？","a":"5数性","exp":"ナス科。5数性が基本。花冠5裂・雄しべ5。"},{"q":"ペチュニア属（Petunia）の花は基本的に何数性？","a":"5数性","exp":"ナス科。5数性が基本。花冠5裂・雄しべ5。"},{"q":"タバコ属（Nicotiana）の花は基本的に何数性？","a":"5数性","exp":"ナス科。5数性が基本。花冠5裂・雄しべ5。"},{"q":"アサガオ属（Ipomoea）の花は基本的に何数性？","a":"5数性","exp":"ヒルガオ科。5数性が基本。花冠5裂・雄しべ5。"},{"q":"ヒルガオ属（Calystegia）の花は基本的に何数性？","a":"5数性","exp":"ヒルガオ科。5数性が基本。花冠5裂・雄しべ5。"},{"q":"ヨウシュチョウセンアサガオ属（Datura）の花は基本的に何数性？","a":"5数性","exp":"ナス科。5数性が基本。花冠5裂・雄しべ5。"},{"q":"ホオズキ属（Physalis）の花は基本的に何数性？","a":"5数性","exp":"ナス科。5数性が基本。花冠5裂・雄しべ5。"},{"q":"リンドウ属（Gentiana）の花は基本的に何数性？","a":"5数性","exp":"リンドウ科。5数性が基本。花冠5裂・雄しべ5。"},{"q":"キキョウ属（Platycodon）の花は基本的に何数性？","a":"5数性","exp":"キキョウ科。5数性が基本。花冠5裂・雄しべ5。"},{"q":"ホタルブクロ属（Campanula）の花は基本的に何数性？","a":"5数性","exp":"キキョウ科。5数性が基本。花冠5裂・雄しべ5。"},{"q":"ナデシコ属（Dianthus）の花は基本的に何数性？","a":"5数性","exp":"ナデシコ科。5数性が基本。花弁5・雄しべ10。"},{"q":"マンテマ属（Silene）の花は基本的に何数性？","a":"5数性","exp":"ナデシコ科。5数性が基本。花弁5・雄しべ10。"},{"q":"ハコベ属（Stellaria）の花は基本的に何数性？","a":"5数性","exp":"ナデシコ科。5数性が基本。花弁5（深く2裂）。"},{"q":"サクラソウ属（Primula）の花は基本的に何数性？","a":"5数性","exp":"サクラソウ科。5数性が基本。花冠5裂・雄しべ5。"},{"q":"オカトラノオ属（Lysimachia）の花は基本的に何数性？","a":"5数性","exp":"サクラソウ科。5数性が基本。花冠5裂・雄しべ5。"},{"q":"スイカズラ属（Lonicera）の花は基本的に何数性？","a":"5数性","exp":"スイカズラ科。5数性が基本。花冠5裂・雄しべ5。"},{"q":"アキギリ属（Salvia）の花は基本的に何数性？","a":"5数性","exp":"シソ科。5数性が基本。花冠5裂・雄しべ2。"}];
const KEY="floral_merosity_genus_missed_v1";
let missed=new Set();try{missed=new Set(JSON.parse(localStorage.getItem(KEY)||"[]"))}catch(e){}
let order=[],index=0,selected={};
const $=id=>document.getElementById(id);
function save(){try{localStorage.setItem(KEY,JSON.stringify([...missed]))}catch(e){}}
function shuffle(a){for(let i=a.length-1;i>0;i--){let j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
function opts(q){return ["3数性","4数性","5数性"].slice()}
function start(){DATA.forEach(q=>delete q._choices);let arr=DATA.map((_,i)=>i);if($("miss").checked)arr=arr.filter(i=>missed.has(i));if(!arr.length){alert("復習対象の間違い問題はまだありません");return}if($("random").checked)shuffle(arr);order=arr.slice(0,$("size").value==="all"?arr.length:Number($("size").value));index=0;selected={};$("settings").classList.add("hidden");$("done").classList.add("hidden");$("study").classList.remove("hidden");render()}
function render(){
  if(index>=order.length){finish();return}
  const id=order[index],q=DATA[id],v=selected[id];
  $("progress").textContent=(index+1)+" / "+order.length;
  $("fill").style.width=(index/order.length*100)+"%";
  $("question").textContent=q.q;
  const container=$("options");
  container.replaceChildren();
  if(!q._choices)q._choices=shuffle(opts(q));
  const choices=q._choices;
  for(const a of choices){
    const b=document.createElement("button");
    b.type="button";
    b.className="option"+(v&&v.a===a?" chosen":"");
    b.textContent=a;
    b.disabled=Boolean(v);
    b.addEventListener("click",()=>choose(id,a,choices));
    container.appendChild(b);
  }
  $("feedback").classList.toggle("hidden",!v);
  if(v)$("feedback").textContent=(v.a===q.a?"✓ 正解":"× 不正解")+"｜正答："+q.a+"。 "+q.exp;
  $("next").disabled=!v;
  $("prev").disabled=index===0;
  $("next").textContent=index===order.length-1?"結果を見る →":"次の問題 →";
}
function choose(id,a,choices){selected[id]={a,choices};if(a===DATA[id].a)missed.delete(id);else missed.add(id);save();render()}
function finish(){$("study").classList.add("hidden");$("done").classList.remove("hidden");let correct=order.filter(i=>selected[i]?.a===DATA[i].a).length;$("summary").textContent=order.length+"問中 "+correct+"問正解。間違い履歴は保存しました。"}
function reset(){$("study").classList.add("hidden");$("done").classList.add("hidden");$("settings").classList.remove("hidden")}
$("start").onclick=start;$("home").onclick=reset;$("again").onclick=reset;$("prev").onclick=()=>{if(index>0){index--;render()}};$("next").onclick=()=>{if(selected[order[index]]){index++;render()}};
</script></body></html>

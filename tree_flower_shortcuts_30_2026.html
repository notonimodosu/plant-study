<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#355c3a"><title>樹木の花・最短識別30問</title><style>*{box-sizing:border-box}body{margin:0;background:#f4f7f1;color:#203125;font-family:system-ui,-apple-system,"Noto Sans JP",sans-serif}main{max-width:600px;margin:auto;padding:18px 16px 40px}h1{font-size:24px;margin:8px 0}p{line-height:1.6}.muted{color:#607263;font-size:14px}.panel{background:white;border:1px solid #d8e5d7;border-radius:18px;padding:18px;margin:15px 0;box-shadow:0 3px 12px #2139210b}button,select{font:inherit;border-radius:12px;padding:13px;border:1px solid #bfd2bf;background:white;color:#21412b}button{cursor:pointer}button:disabled{opacity:.4}.primary{background:#355f40;color:white;border-color:#355f40;font-weight:750}.wide{width:100%;margin:7px 0}.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}.grid button{width:100%}.top{display:flex;justify-content:space-between;align-items:center;gap:8px}.top button{font-size:13px;padding:9px}.q{font-size:21px;font-weight:750;line-height:1.5;margin:13px 0 20px}.option{display:block;text-align:left;width:100%;margin:9px 0;line-height:1.45}.chosen{border:2px solid #355f40;background:#e5f1e5}.answer{background:#edf4e9;border-radius:12px;padding:13px;margin-top:13px;line-height:1.7}.hidden{display:none}.pill{display:inline-block;border-radius:40px;background:#e1ebe0;padding:6px 11px;font-size:12px}a{color:#376442}#bottom{margin-top:7px}label{display:block;margin:14px 0}.bar{height:7px;border-radius:6px;background:#dce7d9;overflow:hidden;margin:12px 0}.bar>div{height:100%;background:#45764c;transition:width .2s}</style></head><body><main><div class="top"><a href="./index.html">‹ 学習ホームへ</a><span class="pill">生物分類技能検定2級</span></div><h1>🌸 樹木の花・最短識別</h1><p class="muted">花形・花序・似た樹種の見分け／全30問</p><section id="settings" class="panel"><strong>出題設定</strong><label>出題範囲<br><select id="size"><option value="10">10問</option><option value="20">20問</option><option value="all">全30問</option></select></label><label><input id="miss" type="checkbox"> 前回までに間違えた問題だけ</label><label><input id="random" type="checkbox" checked> 出題順をシャッフル</label><button class="primary wide" id="start">学習スタート</button><p class="muted">一問ずつ正誤判定。途中で「一問戻る」も使えます。間違い履歴はこのブラウザに保存。</p></section><section id="study" class="panel hidden"><div class="top"><span id="progress" class="muted"></span><button id="home">設定へ戻る</button></div><div class="bar"><div id="fill"></div></div><div class="q" id="question"></div><div id="options"></div><div class="answer hidden" id="feedback"></div><div id="bottom" class="grid"><button id="prev">← 一問戻る</button><button class="primary" id="next" disabled>次の問題 →</button></div></section><section id="done" class="panel hidden"><h2>学習結果</h2><p id="summary"></p><button class="primary wide" id="again">設定へ戻る</button></section></main><script>
const DATA=[{"q":"白い花弁のような総苞片4枚・先端が尖る。最有力候補は？","a":"ヤマボウシ","exp":"花弁ではなく総苞片。先端が尖り気味。","choices":["ヤマボウシ","ハナミズキ","コブシ","エゴノキ"]},{"q":"白い花弁のような総苞片4枚・先端がくぼむ。最有力候補は？","a":"ハナミズキ","exp":"総苞片の先端のくぼみが有力な決め手。","choices":["ハナミズキ","ヤマボウシ","ミズキ","コブシ"]},{"q":"黄色い小花が房状に垂れ下がる・早春。最有力候補は？","a":"キブシ","exp":"垂れ下がる総状花序を覚える。","choices":["キブシ","サンシュユ","ダンコウバイ","クロモジ"]},{"q":"早春に葉より先に黄色い小花がまとまって咲く・ミズキ科。最有力候補は？","a":"サンシュユ","exp":"黄色い散形状の花序。","choices":["サンシュユ","キブシ","クロモジ","アブラチャン"]},{"q":"黄色い小花が球状にまとまる・芳香がある・クスノキ科。最有力候補は？","a":"クロモジ","exp":"春の葉の展開時期に小花が集まる。","choices":["クロモジ","キブシ","サンシュユ","アセビ"]},{"q":"小さな白い壺形花が下向き・ツツジ科。最有力候補は？","a":"ドウダンツツジ","exp":"小形の壺形花が垂れ下がる。","choices":["ドウダンツツジ","アセビ","ネズミモチ","エゴノキ"]},{"q":"白い壺形の花が多数、円錐状の房につく・常緑。最有力候補は？","a":"アセビ","exp":"ドウダンツツジとの二択は花序も確認。","choices":["アセビ","ドウダンツツジ","ツツジ","ウツギ"]},{"q":"大きな白い花・多数の花被片・葉が出る前の早春。最有力候補は？","a":"コブシ・タムシバ","exp":"モクレン科の両種が候補。葉や花の付け根で識別。","choices":["コブシ・タムシバ","ヤマボウシ・ハナミズキ","キブシ・サンシュユ","アセビ・ドウダンツツジ"]},{"q":"白花が枝から下向きに多数咲く・長い花柄。最有力候補は？","a":"エゴノキ","exp":"5裂する白花と長い花柄。","choices":["エゴノキ","ネズミモチ","ミズキ","カナメモチ"]},{"q":"白い房状花序が下向き・サクラ類の仲間。最有力候補は？","a":"ウワミズザクラ","exp":"総状花序が特徴。一般的なサクラの散房状とは異なる。","choices":["ウワミズザクラ","ソメイヨシノ","コブシ","ヤマボウシ"]},{"q":"小さな白花が枝先の円錐花序に多数・モクセイ科。最有力候補は？","a":"ネズミモチ","exp":"モクセイ科、花冠は通常4裂、雄しべ2。","choices":["ネズミモチ","エゴノキ","キブシ","コブシ"]},{"q":"枝先に多数の白い小花・散房花序・バラ科。最有力候補は？","a":"カナメモチ","exp":"バラ科の白い小花が散房状に集まる。","choices":["カナメモチ","エゴノキ","アセビ","キブシ"]},{"q":"花弁4裂・雄しべ2本・芳香が強い秋の花。最有力候補は？","a":"キンモクセイ","exp":"モクセイ属の花。小花が葉腋に集まる。","choices":["キンモクセイ","キブシ","サンシュユ","ヤマボウシ"]},{"q":"枝先に藤色の蝶形花が長い房になる。最有力候補は？","a":"フジ","exp":"マメ科の蝶形花が総状花序をつくる。","choices":["フジ","ハギ","キブシ","アセビ"]},{"q":"紅紫色の蝶形花が枝の葉腋付近に集まる・秋。最有力候補は？","a":"ハギ類","exp":"マメ科。フジより短い花序のことが多い。","choices":["ハギ類","フジ","サクラ類","ツツジ類"]},{"q":"黄色い花弁5枚・雄しべ多数・春に咲く。最有力候補は？","a":"ヤマブキ","exp":"ヤマブキは通常5弁花。八重咲き品種もある。","choices":["ヤマブキ","レンギョウ","キブシ","サンシュユ"]},{"q":"早春に黄色い4裂花冠・葉より先に開花・モクセイ科。最有力候補は？","a":"レンギョウ","exp":"花冠4裂。ヤマブキは5弁花。","choices":["レンギョウ","ヤマブキ","サンシュユ","アブラチャン"]},{"q":"淡紅色の花が葉より先・花弁5枚で先端が切れ込む。最有力候補は？","a":"サクラ類","exp":"サクラ類の花弁は通常5枚、先端に切れ込み。","choices":["サクラ類","コブシ","エゴノキ","アセビ"]},{"q":"細い淡黄色の花弁4枚・冬に咲く。最有力候補は？","a":"マンサク","exp":"ひも状の花弁4枚が特徴。","choices":["マンサク","レンギョウ","サンシュユ","キブシ"]},{"q":"房状に花が垂れ下がる・黄色・葉の展開前。最有力候補は？","a":"キブシ","exp":"樹木の花序写真で頻出の特徴。","choices":["キブシ","アセビ","クロモジ","ネズミモチ"]},{"q":"多数の雄花が尾状花序となり垂れ下がる。最有力候補は？","a":"カバノキ科・ブナ科など","exp":"これだけでは種や科を確定できない。","choices":["カバノキ科・ブナ科など","モクレン科のみ","ツツジ科のみ","ラン科のみ"]},{"q":"花弁が目立たず風媒花が多い・雄花序が尾状。最有力候補は？","a":"ブナ科の一部","exp":"コナラ属などの雄花序を想定。ただしブナ科の全種で一様ではない。","choices":["ブナ科の一部","モクレン科","ツバキ科","バラ科"]},{"q":"大型の赤い花・多数の雄しべが筒状に合着。最有力候補は？","a":"ヤブツバキ","exp":"ツバキ属の特徴。","choices":["ヤブツバキ","サザンカ","ヤマボウシ","フジ"]},{"q":"冬〜早春の白・淡紅色花・花弁と雄しべが多数。最有力候補は？","a":"サザンカ","exp":"ツバキ属。開花期だけで厳密確定は避ける。","choices":["サザンカ","エゴノキ","キブシ","ヤマボウシ"]},{"q":"淡紅色の房状の花序・マメ科・蝶形花。最有力候補は？","a":"フジ","exp":"春に総状花序をつくる。","choices":["フジ","キブシ","エゴノキ","サンシュユ"]},{"q":"花弁が多数・大型の白花・モクレン科。最有力候補は？","a":"コブシ・タムシバ","exp":"どちらも白花。葉や花の付け根などを併用。","choices":["コブシ・タムシバ","ヤマボウシ・ハナミズキ","シラカシ・アラカシ","スダジイ・ツブラジイ"]},{"q":"花序は円錐状、小さな白花が多数・秋の芳香花ではない。最有力候補は？","a":"ネズミモチ","exp":"キンモクセイと同じモクセイ科でも花序が異なる。","choices":["ネズミモチ","キンモクセイ","フジ","コブシ"]},{"q":"白い4枚が目立つが、実際の花弁ではない。最有力候補は？","a":"ヤマボウシ・ハナミズキ","exp":"白い部分は総苞片。","choices":["ヤマボウシ・ハナミズキ","コブシ・タムシバ","アセビ・ドウダンツツジ","フジ・ハギ"]},{"q":"白い小花が短枝から数個下垂し、5裂した花冠。最有力候補は？","a":"エゴノキ","exp":"白い5裂花冠が下を向く。","choices":["エゴノキ","アセビ","キブシ","ミズキ"]},{"q":"細長いひも状の黄色い花弁4枚。最有力候補は？","a":"マンサク","exp":"マンサク科。花弁形状が強い手掛かり。","choices":["マンサク","レンギョウ","クロモジ","サンシュユ"]}];
const KEY="tree_flower_shortcuts_missed_v1";
let missed=new Set();try{missed=new Set(JSON.parse(localStorage.getItem(KEY)||"[]"))}catch(e){}
let order=[],index=0,selected={};
const $=id=>document.getElementById(id);
function save(){try{localStorage.setItem(KEY,JSON.stringify([...missed]))}catch(e){}}
function shuffle(a){for(let i=a.length-1;i>0;i--){let j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
function opts(q){return q.choices.slice()}
function start(){DATA.forEach(q=>delete q._choices);let arr=DATA.map((_,i)=>i);if($("miss").checked)arr=arr.filter(i=>missed.has(i));if(!arr.length){alert("復習対象の間違い問題はまだありません");return}if($("random").checked)shuffle(arr);order=arr.slice(0,$("size").value==="all"?arr.length:Number($("size").value));index=0;selected={};$("settings").classList.add("hidden");$("done").classList.add("hidden");$("study").classList.remove("hidden");render()}
function render(){
  if(index>=order.length){finish();return}
  const id=order[index],q=DATA[id],v=selected[id];
  $("progress").textContent=(index+1)+" / "+order.length;
  $("fill").style.width=(index/order.length*100)+"%";
  $("question").textContent=q.q;
  const container=$("options");
  container.replaceChildren();
  if(!q._choices)q._choices=shuffle(opts(q));
  const choices=q._choices;
  for(const a of choices){
    const b=document.createElement("button");
    b.type="button";
    b.className="option"+(v&&v.a===a?" chosen":"");
    b.textContent=a;
    b.disabled=Boolean(v);
    b.addEventListener("click",()=>choose(id,a,choices));
    container.appendChild(b);
  }
  $("feedback").classList.toggle("hidden",!v);
  if(v)$("feedback").textContent=(v.a===q.a?"✓ 正解":"× 不正解")+"｜正答："+q.a+"。 "+q.exp;
  $("next").disabled=!v;
  $("prev").disabled=index===0;
  $("next").textContent=index===order.length-1?"結果を見る →":"次の問題 →";
}
function choose(id,a,choices){selected[id]={a,choices};if(a===DATA[id].a)missed.delete(id);else missed.add(id);save();render()}
function finish(){$("study").classList.add("hidden");$("done").classList.remove("hidden");let correct=order.filter(i=>selected[i]?.a===DATA[i].a).length;$("summary").textContent=order.length+"問中 "+correct+"問正解。間違い履歴は保存しました。"}
function reset(){$("study").classList.add("hidden");$("done").classList.add("hidden");$("settings").classList.remove("hidden")}
$("start").onclick=start;$("home").onclick=reset;$("again").onclick=reset;$("prev").onclick=()=>{if(index>0){index--;render()}};$("next").onclick=()=>{if(selected[order[index]]){index++;render()}};
</script></body></html>

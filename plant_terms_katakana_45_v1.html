<!DOCTYPE html><html lang="ja"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><style>:root{font-family:system-ui,-apple-system,"Noto Sans JP",sans-serif;color:#203527;background:#f4f7f2}*{box-sizing:border-box}body{margin:0}main{max-width:680px;margin:auto;padding:14px 12px 40px}h1{font-size:21px;margin:0 0 5px}p{line-height:1.65}.muted{color:#587063;font-size:13px}.panel{background:white;padding:17px;border:1px solid #dbe5d9;border-radius:17px;margin:12px 0}label{display:block;font-size:13px;margin:11px 0 5px;font-weight:750}select,button{font:inherit;border-radius:11px;padding:11px;background:white;border:1px solid #cbd8c8;color:#203527}select{width:100%}button{cursor:pointer}button:disabled{opacity:.42}button.primary{background:#315b3b;color:white;font-weight:800;width:100%;margin-top:18px}.hide{display:none!important}.tag{font-size:12px;color:#627968;font-weight:750;display:flex;justify-content:space-between}.question{font-size:22px;font-weight:850;line-height:1.55;margin:18px 0}.choices{display:grid;gap:9px}.choices button{text-align:left;padding:14px 13px;background:#f9fbf8;font-weight:700;min-height:50px}.choices button.correct{background:#e3f5e3;border-color:#398c51}.choices button.wrong{background:#fff0ed;border-color:#b76b63}.choices button:disabled{opacity:1}.result{padding:14px;background:#f2f7ee;border-radius:12px;margin:14px 0;font-size:17px;font-weight:900}.small{font-size:13px;padding:7px 13px}.explain{font-size:14px;line-height:1.7;padding:11px;background:#faf9ef;border-radius:9px;margin-top:8px}.nav{display:grid;grid-template-columns:1fr 1fr;gap:9px;margin-top:17px}.nav button{font-size:13px}.bar{background:#e7eee4;height:6px;border-radius:20px;overflow:hidden;margin-top:10px}.bar>div{background:#47895a;height:100%;width:0}.alert{color:#a54738}header{background:white;border-bottom:1px solid #dbe5d9;padding:15px}header>div{max-width:650px;margin:auto} @media(max-width:400px){.question{font-size:20px}.panel{padding:13px}}</style></head><body><header><div><h1>植物・カタカナ用語トレーナー</h1><div class="muted">高校生物中心｜ホルモン・酵素・物質名・重要用語</div></div></header><main><section id="setup" class="panel"><h2>学習設定</h2><label>分野</label><select id="cat"><option value="all">すべて</option></select><label>出題</label><select id="mode"><option value="all">全問題</option><option value="wrong">前回×の問題を復習</option></select><label>問題数</label><select id="count"><option value="10">10問</option><option value="20">20問</option><option value="all">全部</option></select><label>順番</label><select id="order"><option value="normal">掲載順</option><option value="random">シャッフル</option></select><button class="primary" id="start">学習を始める</button><p class="muted">オフラインで使えます。×の記録は同じブラウザに保存されます。問題を選ぶと答えと「解説」ボタンが出ます。</p></section><section id="study" class="panel hide"><button class="small" id="back">← 設定に戻る</button><div class="tag" style="margin-top:12px"><span id="unit"></span><span id="index"></span></div><div class="bar"><div id="progress"></div></div><div class="question" id="q"></div><div id="choices" class="choices"></div><div id="result" class="result hide"></div><button id="exbtn" class="small hide">解説を見る ▾</button><div id="explain" class="explain hide"></div><div class="nav"><button id="prev">← 前へ</button><button id="next">次へ →</button></div></section><section id="done" class="panel hide"><h2>セット終了</h2><p id="score"></p><button class="primary" id="again">設定に戻る</button></section></main><script>
const DATA=[{"category":"ホルモン","q":"茎の伸長や頂芽優勢に関係する植物ホルモンは？","a":"オーキシン","note":"細胞伸長の調節や頂芽優勢、屈性などに関係する。","choices":["オーキシン","ジベレリン","エチレン","アブシシン酸"],"id":"t001"},{"category":"ホルモン","q":"種子発芽や茎の伸長の促進に関係するホルモンは？","a":"ジベレリン","note":"種子の休眠打破や伸長成長などに関わる。","choices":["ジベレリン","オーキシン","サイトカイニン","エチレン"],"id":"t002"},{"category":"ホルモン","q":"細胞分裂の促進などに関係する植物ホルモンは？","a":"サイトカイニン","note":"芽の形成や老化の遅延などにも関わる。","choices":["サイトカイニン","オーキシン","エチレン","アブシシン酸"],"id":"t003"},{"category":"ホルモン","q":"乾燥時の気孔閉鎖や種子休眠に関係するホルモンは？","a":"アブシシン酸","note":"ABAとも略す。乾燥ストレス応答を調節する。","choices":["アブシシン酸","エチレン","ジベレリン","サイトカイニン"],"id":"t004"},{"category":"ホルモン","q":"果実の成熟を促進する気体状の植物ホルモンは？","a":"エチレン","note":"多くの果実の成熟や老化などに関係する。","choices":["エチレン","オーキシン","ジベレリン","アブシシン酸"],"id":"t005"},{"category":"ホルモン","q":"傷害や病原体への防御応答などに関わるホルモンは？","a":"ジャスモン酸","note":"食害・傷害応答などで重要な情報伝達物質。","choices":["ジャスモン酸","サイトカイニン","オーキシン","ジベレリン"],"id":"t006"},{"category":"ホルモン","q":"病害抵抗性などの防御応答に関係する物質は？","a":"サリチル酸","note":"全身獲得抵抗性などの情報伝達に関与する。","choices":["サリチル酸","エチレン","ブラシノステロイド","オーキシン"],"id":"t007"},{"category":"ホルモン","q":"細胞伸長・細胞分裂や維管束分化などに関わるステロイド系ホルモンは？","a":"ブラシノステロイド","note":"植物の成長・発達を広く調節する。","choices":["ブラシノステロイド","アブシシン酸","サリチル酸","エチレン"],"id":"t008"},{"category":"ホルモン","q":"枝分かれ（腋芽成長）の抑制などに関係するホルモンは？","a":"ストリゴラクトン","note":"根からの菌根菌へのシグナルや寄生植物の発芽誘導にも関与。","choices":["ストリゴラクトン","サイトカイニン","ジベレリン","エチレン"],"id":"t009"},{"category":"光合成","q":"葉緑体で光エネルギーを吸収する代表的な緑色色素は？","a":"クロロフィル","note":"クロロフィルaは光化学反応の中心的な色素。","choices":["クロロフィル","カロテノイド","アントシアニン","フィトクロム"],"id":"t010"},{"category":"光合成","q":"光合成の補助色素で、黄〜橙色を示すものの総称は？","a":"カロテノイド","note":"光の吸収と過剰光からの保護に役立つ。","choices":["カロテノイド","クロロフィル","オーキシン","リグニン"],"id":"t011"},{"category":"光合成","q":"C3植物で二酸化炭素固定に働く酵素は？","a":"ルビスコ","note":"RuBPカルボキシラーゼ／オキシゲナーゼ。酸素とも反応する。","choices":["ルビスコ","PEPカルボキシラーゼ","アミラーゼ","セルラーゼ"],"id":"t012"},{"category":"光合成","q":"C4植物で二酸化炭素を最初に固定する主要酵素は？","a":"PEPカルボキシラーゼ","note":"ホスホエノールピルビン酸と炭酸水素イオンからオキサロ酢酸を生成。","choices":["PEPカルボキシラーゼ","ルビスコ","カタラーゼ","アミラーゼ"],"id":"t013"},{"category":"光合成","q":"C3植物でCO₂固定の最初の安定産物は？","a":"3-ホスホグリセリン酸","note":"炭素3個の化合物。略して3-PGA。","choices":["3-ホスホグリセリン酸","オキサロ酢酸","リンゴ酸","ピルビン酸"],"id":"t014"},{"category":"光合成","q":"C4回路で最初に生成される炭素4個の化合物は？","a":"オキサロ酢酸","note":"その後、リンゴ酸やアスパラギン酸などへ変換される。","choices":["オキサロ酢酸","3-ホスホグリセリン酸","グルコース","ルビスコ"],"id":"t015"},{"category":"光合成","q":"CAM植物で夜間に固定したCO₂を一時的に蓄える際に関わる有機酸は？","a":"リンゴ酸","note":"液胞などに蓄積し、昼にCO₂を放出して利用する。","choices":["リンゴ酸","クエン酸","酢酸","乳酸"],"id":"t016"},{"category":"光合成","q":"明反応でATPとともに作られる還元力は？","a":"NADPH","note":"カルビン回路での還元反応に使われる。","choices":["NADPH","NADH","FADH₂","アセチルCoA"],"id":"t017"},{"category":"光合成","q":"光合成の光反応が進む葉緑体内の膜は？","a":"チラコイド膜","note":"光化学系や電子伝達系が存在する。","choices":["チラコイド膜","核膜","液胞膜","細胞膜"],"id":"t018"},{"category":"光合成","q":"カルビン回路が行われる葉緑体内部の液状部分は？","a":"ストロマ","note":"チラコイドの外側にある葉緑体基質。","choices":["ストロマ","グラナ","サイトゾル","マトリックス"],"id":"t019"},{"category":"細胞・組織","q":"植物の細胞壁を構成する主要な多糖は？","a":"セルロース","note":"β-1,4-グルコースが連なった高分子。","choices":["セルロース","デンプン","グリコーゲン","キチン"],"id":"t020"},{"category":"細胞・組織","q":"木部の細胞壁を強化し、木化に関係する高分子は？","a":"リグニン","note":"二次細胞壁への沈着で強度と耐水性を高める。","choices":["リグニン","セルロース","ペクチン","クロロフィル"],"id":"t021"},{"category":"細胞・組織","q":"中葉に多く、細胞同士の接着に関係する多糖は？","a":"ペクチン","note":"細胞壁成分の一つ。果実のゲル化にも関係する。","choices":["ペクチン","リグニン","キチン","カロテノイド"],"id":"t022"},{"category":"細胞・組織","q":"植物の細胞間の原形質をつなぐ微小な連絡路は？","a":"原形質連絡","note":"プラスモデスマータともいう。物質やシグナルの移動に関わる。","choices":["原形質連絡","気孔","道管","ソーラス"],"id":"t023"},{"category":"細胞・組織","q":"成熟した道管要素で細胞内の生きた内容物は通常どうなる？","a":"消失する","note":"成熟時に細胞死を経て通水に適した管となる。","choices":["消失する","増殖する","光合成を始める","胞子になる"],"id":"t024"},{"category":"生殖","q":"被子植物で花粉管によって運ばれる雄性配偶子は？","a":"精細胞","note":"通常2個が重複受精に参加する。","choices":["精細胞","精子","卵細胞","極核"],"id":"t025"},{"category":"生殖","q":"シダ植物やコケ植物などで鞭毛を使い泳ぐ雄性配偶子は？","a":"精子","note":"受精に水が必要。イチョウやソテツにも運動性のある精子がある。","choices":["精子","精細胞","小胞子","花粉"],"id":"t026"},{"category":"生殖","q":"被子植物の胚嚢の中央細胞に通常2個ある核は？","a":"極核","note":"2個が融合している場合もある。精細胞との融合により胚乳の核が生じる。","choices":["極核","卵核","精核","核小体"],"id":"t027"},{"category":"生殖","q":"花粉管を受け入れる卵細胞の両側の細胞は？","a":"助細胞","note":"典型的な胚嚢には2個ある。","choices":["助細胞","反足細胞","孔辺細胞","精細胞"],"id":"t028"},{"category":"生殖","q":"典型的な胚嚢の珠孔と反対側にある3個の細胞は？","a":"反足細胞","note":"発達・機能には植物群によって違いがある。","choices":["反足細胞","助細胞","孔辺細胞","精細胞"],"id":"t029"},{"category":"生殖","q":"胚嚢内で卵細胞・助細胞などと別に存在する大きな細胞は？","a":"中央細胞","note":"通常2つの極核を持つ。胚乳形成に関わる。","choices":["中央細胞","卵細胞","花粉母細胞","孔辺細胞"],"id":"t030"},{"category":"生殖","q":"1つの精細胞と卵細胞、もう1つと中央細胞が融合する現象は？","a":"重複受精","note":"被子植物の典型的な生殖機構。胚と胚乳の形成につながる。","choices":["重複受精","自家受粉","無融合生殖","体細胞分裂"],"id":"t031"},{"category":"生殖","q":"被子植物で一般に3nとなる種子内の栄養組織は？","a":"胚乳","note":"中央細胞と精細胞の融合に由来する。例外もある。","choices":["胚乳","胚","種皮","珠皮"],"id":"t032"},{"category":"生殖","q":"シダ植物の配偶体で精子を作る器官は？","a":"造精器","note":"コケ植物にも見られる。","choices":["造精器","造卵器","胞子嚢","葯"],"id":"t033"},{"category":"生殖","q":"シダ植物の配偶体で卵細胞を作る器官は？","a":"造卵器","note":"造精器と対になる。","choices":["造卵器","造精器","花粉嚢","道管"],"id":"t034"},{"category":"生殖","q":"シダ植物の葉の裏にできる胞子嚢の集まりは？","a":"ソーラス","note":"胞子嚢群のこと。着生位置や包膜の有無が同定形質になる。","choices":["ソーラス","花序","柱頭","胚嚢"],"id":"t035"},{"category":"形態","q":"葉身が複数の小葉に分かれる葉は？","a":"複葉","note":"1枚の葉が複数の小葉から構成される。","choices":["複葉","単葉","托葉","苞葉"],"id":"t036"},{"category":"形態","q":"葉柄の基部付近にある付属器官は？","a":"托葉","note":"複葉とは別概念。ある植物では刺や巻きひげ状になる。","choices":["托葉","小葉","側根","葉鞘"],"id":"t037"},{"category":"形態","q":"葉の基部付近で茎を包むイネ科の構造は？","a":"葉鞘","note":"葉身との境界に葉舌や葉耳が見られることがある。","choices":["葉鞘","托葉","苞葉","花柱"],"id":"t038"},{"category":"形態","q":"イネ科で葉身と葉鞘の境界にある膜状・毛状構造は？","a":"葉舌","note":"属や種の識別に有用。","choices":["葉舌","葉耳","托葉","花被"],"id":"t039"},{"category":"形態","q":"茎や根の太さを増す分裂組織の一つは？","a":"維管束形成層","note":"内側に二次木部、外側に二次師部を作る。","choices":["維管束形成層","前形成層","頂端分裂組織","根冠"],"id":"t040"},{"category":"形態","q":"維管束形成層が内側へ作る組織は？","a":"二次木部","note":"木材の大部分を構成。外側には二次師部を作る。","choices":["二次木部","一次木部","二次師部","表皮"],"id":"t041"},{"category":"形態","q":"茎・根の周皮形成に関わる側方分裂組織は？","a":"コルク形成層","note":"外側へコルク細胞を作る。","choices":["コルク形成層","維管束形成層","前形成層","根端分裂組織"],"id":"t042"},{"category":"光応答","q":"赤色光と遠赤色光を受容する代表的な光受容体は？","a":"フィトクロム","note":"発芽や日長反応、避陰反応などを調節する。","choices":["フィトクロム","クリプトクロム","オーキシン","クロロフィル"],"id":"t043"},{"category":"光応答","q":"主に青色光を受け取る光受容体の一つは？","a":"クリプトクロム","note":"概日時計や形態形成などに関わる。","choices":["クリプトクロム","フィトクロム","リグニン","サイトカイニン"],"id":"t044"},{"category":"光応答","q":"青色光による光屈性で重要な光受容体は？","a":"フォトトロピン","note":"気孔開口や葉緑体運動などにも関与。","choices":["フォトトロピン","エチレン","フィトクロム","ルビスコ"],"id":"t045"}];
const KEY='botany_terms_v1';const el=id=>document.getElementById(id);
let scores={};try{scores=JSON.parse(localStorage.getItem(KEY)||'{}')||{}}catch(e){}
let pool=[],pos=0,results={},isRandom=false;
for(const c of [...new Set(DATA.map(x=>x.category))]){const o=document.createElement('option');o.value=c;o.textContent=c;el('cat').appendChild(o)}
function screen(s){for(const id of ['setup','study','done'])el(id).classList.toggle('hide',id!==s);scrollTo(0,0)}
function start(){pool=DATA.filter(c=>(el('cat').value==='all'||el('cat').value===c.category)&&(el('mode').value!=='wrong'||scores[c.id]===false));if(el('order').value==='random'){for(let i=pool.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[pool[i],pool[j]]=[pool[j],pool[i]]}}
const n=el('count').value; if(n!=='all')pool=pool.slice(0,Number(n));pos=0;results={};if(!pool.length){alert('この条件では問題がありません。');return}screen('study');render()}
function render(){const c=pool[pos];el('unit').textContent=c.category;el('index').textContent=`${pos+1} / ${pool.length}`;el('progress').style.width=(pos+1)/pool.length*100+'%';el('q').textContent=c.q;const btns=el('choices');btns.innerHTML='';const choiceList=[...c.choices];if(el('order').value==='random'){for(let i=choiceList.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[choiceList[i],choiceList[j]]=[choiceList[j],choiceList[i]]}}else{const shift=(pos*3+1)%choiceList.length;choiceList.push(...choiceList.splice(0,shift))}
for(const a of choiceList){const b=document.createElement('button');b.textContent=a;b.onclick=()=>choose(a);b.dataset.answer=a;btns.appendChild(b)}
el('exbtn').classList.add('hide');el('explain').classList.add('hide');el('explain').textContent=c.note;el('result').classList.add('hide');if(results[c.id]!==undefined)showSelection(results[c.id]);el('prev').disabled=pos===0;el('next').disabled=results[c.id]===undefined;el('next').textContent=pos===pool.length-1?'結果を見る →':'次へ →'}
function showSelection(a){const c=pool[pos],ok=a===c.a;el('result').classList.remove('hide');el('result').textContent=ok?'○ 正解！ '+c.a:'× 正解：'+c.a;el('result').classList.toggle('alert',!ok);el('exbtn').classList.remove('hide');for(const b of el('choices').children){b.disabled=true;b.classList.toggle('correct',b.dataset.answer===c.a);b.classList.toggle('wrong',b.dataset.answer===a&&!ok)}el('next').disabled=false}
function choose(a){const c=pool[pos];if(results[c.id]!==undefined)return;results[c.id]=a;scores[c.id]=a===c.a;try{localStorage.setItem(KEY,JSON.stringify(scores))}catch(e){}showSelection(a);el('next').disabled=false}
el('exbtn').onclick=()=>{el('explain').classList.toggle('hide');el('exbtn').textContent=el('explain').classList.contains('hide')?'解説を見る ▾':'解説を閉じる ▴'};
el('start').onclick=start;el('back').onclick=()=>screen('setup');el('again').onclick=()=>screen('setup');el('prev').onclick=()=>{if(pos>0){pos--;render();scrollTo(0,0)}};el('next').onclick=()=>{if(results[pool[pos].id]===undefined)return;if(pos<pool.length-1){pos++;render();scrollTo(0,0)}else{let n=pool.filter(c=>results[c.id]===c.a).length;el('score').textContent=`${pool.length}問中 ${n}問正解。×の問題は設定画面の復習モードから再挑戦できます。`;screen('done')}};
</script></body></html>

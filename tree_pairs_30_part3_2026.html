<!doctype html><html lang="ja"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#355c3a"><title>樹木の識別3 30問</title><style>*{box-sizing:border-box}body{margin:0;background:#f3f7f2;color:#223329;font-family:system-ui,-apple-system,"Noto Sans JP",sans-serif}main{max-width:690px;margin:auto;padding:12px 12px 35px}h1{font-size:20px;margin:9px 0}small,.muted{color:#607464}.box{background:white;border:1px solid #d8e5d8;border-radius:15px;padding:14px;margin:9px 0}label{display:block;font-weight:700;font-size:13px;margin:10px 0 5px}select,button{font:inherit;border-radius:10px;border:1px solid #b7cdb8;min-height:43px}select{width:100%;padding:8px;background:white}button{padding:9px;background:white;color:#214329;font-weight:700}.primary{background:#28613d;color:white;border-color:#28613d}.hide{display:none!important}.q{font-size:19px;line-height:1.5;font-weight:800;margin:11px 0}.opts button{width:100%;text-align:left;padding:10px 12px;margin:4px 0;min-height:43px}.opts button:disabled{opacity:1}.ok{background:#def3e0!important;border-color:#438c56!important}.ng{background:#fce6df!important;border-color:#c66a56!important}.nav{display:flex;gap:8px;margin:10px 0}.nav button{flex:1}.tip{background:#eef6ed;padding:10px;border-radius:9px;line-height:1.5;margin:8px 0}.tag{display:inline-block;border-radius:20px;background:#e5efe3;padding:4px 8px;font-size:12px}a{color:#27683a;text-decoration:none}#top{display:flex;justify-content:space-between;align-items:center;gap:12px}progress{width:100%;height:9px;accent-color:#377d4d}</style></head><body><main><div id="top"><h1>🌳 樹木の識別3 30問</h1><a href="./index.html">⌂ 学習ホーム</a></div><section class="box" id="setup"><div class="muted">重要10組 × 各3問。4択・解説・間違い復習</div><label>問題数</label><select id="limit"><option value="10">10問</option><option value="20">20問</option><option value="30" selected>全30問</option></select><label>出題範囲</label><select id="pool"><option value="all">全問題（ランダム）</option><option value="wrong">間違えた問題だけ</option><option value="unseen">未回答だけ</option></select><div id="stats" class="muted" style="margin:13px 0"></div><button id="start" class="primary" style="width:100%">学習開始</button></section><section class="box hide" id="study"><span class="tag" id="group"></span><div class="muted" id="count" style="margin:6px 0"></div><progress id="bar" value="0" max="100"></progress><div class="q" id="question"></div><div id="opts" class="opts"></div><div id="explain" class="tip hide"></div><div class="nav"><button id="back">← 一問戻る</button><button id="next" class="primary">次の問題 →</button></div><button id="quit" style="width:100%;min-height:35px;font-size:13px">設定へ戻る</button></section><section class="box hide" id="finish"><h2>学習結果</h2><p id="result"></p><button id="retry" class="primary" style="width:100%">設定へ戻る</button></section><p class="muted" style="font-size:11px">問題はオリジナルの学習用問題です。形態には個体差があるため、典型的な特徴を覚えてください。記録はこの端末のブラウザ内に保存します。</p></main><script>
const Q=[["針葉樹","ヒノキとサワラで、葉裏の白い気孔帯がY字状に見えやすいのは？","ヒノキ","サワラ","どちらも5本束生","どちらも葉裏が無紋","ヒノキは葉裏の白い気孔帯がY字状に見えることが多い。"],["針葉樹","ヒノキとサワラで、葉先が比較的尖り小枝が柔らかな印象なのは？","サワラ","ヒノキ","スギ","クロマツ","サワラは鱗片葉の先端が比較的尖る。"],["針葉樹","ヒノキとサワラの共通点は？","ヒノキ科で鱗片状の葉をつける","マツ科で2本束生する","ブナ科で殻斗をつける","落葉広葉樹である","両者ともヒノキ科ヒノキ属。"],["針葉樹","ツガとモミで、短い葉柄のような部分が枝に残ってざらつくのは？","ツガ","モミ","どちらも翼果をつける","どちらも複葉をつける","ツガは葉が落ちても葉枕が枝に残る。モミは葉が落ちると円い葉痕が残る。"],["針葉樹","ツガとモミで、球果が直立して成熟時に崩れるのは？","モミ","ツガ","アカマツ","スギ","モミ属の球果は直立し成熟すると鱗片が散る。"],["針葉樹","ツガとモミで、小型の球果が枝先から垂れ下がるのは？","ツガ","モミ","イチョウ","コナラ","ツガ属の球果は小さく下垂する。"],["ブナ科","クリとクヌギで、刺だらけの殻斗が堅果をほぼ完全に包むのは？","クリ","クヌギ","ブナ","シラカシ","クリは総苞由来の鋭い刺を多数もつ殻斗を形成。"],["ブナ科","クリとクヌギで、殻斗の鱗片が細長く外へ反り返るのは？","クヌギ","クリ","アラカシ","マテバシイ","クヌギのどんぐりは細長い鱗片の反り返った殻斗をもつ。"],["ブナ科","クリとクヌギの葉縁に共通する特徴は？","鋭い鋸歯が発達する","どちらも全縁である","どちらも掌状に裂ける","どちらも鱗片葉である","どちらも葉縁に発達した鋸歯があるが、果実で容易に区別できる。"],["ブナ科","カシワとミズナラで、葉の縁が大きく波打つような丸い裂片になるのは？","カシワ","ミズナラ","ツブラジイ","シラカシ","カシワは大きな波状の裂片をもつ葉が特徴。"],["ブナ科","カシワとミズナラで、殻斗の細長い鱗片が反り返るのは？","カシワ","ミズナラ","どちらも刺のある球形","どちらも殻斗がない","カシワはクヌギのように反り返る鱗片をもつ殻斗。"],["ブナ科","カシワとミズナラに共通する性質は？","落葉性のコナラ属","常緑性のシイ属","常緑性のマテバシイ属","落葉性のカエデ属","両種ともブナ科コナラ属の落葉樹。"],["クスノキ科","タブノキとシロダモで、葉裏が白っぽく見えやすいのは？","シロダモ","タブノキ","どちらも針葉","どちらも複葉","シロダモは葉裏が灰白色で3行脈が目立つ。"],["クスノキ科","タブノキとシロダモで、葉の多くが枝先に集まり比較的大きいのは？","タブノキ","シロダモ","クロマツ","クヌギ","タブノキの葉は革質で枝先に集まることが多い。"],["クスノキ科","シロダモが秋に見せる特徴として適切なのは？","花と前年の赤い果実が同時期に見られる","松ぼっくりをつける","どんぐりをつける","青い翼果をつける","シロダモは秋に開花し、前年の花由来の果実が赤く熟す。"],["落葉広葉樹","オニグルミとサワグルミで、硬い殻に包まれた大きな食用の核をつけるのは？","オニグルミ","サワグルミ","ケヤキ","イロハモミジ","オニグルミの核果状の果実には硬い核がある。"],["落葉広葉樹","オニグルミとサワグルミで、翼のある小果実が長い房になって垂れるのは？","サワグルミ","オニグルミ","クリ","モミ","サワグルミの果序は細長く垂れ、果実に翼がある。"],["落葉広葉樹","オニグルミとサワグルミに共通する所属科は？","クルミ科","ブナ科","ニレ科","マツ科","どちらもクルミ科。ともに羽状複葉をもつ。"],["常緑広葉樹","ツバキとサザンカで、花弁が基部で合着して花ごと落ちる傾向が強いのは？","ツバキ","サザンカ","どちらも液果をつける","どちらも針葉樹","ツバキ（ヤブツバキ）は花全体が落ちやすい。"],["常緑広葉樹","ツバキとサザンカで、花弁がばらばらに散る傾向があるのは？","サザンカ","ツバキ","どちらも球果をつける","どちらも花弁がない","サザンカは花弁が個別に散りやすい。園芸品種では例外がある。"],["常緑広葉樹","ツバキとサザンカの葉の共通点は？","互生する常緑の単葉で鋸歯がある","対生する掌状複葉である","針葉が2本束生する","葉が輪生する","ともにツバキ科ツバキ属で互生の革質葉をもつ。"],["カエデ類","イロハモミジとハウチワカエデで、葉の裂片が一般に細長いのは？","イロハモミジ","ハウチワカエデ","どちらも3出複葉","どちらも羽状複葉","イロハモミジの葉は5〜7裂し、裂片が比較的細い。"],["カエデ類","イロハモミジとハウチワカエデで、大きく丸みのある団扇状の葉をつけるのは？","ハウチワカエデ","イロハモミジ","メグスリノキ","トチノキ","ハウチワカエデは円みのある葉身が掌状に9〜11裂することが多い。"],["カエデ類","イロハモミジとハウチワカエデに共通する特徴は？","葉が対生し二つ一組の翼果をつける","葉が互生し殻斗をつける","葉が輪生し球果をつける","どちらも常緑性","カエデ属に共通する対生の葉と双翼果が見られる。"],["葉序","ミズキとクマノミズキで、葉が互生するのは？","ミズキ","クマノミズキ","どちらも輪生","どちらも針葉","ミズキは互生、クマノミズキは対生。"],["葉序","ミズキとクマノミズキで、葉が対生するのは？","クマノミズキ","ミズキ","どちらも互生","どちらも輪生","クマノミズキはミズキに似るが葉序が対生。"],["葉序","ミズキとクマノミズキに共通する所属科は？","ミズキ科","クスノキ科","ブナ科","ニレ科","どちらもミズキ科で、葉序が重要な識別点。"],["果実","キリとアオギリで、熟すと大きな蒴果が2裂し多数の翼のある種子を出すのは？","キリ","アオギリ","どちらもどんぐりをつける","どちらも液果になる","キリの果実は木質の蒴果で、細かい翼をもつ種子を多数含む。"],["果実","キリとアオギリで、袋果状の果実が裂け、縁に丸い種子が並ぶのは？","アオギリ","キリ","ハンノキ","ツガ","アオギリでは裂けた舟形の果実の縁に種子が並ぶ。"],["果実","キリとアオギリの現行の所属科の組合せは？","キリ＝キリ科、アオギリ＝アオイ科","キリ＝アオイ科、アオギリ＝キリ科","両方ともノウゼンカズラ科","両方ともブナ科","APG分類ではキリはキリ科、アオギリはアオイ科。"]]; const key="tree_pair_30_v3"; let history={};try{history=JSON.parse(localStorage.getItem(key)||"{}")}catch(e){};let round=[],pos=0,answers={};const $=id=>document.getElementById(id);const shuffle=a=>{const b=[...a];for(let i=b.length-1;i>0;i--){let j=Math.floor(Math.random()*(i+1));[b[i],b[j]]=[b[j],b[i]]}return b};function save(){try{localStorage.setItem(key,JSON.stringify(history))}catch(e){}}function show(id){for(const x of ["setup","study","finish"])$(x).classList.toggle("hide",x!==id)}function stats(){const vals=Object.values(history);$("stats").textContent="学習済み "+vals.length+"/30問 ｜ 要復習 "+vals.filter(v=>v===false).length+"問"}function start(){let ids=Q.map((_,i)=>i);if($("pool").value==="wrong")ids=ids.filter(i=>history[i]===false);if($("pool").value==="unseen")ids=ids.filter(i=>history[i]===undefined);if(!ids.length){alert("対象の問題がありません");return}round=shuffle(ids).slice(0,Number($("limit").value));answers={};pos=0;show("study");render()}function render(){const id=round[pos],q=Q[id];$("group").textContent=q[0];$("count").textContent=(pos+1)+" / "+round.length+"問";$("bar").value=(pos+1)/round.length*100;$("question").textContent=q[1];$("opts").innerHTML="";const opts=shuffle([q[2],q[3],q[4],q[5]]);for(const opt of opts){const b=document.createElement("button");b.textContent=opt;b.onclick=()=>answer(id,opt);$("opts").append(b)}$("explain").classList.add("hide");if(answers[id]!==undefined)reveal(id);$("back").disabled=pos===0;$("next").textContent=pos===round.length-1?"結果を見る →":"次の問題 →"}function answer(id,opt){if(answers[id]!==undefined)return;answers[id]=opt;history[id]=opt===Q[id][2];save();reveal(id)}function reveal(id){const q=Q[id],choice=answers[id];for(const b of $("opts").children){b.disabled=true;if(b.textContent===q[2])b.classList.add("ok");else if(b.textContent===choice)b.classList.add("ng")}$("explain").textContent=(choice===q[2]?"○ 正解！ ":"× 不正解。 正解："+q[2]+"。 ")+q[6];$("explain").classList.remove("hide")}function next(){if(pos<round.length-1){pos++;render()}else{const correct=round.filter(i=>answers[i]===Q[i][2]).length,done=round.filter(i=>answers[i]!==undefined).length;show("finish");$("result").textContent="正解 "+correct+" / "+round.length+"問（回答済み "+done+"問）。間違えた問題だけを復習できます。";stats()}}$("start").onclick=start;$("back").onclick=()=>{if(pos>0){pos--;render()}};$("next").onclick=next;$("quit").onclick=()=>{stats();show("setup")};$("retry").onclick=()=>{stats();show("setup")};stats();
</script></body></html>

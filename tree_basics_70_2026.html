<!doctype html><html lang="ja"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>樹木の基本 69問</title><style>*{box-sizing:border-box}body{margin:0;background:#f3f7f2;color:#223329;font-family:system-ui,-apple-system,"Noto Sans JP",sans-serif}main{max-width:690px;margin:auto;padding:18px 14px 60px}h1{font-size:23px;margin:10px 0}p{line-height:1.7}small,.muted{color:#607464}.box{background:white;border:1px solid #d8e5d8;border-radius:17px;padding:18px;margin:12px 0}label{display:block;font-size:14px;font-weight:700;margin:13px 0 5px}select,button{font:inherit;min-height:44px;border-radius:11px;border:1px solid #bbd0bd}select{width:100%;padding:9px;background:white}button{padding:10px 13px;background:white;color:#214329;font-weight:650;cursor:pointer}.primary{background:#28613d;color:white;border-color:#28613d}.options button{display:block;width:100%;margin:9px 0;text-align:left;padding:13px}.options button:disabled{opacity:1}.ok{background:#dcf3df!important;border-color:#39905b!important}.ng{background:#fbe7df!important;border-color:#bf715e!important}.row{display:flex;flex-wrap:wrap;gap:8px}.row button{flex:1}.tag{font-size:12px;background:#e9f0e9;border-radius:99px;padding:5px 9px;display:inline-block}.question{font-weight:800;font-size:21px;line-height:1.6;margin:17px 0}#explain{background:#eff7ee;padding:13px;border-radius:10px;line-height:1.8;margin:12px 0}progress{width:100%;height:12px;accent-color:#367c4c}.hide{display:none!important}a{color:#266443}</style></head><body><main><a href="./index.html">‹ 学習ホームに戻る</a><h1>🌲 樹木の基本 69問</h1><p class="muted">まずは針葉樹とブナ科・カバノキ科から。暗記カードと4択を切り替え、間違えた問題だけ復習できるで。</p><section id="setup" class="box"><label>学習形式</label><select id="mode"><option value="quiz">4択で確認</option><option value="flash">答えを隠す暗記カード</option></select><label>学習分野</label><select id="group"><option value="all">全分野</option></select><label>問題数</label><select id="limit"><option value="10">10問</option><option value="20" selected>20問</option><option value="999">全問</option></select><label>出題対象</label><select id="pool"><option value="all">すべて（ランダム）</option><option value="wrong">間違えた問題だけ</option><option value="unseen">未学習の問題だけ</option></select><p id="stats" class="muted"></p><button class="primary" style="width:100%" id="start">学習開始</button></section><section id="study" class="box hide"><span class="tag" id="category"></span><p class="muted" id="counter"></p><progress id="progress" value="0" max="100"></progress><div class="question" id="q"></div><div id="options" class="options"></div><div id="explain" class="hide"></div><div class="row"><button id="back">← 一問戻る</button><button id="next" class="primary">次へ →</button></div><div class="row" style="margin-top:10px"><button id="quit">設定画面へ</button></div></section><section id="finish" class="box hide"><h2>今回の学習結果</h2><p id="result"></p><button class="primary" id="again">設定画面へ戻る</button></section><p class="muted" style="font-size:12px">科の配置は現行のAPG系統分類を基本とし、針葉樹は現行の広いヒノキ科などを採用。樹木の特徴には種による例外があるので「通常」「代表的な」を意識して覚えてな。出題予想の独自学習問題で、過去問の原文ではありません。</p></main><script>const DB=[{"id":1,"group":"針葉樹","q":"スギ属の現在の所属科は？","a":"ヒノキ科","wrong":["マツ科","イチョウ科","イチイ科"],"why":"かつてのスギ科は現在ヒノキ科に含める。"},{"id":2,"group":"針葉樹","q":"アカマツ・クロマツの所属科は？","a":"マツ科","wrong":["ヒノキ科","イチイ科","ブナ科"],"why":"どちらもマツ属 Pinus。"},{"id":3,"group":"針葉樹","q":"モミ属 Abies の所属科は？","a":"マツ科","wrong":["ヒノキ科","イチイ科","マキ科"],"why":"モミ属はマツ科。"},{"id":4,"group":"針葉樹","q":"トウヒ属 Picea の所属科は？","a":"マツ科","wrong":["ヒノキ科","イチイ科","クスノキ科"],"why":"トウヒもマツ科。"},{"id":5,"group":"針葉樹","q":"ツガ属 Tsuga の所属科は？","a":"マツ科","wrong":["ヒノキ科","イチイ科","カバノキ科"],"why":"ツガ・コメツガはマツ科。"},{"id":6,"group":"針葉樹","q":"カラマツ属 Larix の所属科は？","a":"マツ科","wrong":["ヒノキ科","イチョウ科","ニレ科"],"why":"落葉針葉樹でもマツ科。"},{"id":7,"group":"針葉樹","q":"メタセコイア属 Metasequoia の現在の所属科は？","a":"ヒノキ科","wrong":["マツ科","イチョウ科","ブナ科"],"why":"旧スギ科に分類されたが現在はヒノキ科。"},{"id":8,"group":"針葉樹","q":"ネズミサシ属 Juniperus の所属科は？","a":"ヒノキ科","wrong":["マツ科","イチイ科","マキ科"],"why":"ビャクシン類を含む。"},{"id":9,"group":"針葉樹","q":"マツ属 Pinus の葉の特徴は？","a":"短枝に束生する","wrong":["広い単葉が対生する","羽状複葉になる","葉をもたない"],"why":"針葉が束生。二葉松や五葉松がある。"},{"id":10,"group":"針葉樹","q":"アカマツの針葉は通常何本束？","a":"2本","wrong":["1本","3本","5本"],"why":"アカマツ・クロマツは代表的な二葉松。"},{"id":11,"group":"針葉樹","q":"ゴヨウマツの針葉は通常何本束？","a":"5本","wrong":["1本","2本","3本"],"why":"五葉松の代表。"},{"id":12,"group":"針葉樹","q":"日本のハイマツの針葉は通常何本束？","a":"5本","wrong":["1本","2本","3本"],"why":"高山帯のハイマツは五葉松。"},{"id":13,"group":"針葉樹","q":"熟した球果が直立し鱗片がばらけやすい属は？","a":"モミ属 Abies","wrong":["トウヒ属 Picea","マツ属 Pinus","カラマツ属 Larix"],"why":"モミの球果は枝上で崩れる。"},{"id":14,"group":"針葉樹","q":"球果が一般に下向きに垂れる属は？","a":"トウヒ属 Picea","wrong":["モミ属 Abies","イチョウ属 Ginkgo","スギ属 Cryptomeria"],"why":"トウヒでは成熟した球果が垂れ下がる。"},{"id":15,"group":"針葉樹","q":"次のうち落葉する針葉樹は？","a":"カラマツ","wrong":["スギ","ヒノキ","クロマツ"],"why":"カラマツは秋に葉を落とす。"},{"id":16,"group":"針葉樹","q":"次のうち落葉する裸子植物は？","a":"イチョウ","wrong":["ヒノキ","クロマツ","スギ"],"why":"イチョウは扇形の葉をもつ落葉裸子植物。"},{"id":17,"group":"針葉樹","q":"ヒノキの枝葉の特徴として適切なのは？","a":"鱗片葉が平面的につく","wrong":["針葉が5本束生する","大型の羽状複葉をつける","幅広い対生の単葉をつける"],"why":"ヒノキは鱗片葉をつけ小枝が扁平。"},{"id":18,"group":"針葉樹","q":"裸子植物の種子に関して正しいのは？","a":"胚珠が子房に包まれない","wrong":["胚珠が子房内にある","すべて果実をつくる","すべて落葉する"],"why":"裸子植物は被子植物と異なり子房をつくらない。"},{"id":19,"group":"ブナ科","q":"Quercus は何属？","a":"コナラ属","wrong":["ブナ属","クリ属","シイ属"],"why":"コナラ・カシ類を含む。"},{"id":20,"group":"ブナ科","q":"Fagus は何属？","a":"ブナ属","wrong":["コナラ属","クリ属","マテバシイ属"],"why":"ブナの学名は Fagus crenata。"},{"id":21,"group":"ブナ科","q":"Castanea は何属？","a":"クリ属","wrong":["シイ属","ブナ属","コナラ属"],"why":"クリはブナ科。"},{"id":22,"group":"ブナ科","q":"Castanopsis は何属？","a":"シイ属","wrong":["クリ属","コナラ属","マテバシイ属"],"why":"スダジイなど。"},{"id":23,"group":"ブナ科","q":"Lithocarpus は何属？","a":"マテバシイ属","wrong":["コナラ属","ブナ属","クリ属"],"why":"マテバシイ類。"},{"id":24,"group":"ブナ科","q":"ブナ科のドングリに見られるカップ状の構造は？","a":"殻斗","wrong":["托葉","苞鞘","珠皮"],"why":"殻斗は堅果の基部や全体を包む。"},{"id":25,"group":"ブナ科","q":"ブナ科に典型的な果実は？","a":"堅果","wrong":["液果","蒴果","核果"],"why":"ドングリなどの堅果をつくる。"},{"id":26,"group":"ブナ科","q":"ブナの殻斗内に通常入る堅果は何個？","a":"2個","wrong":["1個","4個","6個"],"why":"ブナの殻斗は通常2個の堅果を包む。"},{"id":27,"group":"ブナ科","q":"次のうち常緑性のコナラ属は？","a":"シラカシ","wrong":["コナラ","ミズナラ","カシワ"],"why":"シラカシ・アラカシなどは常緑のカシ類。"},{"id":28,"group":"ブナ科","q":"次のうち落葉性のコナラ属は？","a":"ミズナラ","wrong":["アラカシ","シラカシ","ウバメガシ"],"why":"ミズナラは夏緑広葉樹。"},{"id":29,"group":"ブナ科","q":"ブナの学名は？","a":"Fagus crenata","wrong":["Quercus serrata","Castanea crenata","Betula platyphylla"],"why":"crenata の種小名だけでなく属名も確認。"},{"id":30,"group":"カバノキ科","q":"Alnus は何属？","a":"ハンノキ属","wrong":["カバノキ属","クマシデ属","ブナ属"],"why":"ハンノキはカバノキ科。"},{"id":31,"group":"カバノキ科","q":"Betula は何属？","a":"カバノキ属","wrong":["ハンノキ属","クリ属","ケヤキ属"],"why":"シラカンバなど。"},{"id":32,"group":"カバノキ科","q":"Carpinus は何属？","a":"クマシデ属","wrong":["カバノキ属","ハンノキ属","ブナ属"],"why":"クマシデ・イヌシデなど。"},{"id":33,"group":"カバノキ科","q":"Ostrya は何属？","a":"アサダ属","wrong":["クマシデ属","ハンノキ属","ブナ属"],"why":"アサダはカバノキ科。"},{"id":34,"group":"カバノキ科","q":"木質化して小さな松ぼっくり状の果序をつくる属は？","a":"ハンノキ属","wrong":["カエデ属","モクレン属","ツバキ属"],"why":"ハンノキの雌花序は木質化する。"},{"id":35,"group":"カバノキ科","q":"葉状の苞が果実に伴うことで識別しやすい属は？","a":"クマシデ属","wrong":["モミ属","ニレ属","マツ属"],"why":"果実の周囲の苞の形を見る。"},{"id":36,"group":"カバノキ科","q":"小さな翼のある果実が特徴の属は？","a":"カバノキ属","wrong":["クリ属","ツバキ属","モミ属"],"why":"カバノキ属には翼のある小堅果が多い。"},{"id":37,"group":"カバノキ科","q":"ハンノキ属とカバノキ属の共通する所属科は？","a":"カバノキ科","wrong":["ブナ科","ニレ科","マツ科"],"why":"どちらも Betulaceae。"},{"id":38,"group":"新分類","q":"Acer（カエデ属）のAPG分類での科は？","a":"ムクロジ科","wrong":["カエデ科","ニレ科","ブナ科"],"why":"旧カエデ科はムクロジ科に含める。"},{"id":39,"group":"新分類","q":"Aesculus（トチノキ属）の現在の科は？","a":"ムクロジ科","wrong":["トチノキ科","ブナ科","カバノキ科"],"why":"旧トチノキ科はムクロジ科に含める。"},{"id":40,"group":"新分類","q":"Celtis（エノキ属）の現在の科は？","a":"アサ科","wrong":["ニレ科","ブナ科","ヤナギ科"],"why":"旧ニレ科からアサ科に移された。"},{"id":41,"group":"新分類","q":"Aphananthe（ムクノキ属）の現在の科は？","a":"アサ科","wrong":["ニレ科","クスノキ科","ツバキ科"],"why":"エノキ属と同様にアサ科。"},{"id":42,"group":"新分類","q":"Zelkova（ケヤキ属）の科は？","a":"ニレ科","wrong":["アサ科","カバノキ科","ブナ科"],"why":"ケヤキはニレ科のまま。"},{"id":43,"group":"新分類","q":"Ulmus（ニレ属）の科は？","a":"ニレ科","wrong":["アサ科","ムクロジ科","マツ科"],"why":"ニレ属は Ulmaceae。"},{"id":44,"group":"新分類","q":"Juglans（クルミ属）の科は？","a":"クルミ科","wrong":["ブナ科","マツ科","ニレ科"],"why":"クルミ科 Juglandaceae。"},{"id":45,"group":"新分類","q":"Salix（ヤナギ属）の科は？","a":"ヤナギ科","wrong":["ブナ科","クスノキ科","ムクロジ科"],"why":"Salicaceae。"},{"id":46,"group":"新分類","q":"Cinnamomum（ニッケイ属）の科は？","a":"クスノキ科","wrong":["モクレン科","ツバキ科","ニレ科"],"why":"クスノキなどが含まれる。"},{"id":47,"group":"新分類","q":"Machilus（タブノキ属）の科は？","a":"クスノキ科","wrong":["モクレン科","ブナ科","ヤナギ科"],"why":"タブノキはクスノキ科。"},{"id":48,"group":"新分類","q":"Camellia（ツバキ属）の科は？","a":"ツバキ科","wrong":["ブナ科","ムクロジ科","バラ科"],"why":"Theaceae。"},{"id":49,"group":"新分類","q":"Ilex（モチノキ属）の科は？","a":"モチノキ科","wrong":["ツツジ科","ムクロジ科","ブナ科"],"why":"Aquifoliaceae。"},{"id":50,"group":"新分類","q":"Magnolia（モクレン属）の科は？","a":"モクレン科","wrong":["クスノキ科","マツ科","ブナ科"],"why":"Magnoliaceae。"},{"id":51,"group":"葉と果実","q":"トチノキの葉は？","a":"掌状複葉","wrong":["羽状複葉","針状葉","単葉"],"why":"小葉が掌状に集まる。"},{"id":52,"group":"葉と果実","q":"クルミの葉は？","a":"羽状複葉","wrong":["掌状複葉","鱗片葉","針状葉"],"why":"多数の小葉が羽状につく。"},{"id":53,"group":"葉と果実","q":"カエデ属の一般的な葉序は？","a":"対生","wrong":["互生","輪生","束生"],"why":"カエデの多くは対生。"},{"id":54,"group":"葉と果実","q":"コナラ属の一般的な葉序は？","a":"互生","wrong":["対生","輪生","束生"],"why":"コナラ・カシ類は互生。"},{"id":55,"group":"葉と果実","q":"トネリコ属の葉序は？","a":"対生","wrong":["互生","輪生","束生"],"why":"トネリコ類は対生で複葉の種も多い。"},{"id":56,"group":"葉と果実","q":"ケヤキ属の葉縁の特徴は？","a":"鋸歯が明瞭","wrong":["針葉が束生","鱗片葉のみ","葉縁がすべて深裂"],"why":"ケヤキの葉は鋸歯があり左右非対称な葉基も手がかり。"},{"id":57,"group":"葉と果実","q":"サクラやウメの果実の型は？","a":"核果","wrong":["堅果","翼果","蒴果"],"why":"種子を硬い内果皮が包む。"},{"id":58,"group":"葉と果実","q":"カエデ属の果実の代表的な特徴は？","a":"翼がある分果","wrong":["大きな液果","細長い豆果","松かさ状の球果"],"why":"多くは2個の翼果状の分果からなる。"},{"id":59,"group":"葉と果実","q":"ツバキの果実の型は？","a":"蒴果","wrong":["堅果","核果","翼果"],"why":"熟すと裂開して種子を出す。"},{"id":60,"group":"葉と果実","q":"モクレン属に典型的な果実は？","a":"集合果","wrong":["堅果","豆果","穎果"],"why":"多数の心皮由来の果実が集まる。"},{"id":61,"group":"冬芽・植生","q":"鱗芽とは？","a":"芽鱗に覆われる芽","wrong":["芽鱗をもたない芽","必ず花だけになる芽","根の先端の芽"],"why":"サクラやブナなどで見られる。"},{"id":62,"group":"冬芽・植生","q":"裸芽とは？","a":"芽鱗をもたない芽","wrong":["芽鱗に覆われる芽","必ず地下にある芽","種子の中の芽"],"why":"ムラサキシキブなどに見られる。"},{"id":63,"group":"冬芽・植生","q":"葉が落ちた枝に残る跡は？","a":"葉痕","wrong":["皮目","気孔","托葉"],"why":"葉痕には維管束痕が見える場合がある。"},{"id":64,"group":"冬芽・植生","q":"冬芽のうち枝先につく芽は？","a":"頂芽","wrong":["側芽","不定根","仮根"],"why":"側芽は枝の側面につく。"},{"id":65,"group":"冬芽・植生","q":"暖温帯の照葉樹林の代表は？","a":"シイ・カシ・タブノキ","wrong":["ブナ・ミズナラ","シラビソ・コメツガ","ハイマツのみ"],"why":"常緑広葉樹林が代表的。"},{"id":66,"group":"冬芽・植生","q":"冷温帯の夏緑広葉樹林の代表は？","a":"ブナ・ミズナラ","wrong":["シイ・タブノキ","マングローブ","サボテン類"],"why":"冷温帯には落葉広葉樹林が発達。"},{"id":67,"group":"冬芽・植生","q":"亜高山帯の針葉樹林の代表は？","a":"シラビソ・コメツガ","wrong":["アラカシ・タブノキ","クロマツ・アダン","ヤマモモ・シイ"],"why":"標高と地域で植生帯は変わる。"},{"id":68,"group":"冬芽・植生","q":"日本の高山帯でよく見られる低木状のマツ属は？","a":"ハイマツ","wrong":["クロマツ","アカマツ","スギ"],"why":"ハイマツは高山帯などに群落をつくる。"},{"id":69,"group":"冬芽・植生","q":"ヤナギ属の花の特徴は？","a":"尾状花序をつくる","wrong":["大型の花被が必ず5枚ある","すべて両性花である","球果に花をつける"],"why":"ヤナギ類は一般に雌雄異株で尾状花序をつくる。"}];const KEY="tree_basics_70_2026_progress_v1";let saved={};try{saved=JSON.parse(localStorage.getItem(KEY)||"{}")}catch(e){}let items=[],pos=0,answers={},kind="quiz";const $=id=>document.getElementById(id);const groups=[...new Set(DB.map(x=>x.group))];groups.forEach(g=>{let op=document.createElement("option");op.value=g;op.textContent=g;$("group").appendChild(op)});function shuffle(a){return a.sort(()=>Math.random()-.5)}function save(){try{localStorage.setItem(KEY,JSON.stringify(saved))}catch(e){}}function stats(){$("stats").textContent="登録 "+DB.length+"問 ／ 学習済 "+Object.keys(saved).length+"問 ／ 要復習 "+Object.values(saved).filter(x=>x===false).length+"問"}stats();function show(which){["setup","study","finish"].forEach(x=>$(x).classList.toggle("hide",x!==which))}function start(){kind=$("mode").value;let g=$("group").value,p=$("pool").value;items=shuffle(DB.filter(x=>(g==="all"||x.group===g)&&(p==="all"||(p==="wrong"?saved[x.id]===false:!(x.id in saved))))).slice(0,Number($("limit").value));if(!items.length){alert("この条件では問題がありません。条件を変更してな。");return}items=items.map(x=>({...x,opts:shuffle([x.a,...x.wrong])}));pos=0;answers={};show("study");render()}function render(){let x=items[pos];$("category").textContent=x.group;$("counter").textContent=(pos+1)+" / "+items.length;$("progress").value=100*pos/items.length;$("q").textContent=x.q;$("options").innerHTML="";$("explain").classList.add("hide");$("next").textContent=pos===items.length-1?"結果を見る":"次へ →";$("back").disabled=pos===0;let a=answers[x.id];if(kind==="quiz"){x.opts.forEach((s,i)=>{let b=document.createElement("button");b.textContent=(i+1)+". "+s;if(a){b.disabled=true;if(s===x.a)b.classList.add("ok");else if(a.choice===s)b.classList.add("ng")}b.onclick=()=>{if(answers[x.id])return;answers[x.id]={choice:s,correct:s===x.a};saved[x.id]=s===x.a;save();render()};$("options").append(b)})}else{let b=document.createElement("button");b.textContent=a?"答え："+x.a:"答えを見る";b.className="primary";b.style.width="100%";b.onclick=()=>{if(!answers[x.id])answers[x.id]={choice:"reveal",correct:null};render()};$("options").append(b);if(a){let r=document.createElement("div");r.className="row";r.innerHTML='<button>× まだ覚えてない</button><button class="primary">○ 覚えた</button>';r.children[0].onclick=()=>{answers[x.id]={choice:"×",correct:false};saved[x.id]=false;save();render()};r.children[1].onclick=()=>{answers[x.id]={choice:"○",correct:true};saved[x.id]=true;save();render()};$("options").append(r)}}if(a){$("explain").classList.remove("hide");$("explain").textContent="正解： "+x.a+"　｜　"+x.why}$("next").disabled=!a||a.correct===null}function finish(){const done=items.filter(x=>answers[x.id]&&answers[x.id].correct===true).length;$("result").textContent=items.length+"問中 "+done+"問正解。間違えた項目は「出題対象 → 間違えた問題だけ」で復習できるで。";$("progress").value=100;stats();show("finish")}$("start").onclick=start;$("next").onclick=()=>{if(pos===items.length-1){finish();return}pos++;render()};$("back").onclick=()=>{if(pos>0){pos--;render()}};$("quit").onclick=()=>{stats();show("setup")};$("again").onclick=()=>{stats();show("setup")};</script></body></html>

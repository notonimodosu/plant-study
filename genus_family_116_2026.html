<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1"><title>属から科を当てる｜植物2級</title><style>
*{box-sizing:border-box}html,body{margin:0;height:100%;overflow:hidden}body{font-family:system-ui,"Noto Sans JP",sans-serif;background:#f0f5f1;color:#173d2b}.wrap{height:100dvh;max-width:650px;margin:auto;padding:12px;display:flex;flex-direction:column}.panel{background:white;border:1px solid #d5e2d8;border-radius:20px;padding:16px;max-height:100%;overflow:hidden}h1{font-size:21px;margin:6px 0 14px}h2{font-size:22px;margin:10px 0 18px}.sub{color:#637c6c;font-size:13px}label{display:block;margin:15px 0 5px;font-weight:700}select,button{font:inherit;border-radius:13px;padding:12px;border:1px solid #c6d8cd;background:white;color:#19442d}select{width:100%}button{cursor:pointer}button:disabled{opacity:.4}.primary{background:#88b19e;color:white;border:0;font-weight:700}.hidden{display:none!important}.top{display:flex;justify-content:space-between;align-items:center}.tiny{font-size:13px;padding:8px 10px}.pill{background:#eaf4ee;border-radius:30px;padding:6px 11px;font-size:13px}.choices{display:grid;grid-template-columns:1fr;gap:9px}.choices button{min-height:54px;text-align:left;font-weight:700;padding:12px 16px}.choices .correct{background:#d6f1dc;border-color:#57a673}.choices .wrong{background:#ffe0dc;border-color:#d78076}.controls{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:10px}.controls button{font-weight:700;min-height:52px}.feedback{min-height:27px;font-size:14px;font-weight:700;margin:10px 0 2px}.card{border:1px solid #9ebba9;border-radius:18px;min-height:180px;display:grid;place-items:center;text-align:center;font-size:27px;font-weight:800;padding:20px}.note{font-size:13px;color:#698072;margin-top:12px}#game{display:flex;flex-direction:column;justify-content:flex-start}#cardBtns{margin-top:12px;display:grid;grid-template-columns:1fr 1fr;gap:8px}@media(max-height:700px){.wrap{padding:6px}.panel{padding:12px}h2{margin:7px 0 11px}.choices{gap:6px}.choices button{min-height:46px;padding:9px 13px}.controls button{min-height:46px}.feedback{margin:6px </style></head><body><main class="wrap"><section class="panel" id="settings"><h1>🌱 属から科を当てる</h1><p class="sub">重要30科・116属｜四択／暗記カード</p><label>学習モード</label><select id="mode"><option value="quiz">四択</option><option value="card">暗記カード</option></select><label>出題数</label><select id="count"><option value="10">10問</option><option value="20">20問</option><option value="all">全116問</option></select><label>出題範囲</label><select id="scope"><option value="all">すべて</option><option value="missed">間違えた問題だけ</option></select><p class="note">四択は解答後に正誤表示。暗記カードはタップで答えを表示して○×を記録。</p><button class="primary" style="width:100%;margin-top:15px" onclick="start()">学習スタート</button><p class="note"><a href="./index.html">← 学習ホーム</a></p></section><section class="panel hidden" id="game"><div class="top"><span class="pill" id="progress"></span><button class="tiny" onclick="home()">設定へ戻る</button></div><div class="top"><h2 id="question"></h2><span class="pill" id="score"></span></div><div id="choices" class="choices"></div><div id="cardArea" class="hidden"><div id="card" class="card" onclick="flip()">タップして答えを見る</div><div id="cardBtns"><button onclick="mark(false)">× まだ</button><button class="primary" onclick="mark(true)">○ 覚えた</button></div></div><div class="feedback" id="feedback"></div><div class="controls"><button id="prev" onclick="back()">← 一問戻る</button><button id="next" class="primary" onclick="next()">次の問題 →</button></div></section><section class="panel hidden" id="end"><h1>学習終了！</h1><p id="result"></p><button class="primary" onclick="home()">設定へ戻る</button></section></main><script>
const DATA=[["ブナ属","ブナ科"],["コナラ属","ブナ科"],["クリ属","ブナ科"],["マテバシイ属","ブナ科"],["カバノキ属","カバノキ科"],["ハンノキ属","カバノキ科"],["クマシデ属","カバノキ科"],["ハシバミ属","カバノキ科"],["クスノキ属","クスノキ科"],["タブノキ属","クスノキ科"],["シロダモ属","クスノキ科"],["クロモジ属","クスノキ科"],["カエデ属","ムクロジ科"],["トチノキ属","ムクロジ科"],["ムクロジ属","ムクロジ科"],["サクラ属","バラ科"],["バラ属","バラ科"],["キイチゴ属","バラ科"],["ナナカマド属","バラ科"],["ワレモコウ属","バラ科"],["フジ属","マメ科"],["クズ属","マメ科"],["ネムノキ属","マメ科"],["ハギ属","マメ科"],["エンジュ属","マメ科"],["ツツジ属","ツツジ科"],["アセビ属","ツツジ科"],["スノキ属","ツツジ科"],["ギンリョウソウ属","ツツジ科"],["イチヤクソウ属","ツツジ科"],["トネリコ属","モクセイ科"],["イボタノキ属","モクセイ科"],["レンギョウ属","モクセイ科"],["モクセイ属","モクセイ科"],["サンショウ属","ミカン科"],["キハダ属","ミカン科"],["コクサギ属","ミカン科"],["ミカン属","ミカン科"],["ミズキ属","ミズキ科"],["アジサイ属","アジサイ科"],["ウツギ属","アジサイ科"],["バイカウツギ属","アジサイ科"],["ニシキギ属","ニシキギ科"],["ツルウメモドキ属","ニシキギ科"],["シナノキ属","アオイ科"],["フヨウ属","アオイ科"],["アオイ属","アオイ科"],["ヤナギ属","ヤナギ科"],["ヤマナラシ属","ヤナギ科"],["イイギリ属","ヤナギ科"],["タンポポ属","キク科"],["ヨモギ属","キク科"],["アザミ属","キク科"],["キオン属","キク科"],["ススキ属","イネ科"],["ヨシ属","イネ科"],["チガヤ属","イネ科"],["エノコログサ属","イネ科"],["スゲ属","カヤツリグサ科"],["カヤツリグサ属","カヤツリグサ科"],["ホタルイ属","カヤツリグサ科"],["ワタスゲ属","カヤツリグサ科"],["セリ属","セリ科"],["ミツバ属","セリ科"],["シシウド属","セリ科"],["ハマボウフウ属","セリ科"],["シソ属","シソ科"],["オドリコソウ属","シソ科"],["キランソウ属","シソ科"],["タツナミソウ属","シソ科"],["アブラナ属","アブラナ科"],["タネツケバナ属","アブラナ科"],["ナズナ属","アブラナ科"],["ワサビ属","アブラナ科"],["ハコベ属","ナデシコ科"],["ミミナグサ属","ナデシコ科"],["ナデシコ属","ナデシコ科"],["センノウ属","ナデシコ科"],["イタドリ属","タデ科"],["ギシギシ属","タデ科"],["タデ属","タデ科"],["ソバ属","タデ科"],["トリカブト属","キンポウゲ科"],["イチリンソウ属","キンポウゲ科"],["センニンソウ属","キンポウゲ科"],["オダマキ属","キンポウゲ科"],["ユリ属","ユリ科"],["カタクリ属","ユリ科"],["バイモ属","ユリ科"],["チューリップ属","ユリ科"],["シュンラン属","ラン科"],["エビネ属","ラン科"],["ネジバナ属","ラン科"],["セッコク属","ラン科"],["タシロラン属","ラン科"],["テンナンショウ属","サトイモ科"],["ミズバショウ属","サトイモ科"],["ザゼンソウ属","サトイモ科"],["ウキクサ属","サトイモ科"],["ギボウシ属","キジカクシ科"],["ジャノヒゲ属","キジカクシ科"],["ヤブラン属","キジカクシ科"],["アマドコロ属","キジカクシ科"],["スギ属","ヒノキ科"],["ヒノキ属","ヒノキ科"],["アスナロ属","ヒノキ科"],["ビャクシン属","ヒノキ科"],["マツ属","マツ科"],["モミ属","マツ科"],["ツガ属","マツ科"],["トウヒ属","マツ科"],["カラマツ属","マツ科"],["ノキシノブ属","ウラボシ科"],["ヒトツバ属","ウラボシ科"],["マメヅタ属","ウラボシ科"],["ミツデウラボシ属","ウラボシ科"]],families=[...new Set(DATA.map(x=>x[1]))];let deck=[],idx=0,records={},flipped=false,mode="quiz";let missed=new Set(JSON.parse(localStorage.getItem("genusMissed")||"[]"));const el=id=>document.getElementById(id);function shuffle(a){let b=[...a];for(let i=b.length-1;i>0;i--){let j=Math.floor(Math.random()*(i+1));[b[i],b[j]]=[b[j],b[i]]}return b}function show(id){for(let s of ["settings","game","end"])el(s).classList.toggle("hidden",s!==id)}function home(){show("settings")}function save(){localStorage.setItem("genusMissed",JSON.stringify([...missed]))}function start(){mode=el("mode").value;let pool=DATA.filter(x=>el("scope").value==="all"||missed.has(x[0]));if(!pool.length){alert("復習対象がありません");return}let n=el("count").value==="all"?pool.length:Number(el("count").value);deck=shuffle(pool).slice(0,n).map(x=>({genus:x[0],family:x[1],choices:shuffle([x[1],...shuffle(families.filter(f=>f!==x[1])).slice(0,3)])}));idx=0;records={};show("game");render()}function render(){if(idx>=deck.length){finish();return}let q=deck[idx],r=records[idx];flipped=!!r;el("progress").textContent=(idx+1)+" / "+deck.length+" 問";el("score").textContent="正解 "+Object.values(records).filter(x=>x.correct).length;el("question").textContent=q.genus+" は何科？";el("choices").classList.toggle("hidden",mode!=="quiz");el("cardArea").classList.toggle("hidden",mode!=="card");el("prev").disabled=idx===0;el("next").disabled=!r;el("feedback").textContent=r?(r.correct?"○ 正解・覚えた！":"× 正解は "+q.family):"正しい科を選んでください。";if(mode==="quiz"){el("choices").innerHTML="";q.choices.forEach(f=>{let b=document.createElement("button");b.textContent=f;if(r){b.disabled=true;if(f===q.family)b.classList.add("correct");else if(f===r.choice)b.classList.add("wrong")}b.onclick=()=>answer(f);el("choices").appendChild(b)})}else{el("card").textContent=flipped?q.family:"タップして答えを見る";for(let b of el("cardBtns").querySelectorAll("button"))b.disabled=!!r;el("feedback").textContent=r?(r.correct?"○ 覚えた":"× 復習に登録"):"カードをタップして答えを確認" }}function answer(f){if(records[idx])return;let q=deck[idx],correct=f===q.family;records[idx]={choice:f,correct};if(correct)missed.delete(q.genus);else missed.add(q.genus);save();render()}function flip(){if(mode!=="card"||records[idx])return;flipped=!flipped;el("card").textContent=flipped?deck[idx].family:"タップして答えを見る"}function mark(correct){if(!flipped||records[idx])return;let q=deck[idx];records[idx]={correct};if(correct)missed.delete(q.genus);else missed.add(q.genus);save();render()}function next(){if(!records[idx])return;idx++;render()}function back(){if(idx>0){idx--;render()}}function finish(){show("end");el("result").textContent=deck.length+"問中 "+Object.values(records).filter(x=>x.correct).length+"問 正解／覚えた。復習対象 "+missed.size+"属"}

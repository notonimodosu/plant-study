<!doctype html><html lang="ja"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>樹木識別4｜30問</title><style>body{font-family:system-ui,sans-serif;background:#f5f7f3;color:#213129;margin:0}main{max-width:650px;margin:auto;padding:15px}h1{font-size:23px}button,select{font:inherit;border:1px solid #b6c5b7;border-radius:12px;padding:13px;background:white}button.primary{background:#246d48;color:white}button.bad{background:#f9d8d4}button.good{background:#d9f2dc}.panel{background:white;border-radius:16px;padding:18px;margin-top:12px}.muted{color:#68776e;font-size:13px}.q{font-size:21px;font-weight:700;line-height:1.5;margin:20px 0}.ans{background:#f1f7ed;padding:14px;border-radius:12px;line-height:1.65}.row{display:flex;gap:8px;margin:10px 0}.row>*{flex:1}#study,#answer{display:none}.small{padding:7px;font-size:13px}</style><main><h1>🌳 樹木識別4</h1><div class="muted">生物分類技能検定2級・植物部門｜10組×3問＝30問</div><div id="setup" class="panel"><p>出題モード</p><select id="mode" style="width:100%"><option value="10">10問ずつ</option><option value="20">20問ずつ</option><option value="30">全30問</option><option value="wrong">間違えた問題だけ復習</option></select><p>出題範囲</p><select id="range" style="width:100%"><option value="0">1問目から</option><option value="10">11問目から</option><option value="20">21問目から</option></select><p class="muted" id="stats"></p><button class="primary" style="width:100%" onclick="start()">学習を始める</button></div><div id="study" class="panel"><button class="small" onclick="backSetup()">設定へ戻る</button><p id="progress"></p><div class="muted" id="tag"></div><div class="q" id="question"></div><button id="reveal" class="primary" style="width:100%" onclick="showAnswer()">答えを見る</button><div id="answer"><div class="ans" id="solution"></div><p>覚えていた？</p><div class="row"><button class="good" onclick="mark(true)">○ 覚えた</button><button class="bad" onclick="mark(false)">× 間違えた</button></div></div><div class="row"><button onclick="prev()">← 一問戻る</button><button class="primary" onclick="next()">次の問題 →</button></div></div></main><script>const Q=[{"tag":"アカマツ／クロマツ","q":"アカマツ／クロマツ：葉の硬さの識別ポイントは？","a":"アカマツは比較的柔らかく、クロマツは硬く鋭い"},{"tag":"アカマツ／クロマツ","q":"アカマツ／クロマツ：樹皮の識別ポイントは？","a":"アカマツは樹幹上部が赤褐色になりやすい"},{"tag":"アカマツ／クロマツ","q":"アカマツ／クロマツ：冬芽の識別ポイントは？","a":"クロマツは白っぽく、アカマツは赤褐色"},{"tag":"クヌギ／アベマキ","q":"クヌギ／アベマキ：葉裏の識別ポイントは？","a":"アベマキは星状毛が密生して白っぽい"},{"tag":"クヌギ／アベマキ","q":"クヌギ／アベマキ：樹皮の識別ポイントは？","a":"両種とも厚いコルク層が発達する"},{"tag":"クヌギ／アベマキ","q":"クヌギ／アベマキ：殻斗の識別ポイントは？","a":"両種とも細長い鱗片が目立つ"},{"tag":"コナラ／ミズナラ","q":"コナラ／ミズナラ：葉柄の識別ポイントは？","a":"ミズナラは葉柄がごく短い"},{"tag":"コナラ／ミズナラ","q":"コナラ／ミズナラ：葉の基部の識別ポイントは？","a":"ミズナラは耳状に張り出しやすい"},{"tag":"コナラ／ミズナラ","q":"コナラ／ミズナラ：分布の識別ポイントは？","a":"ミズナラは冷温帯に多い"},{"tag":"シロダモ／ヤブニッケイ","q":"シロダモ／ヤブニッケイ：葉脈の識別ポイントは？","a":"両種とも基部付近から目立つ3本の脈が走るため、葉脈だけでの断定は避ける"},{"tag":"シロダモ／ヤブニッケイ","q":"シロダモ／ヤブニッケイ：葉裏の識別ポイントは？","a":"シロダモは葉裏が白っぽい"},{"tag":"シロダモ／ヤブニッケイ","q":"シロダモ／ヤブニッケイ：熟した果実の識別ポイントは？","a":"シロダモは赤色、ヤブニッケイは黒紫色"},{"tag":"ヤブツバキ／サザンカ","q":"ヤブツバキ／サザンカ：花の散り方の識別ポイントは？","a":"ヤブツバキは花冠がまとまって落ちやすい"},{"tag":"ヤブツバキ／サザンカ","q":"ヤブツバキ／サザンカ：雄しべの識別ポイントは？","a":"ヤブツバキは花糸の基部が合着する"},{"tag":"ヤブツバキ／サザンカ","q":"ヤブツバキ／サザンカ：葉縁の識別ポイントは？","a":"サザンカは鋸歯が比較的目立つ"},{"tag":"カツラ／ハナズオウ","q":"カツラ／ハナズオウ：葉序の識別ポイントは？","a":"カツラは対生、ハナズオウは互生"},{"tag":"カツラ／ハナズオウ","q":"カツラ／ハナズオウ：開花時期の識別ポイントは？","a":"ハナズオウは展葉前に紅紫色の花が目立つ"},{"tag":"カツラ／ハナズオウ","q":"カツラ／ハナズオウ：果実の識別ポイントは？","a":"ハナズオウは豆果をつける"},{"tag":"イヌシデ／アカシデ","q":"イヌシデ／アカシデ：葉の側脈の識別ポイントは？","a":"イヌシデは側脈が比較的多い"},{"tag":"イヌシデ／アカシデ","q":"イヌシデ／アカシデ：若枝の識別ポイントは？","a":"アカシデは若枝や葉柄が赤みを帯びやすい"},{"tag":"イヌシデ／アカシデ","q":"イヌシデ／アカシデ：果穂の識別ポイントは？","a":"両種とも苞を伴う垂れ下がる果穂をつける"},{"tag":"ネムノキ／サイカチ","q":"ネムノキ／サイカチ：葉の識別ポイントは？","a":"ネムノキは二回羽状複葉。サイカチは一回または二回羽状複葉"},{"tag":"ネムノキ／サイカチ","q":"ネムノキ／サイカチ：刺の識別ポイントは？","a":"サイカチは幹や枝に分枝する大きな刺が生じる"},{"tag":"ネムノキ／サイカチ","q":"ネムノキ／サイカチ：果実の識別ポイントは？","a":"どちらもマメ科で豆果をつける"},{"tag":"ホオノキ／コブシ","q":"ホオノキ／コブシ：葉のつき方の識別ポイントは？","a":"ホオノキは枝先に葉が集まって見える"},{"tag":"ホオノキ／コブシ","q":"ホオノキ／コブシ：花の識別ポイントは？","a":"ホオノキの花は大きく上向きに咲く"},{"tag":"ホオノキ／コブシ","q":"ホオノキ／コブシ：葉先の識別ポイントは？","a":"コブシの葉先は短く突き出る傾向がある"},{"tag":"アラカシ／シラカシ","q":"アラカシ／シラカシ：鋸歯の識別ポイントは？","a":"アラカシは葉の上半部に粗い鋸歯が目立つ"},{"tag":"アラカシ／シラカシ","q":"アラカシ／シラカシ：葉裏の識別ポイントは？","a":"シラカシは葉裏が比較的淡色で細毛がある"},{"tag":"アラカシ／シラカシ","q":"アラカシ／シラカシ：葉形の識別ポイントは？","a":"シラカシは細長い楕円形の葉が多い"}];const KEY='tree_pairs_part4_results_2026';let marks=JSON.parse(localStorage.getItem(KEY)||'{}'),order=[],pos=0;function save(){localStorage.setItem(KEY,JSON.stringify(marks))}function stats(){document.getElementById('stats').textContent='学習済み '+Object.keys(marks).length+'/30問 ・ × '+Object.values(marks).filter(x=>x===false).length+'問'}function start(){let mode=document.getElementById('mode').value,start=Number(document.getElementById('range').value);order=mode==='wrong'?Q.map((_,i)=>i).filter(i=>marks[i]===false):Q.map((_,i)=>i).slice(start,start+Number(mode));if(!order.length){alert('この範囲に出題できる問題がありません');return}pos=0;document.getElementById('setup').style.display='none';document.getElementById('study').style.display='block';render()}function render(){let i=order[pos];document.getElementById('progress').textContent=(pos+1)+' / '+order.length+'問';document.getElementById('tag').textContent=Q[i].tag;document.getElementById('question').textContent=Q[i].q;document.getElementById('solution').textContent=Q[i].a;document.getElementById('answer').style.display='none';document.getElementById('reveal').style.display='block'}function showAnswer(){document.getElementById('answer').style.display='block';document.getElementById('reveal').style.display='none'}function mark(v){marks[order[pos]]=v;save();next()}function next(){if(pos<order.length-1){pos++;render()}else{alert('この範囲の学習は終了！');backSetup()}}function prev(){if(pos>0){pos--;render()}}function backSetup(){document.getElementById('study').style.display='none';document.getElementById('setup').style.display='block';stats()}stats();</script></html>

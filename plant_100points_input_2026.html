<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>植物100ポイント 一問一答</title><style>*{box-sizing:border-box}body{margin:0;background:#f4f7f2;color:#26372b;font-family:system-ui,"Noto Sans JP",sans-serif}main{max-width:640px;margin:auto;padding:16px}h1{font-size:22px}.card{background:white;border-radius:16px;padding:18px;margin:12px 0}button,select{font:inherit;border:1px solid #b5c5b7;background:white;border-radius:11px;padding:12px;cursor:pointer}button.primary{background:#276849;color:white;border-color:#276849}button:disabled{opacity:.4}.row{display:flex;gap:8px}.row>*{flex:1}label{display:block;margin:12px 0 6px}.muted{font-size:13px;color:#68756a}.question{font-size:23px;font-weight:700;line-height:1.6;margin:28px 0}.answer{background:#e9f5e8;padding:18px;border-radius:12px;margin:16px 0;font-size:21px;font-weight:700}.answer small{display:block;font-size:13px;font-weight:400;margin-top:10px}.hide{display:none}.mark{width:100%;margin-top:8px}.ok{background:#e7f5e9}.ng{background:#ffefeb}#progressbar{height:7px;background:#e1e8e0;border-radius:8px;overflow:hidden}#fill{height:100%;background:#36815c;width:0}.top{display:flex;justify-content:space-between;align-items:center;gap:8px}.top button{padding:6px 10px;font-size:12px}.stat{line-height:1.8}</style></head><body><main><h1>🌿 植物100ポイント・一問一答</h1><p class="muted">本番形式ではなく、答えを思い出すためのインプット専用｜全129問</p><section class="card" id="setup"><label>出題範囲</label><select id="range" style="width:100%"><option value="all">全範囲</option><option value="0-25">葉序・葉（1〜25）</option><option value="25-54">花（26〜54）</option><option value="54-74">果実・種子（55〜74）</option><option value="74-94">シダ・コケ（75〜94）</option><option value="94-112">生態（95〜112）</option><option value="112-999">分類・基本（113〜129）</option></select><label>出題数</label><select id="count" style="width:100%"><option value="10">10問</option><option value="20">20問</option><option value="all">選択範囲すべて</option></select><label>開始位置（選択範囲内）</label><select id="offset" style="width:100%"><option value="0">1問目から</option><option value="10">11問目から</option><option value="20">21問目から</option><option value="30">31問目から</option><option value="40">41問目から</option><option value="50">51問目から</option><option value="60">61問目から</option><option value="70">71問目から</option><option value="80">81問目から</option><option value="90">91問目から</option><option value="100">101問目から</option><option value="110">111問目から</option><option value="120">121問目から</option><option value="130">131問目から</option><option value="140">141問目から</option></select><label><input id="shuffle" type="checkbox"> 順番をシャッフル</label><p class="muted stat" id="stats"></p><button class="primary" style="width:100%" onclick="start(false)">学習開始</button><button style="width:100%;margin-top:8px" onclick="start(true)">×をつけた問題だけ復習</button></section><section class="card hide" id="quiz"><div class="top"><span id="counter" class="muted"></span><button onclick="home()">設定へ戻る</button></div><div id="progressbar"><div id="fill"></div></div><div class="question" id="question"></div><button id="reveal" class="primary" style="width:100%" onclick="showAnswer()">答えを見る</button><div id="answerBox" class="hide"><div class="answer"><div id="answer"></div><small id="note"></small></div><p class="muted">覚えていた？　タップすると記録されます</p><div class="row"><button class="ok" onclick="mark(true)">○ 覚えていた</button><button class="ng" onclick="mark(false)">× もう一度</button></div></div><div class="row" style="margin-top:12px"><button onclick="back()">← 一問戻る</button><button class="primary" onclick="next()">次の問題 →</button></div></section><section id="result" class="card hide"><h2>今回の学習終了！</h2><p id="summary"></p><button class="primary" style="width:100%" onclick="home()">設定へ戻る</button><button style="width:100%;margin-top:8px" onclick="start(true)">×だけ復習</button></section></main><script>const Q=[{"id":1,"q":"日本の森林の主要な林冠広葉樹に多い葉序は？","a":"互生","n":"ブナ科・クスノキ科などに多い"},{"id":2,"q":"日本のブナ科の代表的な5属は？","a":"ブナ属・コナラ属・ク 性は基本的に？","a":"左右相称","n":""},{"id":44,"q":"ラン科で目立つ特殊な花被片は？","a":"唇弁","n":""},{"id":45,"q":"ラン科の雄しべと雌しべが合着した構造は？","a":"蕊柱（ずいちゅう）","n":""},{"id":46,"q":"イネ科の花の集まりの基本単位は？","a":"小穂","n":""},{"id":47,"q":"カヤツリグサ科で分類上重要な花序の単位は？","a":"小穂","n":""},{"id":48,"q":"ツツジ科の花冠は合弁・離弁のどちらが多い？","a":"合弁","n":""},{"id":49,"q":"ナス科の花は何数性が基本？","a":"5数性","n":""},{"id":50,"q":"ヒルガオ科に多い花冠の形は？","a":"漏斗状","n":""},{"id":51,"q":"ウリ科の雄花と雌花は同じ花？","a":"別の花（雌雄異花）","n":""},{"id":52,"q":"単子葉類の花は何数性が多い？","a":"3数性","n":""},{"id":53,"q":"真正双子葉類の花は何数性が多い？","a":"4数性・5数性","n":""},{"id":54,"q":"ブナ科の果実の型は？","a":"堅果","n":""},{"id":55,"q":"ブナ科の堅果を包む構造は？","a":"殻斗","n":""},{"id":56,"q":"カエデ属の果実は？","a":"翼果","n":""},{"id":57,"q":"ニレ属の果実は？","a":"翼果","n":""},{"id":58,"q":"カバノキ属に多い果実の特徴は？","a":"翼をもつ小さな果実","n":""},{"id":59,"q":"マメ科の代表的な果実は？","a":"豆果","n":""},{"id":60,"q":"アブラナ科の代表的な果実は？","a":"長角果・短角果","n":""},{"id":61,"q":"キク科の果実の型は？","a":"下位痩果（痩果状）","n":""},{"id":62,"q":"タンポポの果実にある風散布に役立つ構造は？","a":"冠毛","n":""},{"id":63,"q":"イネ科の果実は？","a":"穎果（えいか）","n":""},{"id":64,"q":"バラ科の果実は1種類に限られる？","a":"限られない","n":"核果・集合果など多様"},{"id":65,"q":"サクラの果実は？","a":"核果","n":""},{"id":66,"q":"ウメの果実は？","a":"核果","n":""},{"id":67,"q":"イチゴの赤い部分は主に何？","a":"花托","n":""},{"id":68,"q":"イチゴの表面の粒々は？","a":"個々の果実","n":""},{"id":69,"q":"リンゴの食用部分は主に何に由来？","a":"花托など","n":""},{"id":70,"q":"イチジクの内側には何が多数ある？","a":"小花","n":"花序由来の構造"},{"id":71,"q":"裸子植物は果実をつくる？","a":"つくらない","n":"子房がない"},{"id":72,"q":"ギンナンは果実？種子？","a":"種子","n":""},{"id":73,"q":"シダ植物は種子ではなく何で繁殖？","a":"胞子","n":""},{"id":74,"q":"シダ類の胞子嚢がつくことが多い位置は？","a":"葉の裏側","n":"例外あり"},{"id":75,"q":"シダの胞子嚢の集まりを何という？","a":"胞子嚢群（ソーラス）","n":""},{"id":76,"q":"シダの胞子嚢群の識別に使う3点は？","a":"位置・形・包膜","n":""},{"id":77,"q":"ゼンマイの栄養葉と胞子葉は同形？","a":"異形","n":""},{"id":78,"q":"クサソテツの栄養葉と胞子葉は同形？","a":"異形","n":""},{"id":79,"q":"ワラビの葉身は葉柄の基部まで広がる？","a":"通常広がらない","n":""},{"id":80,"q":"ノキシノブの葉は単葉？複葉？","a":"単葉","n":""},{"id":81,"q":"ノキシノブの胞子嚢群の形は？","a":"円形","n":""},{"id":82,"q":"マメヅタの栄養葉と胞子葉は同形？","a":"異形","n":""},{"id":83,"q":"トクサ類の茎の特徴は？","a":"節が明瞭","n":""},{"id":84,"q":"トクサ類の葉の特徴は？","a":"鞘状に退化","n":""},{"id":85,"q":"ヒカゲノカズラ類はシダ類と同じ系統？","a":"別系統","n":"どちらも維管束植物"},{"id":86,"q":"コケ植物には真正の根がある？","a":"ない","n":""},{"id":87,"q":"コケ植物で根に似た構造は？","a":"仮根","n":""},{"id":88,"q":"コケ植物の生活環で主体となるのは？","a":"配偶体","n":""},{"id":89,"q":"シダ植物の生活環で主体となるのは？","a":"胞子体","n":""},{"id":90,"q":"蘚類と苔類を識別する際に見る構造は？","a":"葉・茎・胞子体など","n":""},{"id":91,"q":"湿地植物に発達することが多い組織は？","a":"通気組織","n":""},{"id":92,"q":"水生植物の生活形を3つ挙げると？","a":"浮葉・沈水・抽水","n":""},{"id":93,"q":"水中葉と気中葉で形が違うことを？","a":"異形葉","n":""},{"id":94,"q":"乾燥地の植物に多い葉の特徴は？","a":"小さい・厚いなど","n":""},{"id":95,"q":"異なる系統で多肉化が起きる現象は？","a":"収斂進化","n":""},{"id":96,"q":"着生植物は支持体の樹木から栄養を奪う？","a":"通常奪わない","n":""},{"id":97,"q":"セッコクの生活形は？","a":"着生","n":""},{"id":98,"q":"カヤランの生活形は？","a":"着生","n":""},{"id":99,"q":"クモランの生活形は？","a":"着生","n":""},{"id":100,"q":"ネナシカズラの栄養獲得様式は？","a":"寄生","n":""},{"id":101,"q":"ヤドリギは全寄生？半寄生？","a":"半寄生","n":""},{"id":102,"q":"ギンリョウソウの栄養獲得様式は？","a":"菌従属栄養","n":""},{"id":103,"q":"植物と菌類が根で共生する構造は？","a":"菌根","n":""},{"id":104,"q":"ブナ科・マツ科の多くにみられる菌根は？","a":"外生菌根","n":""},{"id":105,"q":"マメ科と共生し窒素固定する細菌は？","a":"根粒菌","n":""},{"id":106,"q":"アカメガシワは先駆樹種？極相樹種？","a":"先駆樹種","n":""},{"id":107,"q":"先駆樹種には陽樹・陰樹のどちらが多い？","a":"陽樹","n":""},{"id":108,"q":"極相林の構成種には何への耐性が高い樹木が多い？","a":"日陰（耐陰性）","n":""},{"id":109,"q":"単子葉類の子葉は通常何枚？","a":"1枚","n":""},{"id":110,"q":"単子葉類の葉脈は何脈が多い？","a":"平行脈","n":""},{"id":111,"q":"単子葉類の茎の維管束配置は？","a":"散在","n":""},{"id":112,"q":"真正双子葉類の子葉は通常何枚？","a":"2枚","n":""},{"id":113,"q":"真正双子葉類の葉脈は何脈が多い？","a":"網状脈","n":""},{"id":114,"q":"葉脈だけで単子葉類と真正双子葉類を確定できる？","a":"できない","n":""},{"id":115,"q":"裸子植物の代表例を4つ挙げると？","a":"マツ類・スギ類・イチョウ・ソテツ類","n":""},{"id":116,"q":"マツ科に多い樹脂を通す構造は？","a":"樹脂道","n":""},{"id":117,"q":"アカマツの短枝の針葉は何本？","a":"2本","n":""},{"id":118,"q":"クロマツの短枝の針葉は何本？","a":"2本","n":""},{"id":119,"q":"ゴヨウマツの短枝の針葉は何本？","a":"5本","n":""},{"id":120,"q":"モミ属の球果は成熟時どうなる？","a":"樹上で崩れる","n":""},{"id":121,"q":"トウヒ属の球果の向きは？","a":"下垂する","n":""},{"id":122,"q":"ヒノキとサワラの識別で葉裏の何を見る？","a":"気孔帯の模様","n":""},{"id":123,"q":"メタセコイアの葉序は？","a":"対生","n":""},{"id":124,"q":"ラクウショウの葉序は？","a":"互生","n":""},{"id":125,"q":"イチョウは雌雄同株？雌雄異株？","a":"雌雄異株","n":""},{"id":126,"q":"被子植物に特徴的な受精様式は？","a":"重複受精","n":""},{"id":127,"q":"APG分類体系が重視するのは？","a":"分子系統解析","n":""},{"id":128,"q":"分類の基本階級を大きい順にいうと？","a":"界・門・綱・目・科・属・種","n":""},{"id":129,"q":"二名法の学名を構成する2要素は？","a":"属名・種小名","n":""}],KEY="plant_100points_input_2026";let history={};try{history=JSON.parse(localStorage.getItem(KEY)||"{}")}catch(e){}let order=[],pos=0,shown={},marks={};const E=id=>document.getElementById(id);function stats(){let vals=Object.values(history);E("stats").textContent="記録済み "+vals.length+"問｜○ "+vals.filter(v=>v===true).length+"問｜× "+vals.filter(v=>v===false).length+"問"}function start(wrong){let pool=Q.map((_,i)=>i);if(wrong){pool=pool.filter(i=>history[i]===false)}else{let r=E("range").value;if(r!=="all"){let [a,b]=r.split("-").map(Number);pool=pool.slice(a,b)}if(E("shuffle").checked){pool.sort(()=>Math.random()-.5)}let off=+E("offset").value;pool=pool.slice(off);let count=E("count").value;if(count!=="all")pool=pool.slice(0,+count)}if(!pool.length){alert("対象問題がありません。設定を変更してください。");return}order=pool;pos=0;shown={};marks={};E("setup").classList.add("hide");E("result").classList.add("hide");E("quiz").classList.remove("hide");render()}function render(){let i=order[pos],q=Q[i];E("counter").textContent=(pos+1)+" / "+order.length+"問｜通し番号 "+q.id;E("fill").style.width=((pos+1)/order.length*100)+"%";E("question").textContent=q.q;E("answer").textContent=q.a;E("note").textContent=q.n;E("answerBox").classList.toggle("hide",!shown[i]);E("reveal").classList.toggle("hide",!!shown[i])}function showAnswer(){shown[order[pos]]=true;render()}function mark(v){let i=order[pos];marks[i]=v;history[i]=v;localStorage.setItem(KEY,JSON.stringify(history));if(pos<order.length-1){pos++;render()}else finish()}function next(){if(!shown[order[pos]]){showAnswer();return}if(pos<order.length-1){pos++;render()}else finish()}function back(){if(pos>0){pos--;render()}}function finish(){E("quiz").classList.add("hide");E("result").classList.remove("hide");let m=Object.values(marks);E("summary").textContent="○ "+m.filter(Boolean).length+"問、× "+m.filter(v=>v===false).length+"問（未判定 "+(order.length-m.length)+"問）"}function home(){E("quiz").classList.add("hide");E("result").classList.add("hide");E("setup").classList.remove("hide");stats()}stats();</script></body></html>

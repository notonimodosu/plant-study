<!doctype html><html lang="ja"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>樹木識別5｜特徴から選ぶ30問</title><style>*{box-sizing:border-box}body{font-family:system-ui,'Noto Sans JP',sans-serif;background:#f4f7f2;color:#203326;margin:0}main{max-width:620px;margin:auto;padding:16px}h1{font-size:24px}.card{background:white;border-radius:17px;padding:18px;margin:12px 0}button,select{font:inherit;padding:13px;border:1px solid #bdcbbd;border-radius:12px;background:white}button{cursor:pointer}.primary{background:#276744;color:white}.options button{display:block;width:100%;text-align:left;margin:8px 0}.options button.selected{border:2px solid #276744;background:#e7f3e9}.row{display:flex;gap:8px}.row>*{flex:1}.muted{color:#667569;font-size:13px}.explain{background:#eef5e9;border-radius:10px;padding:13px;line-height:1.65;margin-top:12px}#quiz,#result{display:none}</style><main><h1>🌳 樹木識別5</h1><p class="muted">特徴から樹木を選ぶ｜オリジナル4択30問</p><section class="card" id="setup"><p>問題数</p><select id="mode" style="width:100%"><option value="10">10問</option><option value="20">20問</option><option value="30">全30問</option><option value="wrong">間違えた問題だけ復習</option></select><p>開始位置</p><select id="offset" style="width:100%"><option value="0">1問目から</option><option value="10">11問目から</option><option value="20">21問目から</option></select><p id="stat" class="muted"></p><button class="primary" style="width:100%" onclick="start()">学習開始</button></section><section class="card" id="quiz"><button onclick="home()" style="padding:7px;font-size:13px">設定へ戻る</button><p id="progress" class="muted"></p><h2 id="question" style="font-size:20px;line-height:1.5"></h2><div id="options" class="options"></div><div id="explanation" class="explain" hidden></div><div class="row"><button onclick="prev()">← 一問戻る</button><button class="primary" onclick="next()">次の問題 →</button></div></section><section class="card" id="result"><h2 id="score"></h2><button class="primary" onclick="home()">設定へ戻る</button></section></main><script>const questions=[{"q":"葉柄が極めて短く、葉身の基部が耳状に張り出しやすい落葉高木。","options":["コナラ","クヌギ","クリ","ミズナラ"],"answer":3,"explain":"ミズナラは短い葉柄と耳状の葉脚が目印。"},{"q":"葉裏に星状毛が密生し、白っぽく見える。殻斗の鱗片は細長い。","options":["アベマキ","クヌギ","コナラ","クリ"],"answer":0,"explain":"アベマキの葉裏の星状毛はクヌギとの重要な違い。"},{"q":"葉は対生で、丸みのある心形。秋に黄葉する。","options":["エノキ","カツラ","ハナズオウ","ケヤキ"],"answer":1,"explain":"カツラは対生、ハナズオウは互生。"},{"q":"常緑高木。葉裏が白っぽく、果実は赤く熟す。","options":["クスノキ","タブノキ","シロダモ","ヤブニッケイ"],"answer":2,"explain":"シロダモは赤い果実。ヤブニッケイは黒紫色。"},{"q":"針葉は通常2本束生し、硬く鋭い。冬芽は白っぽい。","options":["アカマツ","ゴヨウマツ","モミ","クロマツ"],"answer":3,"explain":"クロマツはアカマツより葉が硬く、冬芽が白っぽい傾向。"},{"q":"花弁が個々に散りやすく、雄しべは基部まで離生する。","options":["サザンカ","ヤブツバキ","チャノキ","ヒサカキ"],"answer":0,"explain":"サザンカとヤブツバキの識別点。"},{"q":"葉は互生し、葉身の基部は左右非対称。葉の表面がざらつき、果実は核果。","options":["ハルニレ","ムクノキ","エノキ","ケヤキ"],"answer":1,"explain":"ムクノキの葉のざらつきと核果に注目。"},{"q":"落葉高木。葉は大きく、枝先に輪生状に集まって見える。花は大型で上向き。","options":["タムシバ","ユリノキ","ホオノキ","コブシ"],"answer":2,"explain":"ホオノキは大きな葉が枝先に集まる。"},{"q":"幹や枝に分枝する大きな刺を生じ、豆果をつける。","options":["ネムノキ","ハリエンジュ","エンジュ","サイカチ"],"answer":3,"explain":"サイカチは大型で分枝する刺が特徴。"},{"q":"葉は互生し、葉の上半部に比較的粗い鋸歯がある常緑高木。","options":["アラカシ","シラカシ","ウラジロガシ","アカガシ"],"answer":0,"explain":"アラカシは葉の上半部に粗い鋸歯が目立つ。"},{"q":"葉は対生、掌状に5〜7裂し、果実は2個の分果からなる翼果。","options":["アオキ","イロハモミジ","トチノキ","カツラ"],"answer":1,"explain":"モミジ類は対生で掌状裂葉、翼果。"},{"q":"掌状複葉で小葉は通常5〜7枚。大きな円錐花序をつける。","options":["ホオノキ","カツラ","トチノキ","イロハモミジ"],"answer":2,"explain":"トチノキは掌状複葉。モミジは単葉。"},{"q":"葉は互生し、葉縁に重鋸歯。樹皮が白く紙状にはがれる。","options":["ダケカンバ","ミズメ","ヤシャブシ","シラカンバ"],"answer":3,"explain":"シラカンバの白い樹皮は代表的な特徴。"},{"q":"小枝にコルク質の翼が発達することがある。秋に赤く紅葉する。","options":["ニシキギ","マユミ","コマユミ","ツリバナ"],"answer":0,"explain":"ニシキギの枝の翼は特徴的。ただし翼が目立たない個体もある。"},{"q":"葉は互生。葉柄に蜜腺があり、樹皮には横長の皮目が目立つ。","options":["カエデ","ヤマザクラ","ウメ","モモ"],"answer":1,"explain":"サクラ類では葉柄の蜜腺が重要。"},{"q":"葉は互生し、側脈が葉縁へ向かって弓状に湾曲する。","options":["カツラ","エノキ","ミズキ","クマノミズキ"],"answer":2,"explain":"ミズキは互生、クマノミズキは対生。"},{"q":"葉は対生し、側脈が弓状に湾曲する落葉高木。","options":["ミズキ","カツラ","ケヤキ","クマノミズキ"],"answer":3,"explain":"クマノミズキは対生。"},{"q":"葉は対生し、秋に赤い果実をつける常緑低木。雌雄異株。","options":["アオキ","ヒサカキ","ヤブコウジ","シロダモ"],"answer":0,"explain":"アオキは対生で赤い果実、雌雄異株。"},{"q":"葉は互生し、葉縁の鋸歯が葉の上半分に限られることが多い。","options":["ハルニレ","エノキ","ムクノキ","ケヤキ"],"answer":1,"explain":"エノキの鋸歯は主に葉身上部。"},{"q":"落葉高木。葉は互生し、葉縁に鋸歯があり、果実は小型でいびつな形の堅果状。","options":["ムクノキ","ハルニレ","ケヤキ","エノキ"],"answer":2,"explain":"ケヤキの果実は小型で翼をもたない。"},{"q":"葉は互生し、葉の基部が左右非対称。果実は周囲に膜質の翼をもつ。","options":["ケヤキ","ムクノキ","エノキ","ハルニレ"],"answer":3,"explain":"ハルニレは翼果。"},{"q":"葉は針状で通常5本束生する。","options":["ゴヨウマツ","アカマツ","クロマツ","スギ"],"answer":0,"explain":"ゴヨウマツは五葉性。"},{"q":"葉の裏面に白い気孔帯が2本あり、球果は直立する。","options":["スギ","モミ","トウヒ","アカマツ"],"answer":1,"explain":"モミの球果は直立し、熟すと樹上で崩れる。"},{"q":"葉の先が鋭くとがり、枝には葉枕が残ってざらつく。球果は下垂する。","options":["スギ","ヒノキ","トウヒ","モミ"],"answer":2,"explain":"トウヒ属では葉枕が枝に残る。"},{"q":"葉は対生する鱗片葉で、葉裏の気孔帯はY字状に見えることが多い。","options":["サワラ","スギ","アスナロ","ヒノキ"],"answer":3,"explain":"ヒノキの葉裏はY字状、サワラはX字状の白色気孔帯が目立つ。"},{"q":"葉裏の白い気孔帯がX字状に目立つ鱗片葉の針葉樹。","options":["サワラ","ヒノキ","スギ","モミ"],"answer":0,"explain":"サワラは葉裏のX字状気孔帯。"},{"q":"落葉針葉樹。葉は枝に対生状につく。","options":["カラマツ","メタセコイア","ラクウショウ","スギ"],"answer":1,"explain":"メタセコイアの葉と小枝は対生状。"},{"q":"落葉針葉樹。葉は枝に互生状につき、湿地では膝根を出すことがある。","options":["スギ","カラマツ","ラクウショウ","メタセコイア"],"answer":2,"explain":"ラクウショウは互生状、湿地で膝根が知られる。"},{"q":"葉は互生し、葉身の基部はくさび形で、果実は堅果。冷温帯の落葉広葉樹林を代表する。","options":["スダジイ","アラカシ","タブノキ","ブナ"],"answer":3,"explain":"ブナは冷温帯の代表種。"},{"q":"葉は互生し、鋸歯の先端に長い芒がある。大きな殻斗に通常3個の堅果が入る。","options":["クリ","コナラ","クヌギ","スダジイ"],"answer":0,"explain":"クリは鋸歯の先が芒状で、いがに通常3個の堅果。"}],KEY='tree_identification_5_results';let records=JSON.parse(localStorage.getItem(KEY)||'{}'),order=[],pos=0,choices={};function stats(){document.getElementById('stat').textContent='過去の回答記録：'+Object.keys(records).length+'問／間違い '+Object.values(records).filter(v=>!v).length+'問'}function start(){let mode=document.getElementById('mode').value,offset=+document.getElementById('offset').value;order=mode==='wrong'?questions.map((_,i)=>i).filter(i=>records[i]===false):questions.map((_,i)=>i).slice(offset,offset+ +mode);if(!order.length){alert('対象の問題がありません');return}choices={};pos=0;document.getElementById('setup').style.display='none';document.getElementById('result').style.display='none';document.getElementById('quiz').style.display='block';render()}function render(){let id=order[pos],q=questions[id];document.getElementById('progress').textContent=(pos+1)+' / '+order.length+'問';document.getElementById('question').textContent=q.q;document.getElementById('options').innerHTML=q.options.map((o,i)=>'<button class="'+(choices[id]===i?'selected':'')+'" onclick="choose('+i+')">'+('ABCD'[i])+'．'+o+'</button>').join('');let e=document.getElementById('explanation');e.hidden=choices[id]===undefined;if(!e.hidden)e.textContent=(choices[id]===q.answer?'○ 正解':'× 不正解')+'｜正解：'+q.options[q.answer]+'。 '+q.explain}function choose(i){let id=order[pos];choices[id]=i;records[id]=i===questions[id].answer;localStorage.setItem(KEY,JSON.stringify(records));render()}function next(){if(pos<order.length-1){pos++;render()}else{document.getElementById('quiz').style.display='none';document.getElementById('result').style.display='block';let done=order.filter(i=>choices[i]!==undefined),ok=done.filter(i=>choices[i]===questions[i].answer).length;document.getElementById('score').textContent='結果：'+ok+' / '+done.length+'問正解（未回答 '+(order.length-done.length)+'問）'}}function prev(){if(pos>0){pos--;render()}}function home(){document.getElementById('quiz').style.display='none';document.getElementById('result').style.display='none';document.getElementById('setup').style.display='block';stats()}stats();</script></html>

<!doctype html><html lang="ja"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#355c3a"><title>樹木の識別 30問</title><style>*{box-sizing:border-box}body{margin:0;background:#f3f7f2;color:#223329;font-family:system-ui,-apple-system,"Noto Sans JP",sans-serif}main{max-width:690px;margin:auto;padding:12px 12px 35px}h1{font-size:20px;margin:9px 0}small,.muted{color:#607464}.box{background:white;border:1px solid #d8e5d8;border-radius:15px;padding:14px;margin:9px 0}label{display:block;font-weight:700;font-size:13px;margin:10px 0 5px}select,button{font:inherit;border-radius:10px;border:1px solid #b7cdb8;min-height:43px}select{width:100%;padding:8px;background:white}button{padding:9px;background:white;color:#214329;font-weight:700}.primary{background:#28613d;color:white;border-color:#28613d}.hide{display:none!important}.q{font-size:19px;line-height:1.5;font-weight:800;margin:11px 0}.opts button{width:100%;text-align:left;padding:10px 12px;margin:4px 0;min-height:43px}.opts button:disabled{opacity:1}.ok{background:#def3e0!important;border-color:#438c56!important}.ng{background:#fce6df!important;border-color:#c66a56!important}.nav{display:flex;gap:8px;margin:10px 0}.nav button{flex:1}.tip{background:#eef6ed;padding:10px;border-radius:9px;line-height:1.5;margin:8px 0}.tag{display:inline-block;border-radius:20px;background:#e5efe3;padding:4px 8px;font-size:12px}a{color:#27683a;text-decoration:none}#top{display:flex;justify-content:space-between;align-items:center;gap:12px}progress{width:100%;height:9px;accent-color:#377d4d}</style></head><body><main><div id="top"><h1>🌳 樹木の識別 30問</h1><a href="./index.html">⌂ 学習ホーム</a></div><section class="box" id="setup"><div class="muted">重要10組 × 各3問。4択・解説・間違い復習</div><label>問題数</label><select id="limit"><option value="10">10問</option><option value="20">20問</option><option value="30" selected>全30問</option></select><label>出題範囲</label><select id="pool"><option value="all">全問題（ランダム）</option><option value="wrong">間違えた問題だけ</option><option value="unseen">未回答だけ</option></select><div id="stats" class="muted" style="margin:13px 0"></div><button id="start" class="primary" style="width:100%">学習開始</button></section><section class="box hide" id="study"><span class="tag" id="group"></span><div class="muted" id="count" style="margin:6px 0"></div><progress id="bar" value="0" max="100"></progress><div class="q" id="question"></div><div id="opts" class="opts"></div><div id="explain" class="tip hide"></div><div class="nav"><button id="back">← 一問戻る</button><button id="next" class="primary">次の問題 →</button></div><button id="quit" style="width:100%;min-height:35px;font-size:13px">設定へ戻る</button></section><section class="box hide" id="finish"><h2>学習結果</h2><p id="result"></p><button id="retry" class="primary" style="width:100%">設定へ戻る</button></section><p class="muted" style="font-size:11px">問題はオリジナルの学習用問題です。形態には個体差があるため、典型的な特徴を覚えてください。記録はこの端末のブラウザ内に保存します。</p></main><script>
const Q=[["針葉樹","メタセコイアとラクウショウで、葉が対生するのは？","メタセコイア","ラクウショウ","どちらも互生","どちらも対生","メタセコイアの葉・側枝はおおむね対生。"],["針葉樹","メタセコイアとラクウショウで、葉が互生するのは？","ラクウショウ","メタセコイア","どちらも対生","どちらも輪生","ラクウショウでは葉や側枝が互生する。"],["針葉樹","ラクウショウにしばしば見られる特徴は？","湿地で膝根を形成する","葉が5本束生する","どんぐりをつける","常に対生の広葉をつける","湿地の個体では膝根（呼吸根）が発達することがある。"],["針葉樹","アカマツとクロマツで、針葉が一般に硬く太いのは？","クロマツ","アカマツ","ともに柔らかい","ともに針葉が5本束生","クロマツは太く硬い針葉。個体差はある。"],["針葉樹","アカマツとクロマツで、樹皮が赤褐色になる特徴が目立つのは？","アカマツ","クロマツ","ともに常に白色","ともに滑らかな緑色","アカマツの上部の樹皮は赤褐色で特徴的。"],["針葉樹","アカマツとクロマツの針葉は通常何本束？","両方とも2本","アカマツ2本・クロマツ5本","アカマツ5本・クロマツ2本","両方とも1本","両者とも二葉松。葉の硬さなどで見分ける。"],["ブナ科","コナラとミズナラで、葉柄が一般に長いのは？","コナラ","ミズナラ","どちらも葉柄がない","どちらも同じ長さで区別できない","コナラは比較的長い葉柄、ミズナラはきわめて短い。"],["ブナ科","コナラとミズナラで、葉柄が短く葉身が枝に近接するのは？","ミズナラ","コナラ","クヌギ","アラカシ","ミズナラは葉柄がごく短い。"],["ブナ科","コナラとミズナラに共通する特徴は？","落葉広葉樹で殻斗のある堅果をつける","両方とも常緑樹である","両方とも針葉樹である","果実が液果になる","両種ともブナ科コナラ属、鱗片状の殻斗をもつ。"],["ブナ科","クヌギとアベマキで、葉裏に星状毛が密生し灰白色に見えやすいのは？","アベマキ","クヌギ","どちらも無毛の針葉","どちらも葉裏が鮮紅色","アベマキの葉裏は星状毛が多く白っぽい。"],["ブナ科","クヌギとアベマキで、樹皮に発達したコルク層が特に特徴的なのは？","アベマキ","クヌギ","コナラ","シラカシ","アベマキは厚いコルク質の樹皮が目立つ。"],["ブナ科","クヌギとアベマキの殻斗に共通する特徴は？","細長い鱗片が外側へ反り返る","同心円状の輪層だけが目立つ","果実を完全に包む袋状になる","殻斗を作らない","どちらも『もじゃもじゃ』した殻斗が特徴。"],["ブナ科","アラカシとシラカシで、葉の鋸歯が粗く上半部に目立ちやすいのは？","アラカシ","シラカシ","両種とも針葉","両種とも掌状複葉","アラカシは葉の上部の粗い鋸歯が手掛かり。"],["ブナ科","アラカシとシラカシで、比較的細く細かな鋸歯が続く葉をもつのは？","シラカシ","アラカシ","カシワ","ブナ","シラカシは細長い葉と比較的細かい鋸歯が目立つ。"],["ブナ科","アラカシ・シラカシのドングリに共通する殻斗は？","輪層状の横縞が目立つ","長い棘が密生する","殻斗がまったくない","果実を包む袋が3裂する","両種とも輪層状の殻斗をもつ。"],["モクレン科","コブシとタムシバで、開花時に花のすぐ下に小さな葉が1枚出ることが多いのは？","コブシ","タムシバ","両方必ず3枚ある","両方とも針葉である","コブシは花の下に小葉が出るのが典型。ただし観察時期にも注意。"],["モクレン科","コブシとタムシバで、花の下に小葉が通常見られないのは？","タムシバ","コブシ","ホオノキ","シキミ","タムシバは開花時に花の直下の小葉を欠くのが一般的。"],["モクレン科","コブシ・タムシバはどの科に属する？","モクレン科","ブナ科","クスノキ科","ミズキ科","どちらもモクレン科の落葉小高木〜高木。"],["クスノキ科","クスノキとヤブニッケイで、3行脈の分岐付近にダニ室がよく見られるのは？","クスノキ","ヤブニッケイ","どちらも必ずない","どちらも羽状複葉","クスノキでは脈の分岐付近の小孔状のダニ室が手掛かり。"],["クスノキ科","クスノキとヤブニッケイに共通する葉の特徴は？","基部付近から3本の主な脈が目立つ","針葉が2本束生","葉が掌状複葉","葉が常に輪生","両種とも三行脈が目立つ常緑広葉樹。"],["クスノキ科","クスノキ・ヤブニッケイの所属科は？","クスノキ科","モクレン科","ブナ科","ムクロジ科","両種はクスノキ科。葉の脈や香りも同定の手掛かり。"],["ブナ科","スダジイとツブラジイで、堅果が比較的細長いのは？","スダジイ","ツブラジイ","どちらも球形の液果","どちらも翼果","スダジイの堅果は一般に細長め。"],["ブナ科","スダジイとツブラジイで、堅果が小さく丸みを帯びやすいのは？","ツブラジイ","スダジイ","クリ","カシワ","ツブラジイの『つぶら』は小さく丸い実を覚える手掛かり。"],["ブナ科","スダジイ・ツブラジイの殻斗の特徴は？","堅果全体を包み、成熟すると裂ける","浅い皿状で横縞だけがある","長い針状の葉をつける","殻斗がまったくない","シイ類の殻斗は果実全体を包み、熟すと裂開する。"],["ブナ科","ブナとイヌブナで、樹皮が灰白色で比較的滑らかなのは？","ブナ","イヌブナ","クヌギ","アベマキ","ブナは灰白色で滑らかな樹皮が典型。"],["ブナ科","ブナとイヌブナで、樹皮が比較的暗色で皮目が目立つのは？","イヌブナ","ブナ","アカマツ","クロマツ","イヌブナは暗灰色の樹皮に皮目が目立ちやすい。"],["ブナ科","ブナ・イヌブナで、1つの殻斗に通常入る堅果は？","2個","1個","5個","10個","ブナ属では殻斗に通常2個の三稜形の堅果が入る。"],["ミズキ科","ヤマボウシとハナミズキで、総苞片の先が尖りやすいのは？","ヤマボウシ","ハナミズキ","どちらも球果","どちらも羽状複葉","ヤマボウシでは4枚の総苞片の先が尖ることが多い。"],["ミズキ科","ヤマボウシとハナミズキで、総苞片の先がくぼむことが多いのは？","ハナミズキ","ヤマボウシ","コブシ","タムシバ","ハナミズキの総苞片は先がくぼむ傾向がある。"],["ミズキ科","ヤマボウシとハナミズキで、赤い丸い集合果が1個の塊状に見えるのは？","ヤマボウシ","ハナミズキ","どちらもどんぐり","どちらも松ぼっくり","ヤマボウシは小果実が融合したような球状の集合果。ハナミズキは個々の赤い核果が集まる。"]]; const key="tree_pair_30_v1"; let history={};try{history=JSON.parse(localStorage.getItem(key)||"{}")}catch(e){};let round=[],pos=0,answers={};const $=id=>document.getElementById(id);const shuffle=a=>{const b=[...a];for(let i=b.length-1;i>0;i--){let j=Math.floor(Math.random()*(i+1));[b[i],b[j]]=[b[j],b[i]]}return b};function save(){try{localStorage.setItem(key,JSON.stringify(history))}catch(e){}}function show(id){for(const x of ["setup","study","finish"])$(x).classList.toggle("hide",x!==id)}function stats(){const vals=Object.values(history);$("stats").textContent="学習済み "+vals.length+"/30問 ｜ 要復習 "+vals.filter(v=>v===false).length+"問"}function start(){let ids=Q.map((_,i)=>i);if($("pool").value==="wrong")ids=ids.filter(i=>history[i]===false);if($("pool").value==="unseen")ids=ids.filter(i=>history[i]===undefined);if(!ids.length){alert("対象の問題がありません");return}round=shuffle(ids).slice(0,Number($("limit").value));answers={};pos=0;show("study");render()}function render(){const id=round[pos],q=Q[id];$("group").textContent=q[0];$("count").textContent=(pos+1)+" / "+round.length+"問";$("bar").value=(pos+1)/round.length*100;$("question").textContent=q[1];$("opts").innerHTML="";const opts=shuffle([q[2],q[3],q[4],q[5]]);for(const opt of opts){const b=document.createElement("button");b.textContent=opt;b.onclick=()=>answer(id,opt);$("opts").append(b)}$("explain").classList.add("hide");if(answers[id]!==undefined)reveal(id);$("back").disabled=pos===0;$("next").textContent=pos===round.length-1?"結果を見る →":"次の問題 →"}function answer(id,opt){if(answers[id]!==undefined)return;answers[id]=opt;history[id]=opt===Q[id][2];save();reveal(id)}function reveal(id){const q=Q[id],choice=answers[id];for(const b of $("opts").children){b.disabled=true;if(b.textContent===q[2])b.classList.add("ok");else if(b.textContent===choice)b.classList.add("ng")}$("explain").textContent=(choice===q[2]?"○ 正解！ ":"× 不正解。 正解："+q[2]+"。 ")+q[6];$("explain").classList.remove("hide")}function next(){if(pos<round.length-1){pos++;render()}else{const correct=round.filter(i=>answers[i]===Q[i][2]).length,done=round.filter(i=>answers[i]!==undefined).length;show("finish");$("result").textContent="正解 "+correct+" / "+round.length+"問（回答済み "+done+"問）。間違えた問題だけを復習できます。";stats()}}$("start").onclick=start;$("back").onclick=()=>{if(pos>0){pos--;render()}};$("next").onclick=next;$("quit").onclick=()=>{stats();show("setup")};$("retry").onclick=()=>{stats();show("setup")};stats();
</script></body></html>

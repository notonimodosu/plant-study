<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>植物2級 ひっかけ・仲間外れ4択</title><style>*{box-sizing:border-box}body{margin:0;background:#f3f7f4;color:#19372a;font-family:system-ui,"Noto Sans JP",sans-serif}main{max-width:640px;margin:auto;padding:16px}h1{font-size:23px}section{background:#fff;border:1px solid #d8e6db;border-radius:16px;padding:16px;margin:12px 0}button,select{font:inherit;border-radius:11px;padding:12px;border:1px solid #b8d1be;background:white;color:#174b31}button{cursor:pointer}.primary{background:#176743;color:white}.choices{display:grid;gap:9px;margin:12px 0}.choices button{text-align:left;font-weight:700;min-height:48px}.choices button.correct{background:#d8f5e0}.choices button.wrong{background:#ffe2df}.row{display:flex;gap:8px}.row button{flex:1;min-height:48px}.small{font-size:13px;color:#687b6c}.question{font-size:23px;font-weight:800;margin:20px 0}.hidden{display:none!important}.feedback{font-weight:700;margin:8px 0;line-height:1.7}.feedback:empty{display:none}select{width:100%}label{display:block;margin:12px 0;font-size:14px}.nav{display:flex;gap:8px;margin:10px 0 8px}.nav button{flex:1;min-height:48px}</style></head><body><main><h1>🌿 ひっかけ・仲間外れ4択</h1><p class="small">名前・葉序・仲間外れ・形態／全52問</p><section id="settings"><label>出題分野<select id="cat"><option value="all">全分野</option><option value="名前">名前のひっかけ</option><option value="葉序">葉序</option><option value="仲間外れ">仲間外れ</option><option value="形態">形態・果実・食虫植物</option></select></label><label>出題数<select id="count"><option value="10">10問</option><option value="20">20問</option><option value="all">全問</option></select></label><label>出題範囲<select id="scope"><option value="all">全問題</option><option value="missed">間違えた問題だけ</option></select></label><button id="start" class="primary" style="width:100%">この設定でスタート</button></section><section id="game" class="hidden"><div class="small" id="progress"></div><div class="question" id="question"></div><div id="choices" class="choices"></div><div id="feedback" class="feedback"></div><div class="nav"><button id="prev">← 一問戻る</button><button id="next" class="primary">次の問題 →</button></div><button id="back" style="width:100%;padding:8px">設定へ戻る</button></section><section id="finish" class="hidden"><h2>おつかれさま！</h2><p id="summary"></p><div class="row"><button id="again" class="primary">もう一度</button><button id="review">間違いだけ復習</button></div></section><p class="small">回答後に正解と比較ポイントを表示。誤答はこのブラウザに保存されます。過去問での出題実績を示すものではありません。</p></main><script>const DATA=[{"id":1,"cat":"名前","q":"タニウツギは何科？","a":"スイカズラ科","opts":["スイカズラ科","アジサイ科","バラ科","ツツジ科"],"note":"ウツギはアジサイ科。"},{"id":2,"cat":"名前","q":"ハマナスは何科？","a":"バラ科","opts":["バラ科","ナス科","アカネ科","キク科"],"note":"ナスはナス科。"},{"id":3,"cat":"名前","q":"ヤブランは何科？","a":"キジカクシ科","opts":["キジカクシ科","ラン科","ヒガンバナ科","イネ科"],"note":"名前にランが付いてもラン科ではない。"},{"id":4,"cat":"名前","q":"クンシランは何科？","a":"ヒガンバナ科","opts":["ヒガンバナ科","ラン科","キジカクシ科","ユリ科"],"note":"クンシランはラン科ではない。"},{"id":5,"cat":"名前","q":"ヤマブキソウは何科？","a":"ケシ科","opts":["ケシ科","バラ科","キンポウゲ科","キク科"],"note":"ヤマブキはバラ科。"},{"id":6,"cat":"名前","q":"アキノキリンソウは何科？","a":"キク科","opts":["キク科","ベンケイソウ科","バラ科","アブラナ科"],"note":"キリンソウはベンケイソウ科。"},{"id":7,"cat":"名前","q":"ムシトリスミレは何科？","a":"タヌキモ科","opts":["タヌキモ科","スミレ科","モウセンゴケ科","キク科"],"note":"スミレとは別科。"},{"id":8,"cat":"名前","q":"ヘビイチゴは何属？","a":"キジムシロ属","opts":["キジムシロ属","イチゴ属","キイチゴ属","バラ属"],"note":"イチゴ属ではない。"},{"id":9,"cat":"名前","q":"イチゴノキは何科？","a":"ツツジ科","opts":["ツツジ科","バラ科","クワ科","ミカン科"],"note":"イチゴはバラ科。"},{"id":10,"cat":"名前","q":"イチゴツナギは何科？","a":"イネ科","opts":["イネ科","バラ科","カヤツリグサ科","ツユクサ科"],"note":"イチゴとは無関係。"},{"id":11,"cat":"名前","q":"ボタンボウフウは何科？","a":"セリ科","opts":["セリ科","ボタン科","キンポウゲ科","バラ科"],"note":"ボタンとは別科。"},{"id":12,"cat":"名前","q":"ボタンヅルは何科？","a":"キンポウゲ科","opts":["キンポウゲ科","ボタン科","セリ科","バラ科"],"note":"センニンソウ属。"},{"id":13,"cat":"名前","q":"キツネノカミソリは何科？","a":"ヒガンバナ科","opts":["ヒガンバナ科","キツネノマゴ科","ラン科","アヤメ科"],"note":"キツネノマゴは別科。"},{"id":14,"cat":"名前","q":"シュウカイドウは何科？","a":"シュウカイドウ科","opts":["シュウカイドウ科","バラ科","アジサイ科","ツツジ科"],"note":"カイドウはバラ科。"},{"id":15,"cat":"名前","q":"エノキは何科？","a":"アサ科","opts":["アサ科","ニレ科","クワ科","ブナ科"],"note":"ケヤキはニレ科。"},{"id":16,"cat":"名前","q":"スギは現行分類で何科？","a":"ヒノキ科","opts":["ヒノキ科","スギ科","マツ科","イチイ科"],"note":"旧スギ科に注意。"},{"id":17,"cat":"名前","q":"ミクリは現行分類で何科？","a":"ガマ科","opts":["ガマ科","ミクリ科","イネ科","カヤツリグサ科"],"note":"旧ミクリ科に注意。"},{"id":18,"cat":"葉序","q":"ミズキの葉序は？","a":"互生","opts":["互生","対生","輪生","根生のみ"],"note":"クマノミズキは対生。"},{"id":19,"cat":"葉序","q":"クマノミズキの葉序は？","a":"対生","opts":["対生","互生","輪生","根生のみ"],"note":"ミズキは互生。"},{"id":20,"cat":"葉序","q":"フウの葉序は？","a":"互生","opts":["互生","対生","輪生","根生のみ"],"note":"カエデ類は原則対生。"},{"id":21,"cat":"葉序","q":"イロハモミジの葉序は？","a":"対生","opts":["対生","互生","輪生","根生のみ"],"note":"フウは互生。"},{"id":22,"cat":"葉序","q":"ケヤキの葉序は？","a":"互生","opts":["互生","対生","輪生","根生のみ"],"note":"トチノキは対生。"},{"id":23,"cat":"葉序","q":"トチノキの葉序は？","a":"対生","opts":["対生","互生","輪生","根生のみ"],"note":"ケヤキは互生。"},{"id":24,"cat":"葉序","q":"ムラサキシキブの葉序は？","a":"対生","opts":["対生","互生","輪生","根生のみ"],"note":"サクラ・ウメ・モモは互生。"},{"id":25,"cat":"葉序","q":"カキノキの葉序は？","a":"互生","opts":["互生","対生","輪生","根生のみ"],"note":"クサギ・キリは対生。"},{"id":26,"cat":"葉序","q":"ガマズミの葉序は？","a":"対生","opts":["対生","互生","輪生","根生のみ"],"note":"コナラ・クヌギは互生。"},{"id":27,"cat":"葉序","q":"ハナミズキの葉序は？","a":"対生","opts":["対生","互生","輪生","根生のみ"],"note":"ミズキは互生。"},{"id":28,"cat":"葉序","q":"ウツギの葉序は？","a":"対生","opts":["対生","互生","輪生","根生のみ"],"note":"タニウツギも対生だが別科。"},{"id":29,"cat":"仲間外れ","q":"ウツギ・ヒメウツギ・バイカウツギ・タニウツギ：別科は？","a":"タニウツギ","opts":["タニウツギ","ウツギ","ヒメウツギ","バイカウツギ"],"note":"タニウツギはスイカズラ科。"},{"id":30,"cat":"仲間外れ","q":"スズラン・ヤブラン・ジャノヒゲ・エビネ：別科は？","a":"エビネ","opts":["エビネ","スズラン","ヤブラン","ジャノヒゲ"],"note":"エビネだけラン科。"},{"id":31,"cat":"仲間外れ","q":"ヤマブキ・シモツケ・ワレモコウ・ヤマブキソウ：別科は？","a":"ヤマブキソウ","opts":["ヤマブキソウ","ヤマブキ","シモツケ","ワレモコウ"],"note":"ヤマブキソウはケシ科。"},{"id":32,"cat":"仲間外れ","q":"キリンソウ・マンネングサ・ミセバヤ・アキノキリンソウ：別科は？","a":"アキノキリンソウ","opts":["アキノキリンソウ","キリンソウ","マンネングサ","ミセバヤ"],"note":"アキノキリンソウはキク科。"},{"id":33,"cat":"仲間外れ","q":"スミレ・タチツボスミレ・アオイスミレ・ムシトリスミレ：別科は？","a":"ムシトリスミレ","opts":["ムシトリスミレ","スミレ","タチツボスミレ","アオイスミレ"],"note":"タヌキモ科。"},{"id":34,"cat":"仲間外れ","q":"モウセンゴケ・コモウセンゴケ・ナガバノモウセンゴケ・ムシトリスミレ：別科は？","a":"ムシトリスミレ","opts":["ムシトリスミレ","モウセンゴケ","コモウセンゴケ","ナガバノモウセンゴケ"],"note":"タヌキモ科。"},{"id":35,"cat":"仲間外れ","q":"ベニシダ・ヤブソテツ・イノデ・イヌワラビ：別科は？","a":"イヌワラビ","opts":["イヌワラビ","ベニシダ","ヤブソテツ","イノデ"],"note":"イヌワラビはメシダ科。"},{"id":36,"cat":"仲間外れ","q":"イノモトソウ・オオバノイノモトソウ・ホウライシダ・チャセンシダ：別科は？","a":"チャセンシダ","opts":["チャセンシダ","イノモトソウ","オオバノイノモトソウ","ホウライシダ"],"note":"チャセンシダ科。"},{"id":37,"cat":"仲間外れ","q":"スギ・ヒノキ・メタセコイア・マツ：別科は？","a":"マツ","opts":["マツ","スギ","ヒノキ","メタセコイア"],"note":"マツはマツ科。"},{"id":38,"cat":"仲間外れ","q":"コナラ・クヌギ・クリ・ケヤキ：別科は？","a":"ケヤキ","opts":["ケヤキ","コナラ","クヌギ","クリ"],"note":"ケヤキはニレ科。"},{"id":39,"cat":"仲間外れ","q":"ケヤキ・ハルニレ・アキニレ・エノキ：別科は？","a":"エノキ","opts":["エノキ","ケヤキ","ハルニレ","アキニレ"],"note":"エノキはアサ科。"},{"id":40,"cat":"仲間外れ","q":"イラクサ・カラムシ・ヤブマオ・クワ：別科は？","a":"クワ","opts":["クワ","イラクサ","カラムシ","ヤブマオ"],"note":"クワはクワ科。"},{"id":41,"cat":"仲間外れ","q":"アケビ・ミツバアケビ・ムベ・フジ：別科は？","a":"フジ","opts":["フジ","アケビ","ミツバアケビ","ムベ"],"note":"フジはマメ科。"},{"id":42,"cat":"仲間外れ","q":"カタバミ・ムラサキカタバミ・イモカタバミ・シロツメクサ：別科は？","a":"シロツメクサ","opts":["シロツメクサ","カタバミ","ムラサキカタバミ","イモカタバミ"],"note":"シロツメクサはマメ科。"},{"id":43,"cat":"仲間外れ","q":"ゼンマイ・ヤシャゼンマイ・オニゼンマイ・ワラビ：別科は？","a":"ワラビ","opts":["ワラビ","ゼンマイ","ヤシャゼンマイ","オニゼンマイ"],"note":"ワラビはコバノイシカグマ科。"},{"id":44,"cat":"仲間外れ","q":"ガマ・ヒメガマ・コガマ・ミクリ：別科は？","a":"別科の植物はいない","opts":["別科の植物はいない","ガマ","ヒメガマ","ミクリ"],"note":"すべてガマ科。"},{"id":45,"cat":"仲間外れ","q":"ヒガンバナ・キツネノカミソリ・スイセン・ネギ：別科は？","a":"別科の植物はいない","opts":["別科の植物はいない","ヒガンバナ","スイセン","ネギ"],"note":"すべてヒガンバナ科。"},{"id":46,"cat":"形態","q":"イチゴの果実の特徴は？","a":"花托上に多数の痩果","opts":["花托上に多数の痩果","小核果の集合","液果","蒴果"],"note":"キイチゴは小核果の集合。"},{"id":47,"cat":"形態","q":"キイチゴの果実の特徴は？","a":"小核果の集合","opts":["小核果の集合","花托上に多数の痩果","翼果","堅果"],"note":"イチゴと比較。"},{"id":48,"cat":"形態","q":"タンポポの頭花は？","a":"舌状花のみ","opts":["舌状花のみ","筒状花のみ","雄花のみ","花弁を持たない"],"note":"ヨモギは筒状花のみ。"},{"id":49,"cat":"形態","q":"ヨモギの頭花は？","a":"筒状花のみ","opts":["筒状花のみ","舌状花のみ","花弁を持たない","雄花のみ"],"note":"タンポポと比較。"},{"id":50,"cat":"形態","q":"タヌキモの捕虫方法は？","a":"吸い込み式","opts":["吸い込み式","粘着式","挟み込み式","落とし穴式"],"note":"モウセンゴケは粘着式。"},{"id":51,"cat":"形態","q":"モウセンゴケの捕虫方法は？","a":"粘着式","opts":["粘着式","吸い込み式","挟み込み式","落とし穴式"],"note":"タヌキモは吸い込み式。"},{"id":52,"cat":"形態","q":"カエデ類の果実は？","a":"翼果","opts":["翼果","堅果","液果","核果"],"note":"シデ類は果苞を伴う堅果。"}];const KEY="plant_trick_review_v1";const $=id=>document.getElementById(id);const shuffle=a=>[...a].sort(()=>Math.random()-.5);let misses=new Set(JSON.parse(localStorage.getItem(KEY)||"[]")),queue=[],i=0,answers={};function save(){localStorage.setItem(KEY,JSON.stringify([...misses]))}function show(id){["settings","game","finish"].forEach(x=>$(x).classList.toggle("hidden",x!==id))}function start(){let pool=DATA.filter(x=>($("cat").value==="all"||x.cat===$("cat").value)&&($("scope").value!=="missed"||misses.has(x.id)));if(!pool.length){alert("この条件で出題できる問題はありません");return}queue=shuffle(pool).slice(0,$("count").value==="all"?pool.length:+$("count").value);i=0;answers={};show("game");render()}function render(){if(i>=queue.length){show("finish");$("summary").textContent=Object.values(answers).filter(x=>x.ok).length+" / "+queue.length+" 問 正解";return}const x=queue[i],a=answers[i];$("progress").textContent=(i+1)+" / "+queue.length+" 問・"+x.cat;$("question").textContent=x.q;$("prev").disabled=i===0;$("next").disabled=!a;$("feedback").textContent=a?(a.ok?"○ 正解！　":"× 不正解　")+"正答："+x.a+"。 "+x.note:"";const choices=a?.opts||shuffle(x.opts);$("choices").innerHTML="";choices.forEach(v=>{const b=document.createElement("button");b.textContent=v;if(a){b.disabled=true;if(v===x.a)b.classList.add("correct");else if(v===a.choice)b.classList.add("wrong")}b.onclick=()=>{if(answers[i])return;const ok=v===x.a;answers[i]={ok,choice:v,opts:choices};if(ok)misses.delete(x.id);else misses.add(x.id);save();render()};$("choices").appendChild(b)})} $("start").onclick=start;$("prev").onclick=()=>{if(i>0){i--;render()}};$("next").onclick=()=>{i++;render()};$("back").onclick=()=>show("settings");$("again").onclick=start;$("review").onclick=()=>{$("cat").value="all";$("scope").value="missed";start()};</script></body></html>

<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>植物2級｜第三段階30科・属から科</title><style>*{box-sizing:border-box}body{margin:0;background:#f3f7f4;color:#19372a;font-family:system-ui,"Noto Sans JP",sans-serif}main{max-width:640px;margin:auto;padding:16px}h1{font-size:22px}section{background:#fff;border:1px solid #d8e6db;border-radius:16px;padding:16px;margin:12px 0}button,select{font:inherit;border-radius:11px;padding:12px;border:1px solid #b8d1be;background:white;color:#174b31}button{cursor:pointer}.primary,.selected{background:#176743;color:white}.choices{display:grid;gap:9px;margin:12px 0}.choices button{text-align:left;font-weight:700}.choices button.correct{background:#d8f5e0}.choices button.wrong{background:#ffe2df}.row{display:flex;gap:8px}.row button{flex:1}.small{font-size:13px;color:#687b6c}.question{font-size:26px;font-weight:800;margin:24px 0}.hidden{display:none}.feedback{font-weight:700;margin:8px 0}.feedback:empty{display:none}#card{min-height:190px;display:grid;place-content:center;text-align:center;border:2px solid #c9e2d1;border-radius:15px;font-size:27px;font-weight:800;background:#f9fdf9;margin:15px 0}select{width:100%}label{display:block;margin:12px 0;font-size:14px}.nav{display:flex;gap:8px;margin:10px 0 8px}.nav button{min-height:48px}.nav button{flex:1}</style></head><body><main><h1>🌿 属 → 科｜第三段階30科</h1><p class="small">追加30科・48属／第一・第二段階50科は含みません</p><section id="settings"><div class="row"><button id="quiz" class="selected">四択クイズ</button><button id="flash">暗記カード</button></div><label>出題数<select id="count"><option value="10">10問</option><option value="20">20問</option><option value="all">全問</option></select></label><label>出題範囲<select id="scope"><option value="all">追加30科すべて</option><option value="missed">間違えた問題だけ</option></select></label><button id="start" class="primary" style="width:100%">この設定でスタート</button></section><section id="game" class="hidden"><div class="small" id="progress"></div><div class="question" id="question"></div><div id="choices" class="choices"></div><div id="card" class="hidden"></div><div id="marks" class="row hidden"><button id="bad">× まだ覚えていない</button><button id="good" class="primary">○ 覚えた</button></div><div id="feedback" class="feedback"></div><div class="nav"><button id="prev">← 一問戻る</button><button id="next" class="primary">次の問題 →</button></div><button id="back" style="width:100%;padding:8px">設定へ戻る</button></section><section id="finish" class="hidden"><h2>おつかれさま！</h2><p id="summary"></p><div class="row"><button id="again" class="primary">もう一度</button><button id="review">間違いだけ復習</button></div></section><p class="small">間違えた属はこのブラウザに記録されます。分類体系や属の範囲は資料により異なる場合があります。</p></main><script>const DATA=[{"g":"スイカズラ属","f":"スイカズラ科"},{"g":"タニウツギ属","f":"スイカズラ科"},{"g":"キツネノマゴ属","f":"キツネノマゴ科"},{"g":"ハグロソウ属","f":"キツネノマゴ科"},{"g":"ハエドクソウ属","f":"ハエドクソウ科"},{"g":"オトギリソウ属","f":"オトギリソウ科"},{"g":"フウロソウ属","f":"フウロソウ科"},{"g":"カタバミ属","f":"カタバミ科"},{"g":"ヒユ属","f":"ヒユ科"},{"g":"アカザ属","f":"ヒユ科"},{"g":"ヒメハギ属","f":"ヒメハギ科"},{"g":"ツリフネソウ属","f":"ツリフネソウ科"},{"g":"マンネングサ属","f":"ベンケイソウ科"},{"g":"ミセバヤ属","f":"ベンケイソウ科"},{"g":"ユキノシタ属","f":"ユキノシタ科"},{"g":"ネコノメソウ属","f":"ユキノシタ科"},{"g":"アケビ属","f":"アケビ科"},{"g":"ムベ属","f":"アケビ科"},{"g":"ウマノスズクサ属","f":"ウマノスズクサ科"},{"g":"カンアオイ属","f":"ウマノスズクサ科"},{"g":"ツクバネ属","f":"ビャクダン科"},{"g":"カナビキソウ属","f":"ビャクダン科"},{"g":"ヤマモモ属","f":"ヤマモモ科"},{"g":"クルミ属","f":"クルミ科"},{"g":"サワグルミ属","f":"クルミ科"},{"g":"ニレ属","f":"ニレ科"},{"g":"ケヤキ属","f":"ニレ科"},{"g":"エノキ属","f":"アサ科"},{"g":"カナムグラ属","f":"アサ科"},{"g":"ニワトコ属","f":"レンプクソウ科"},{"g":"ガマズミ属","f":"レンプクソウ科"},{"g":"ホシクサ属","f":"ホシクサ科"},{"g":"オシダ属","f":"オシダ科"},{"g":"イノデ属","f":"オシダ科"},{"g":"メシダ属","f":"メシダ科"},{"g":"シケシダ属","f":"メシダ科"},{"g":"イワデンダ属","f":"イワデンダ科"},{"g":"ワラビ属","f":"コバノイシカグマ科"},{"g":"コバノイシカグマ属","f":"コバノイシカグマ科"},{"g":"チャセンシダ属","f":"チャセンシダ科"},{"g":"イノモトソウ属","f":"イノモトソウ科"},{"g":"ホウライシダ属","f":"イノモトソウ科"},{"g":"コケシノブ属","f":"コケシノブ科"},{"g":"アオホラゴケ属","f":"コケシノブ科"},{"g":"ウラジロ属","f":"ウラジロ科"},{"g":"コシダ属","f":"ウラジロ科"},{"g":"トクサ属","f":"トクサ科"},{"g":"ヒカゲノカズラ属","f":"ヒカゲノカズラ科"}];const F=[...new Set(DATA.map(x=>x.f))],KEY="plant_stage3_genus_misses_v1";let mode="quiz",queue=[],i=0,answers={};const $=id=>document.getElementById(id),shuffle=a=>[...a].sort(()=>Math.random()-.5);let misses=new Set(JSON.parse(localStorage.getItem(KEY)||"[]"));function save(){localStorage.setItem(KEY,JSON.stringify([...misses]))}function show(id){["settings","game","finish"].forEach(x=>$(x).classList.toggle("hidden",x!==id))}function start(){let pool=DATA.filter(x=>$("scope").value!=="missed"||misses.has(x.g));if(!pool.length){alert("復習する問題はありません");return}queue=shuffle(pool).slice(0,$("count").value==="all"?pool.length:+$("count").value);answers={};i=0;show("game");render()}function render(){if(i>=queue.length){show("finish");$("summary").textContent=Object.values(answers).filter(x=>x.ok).length+" / "+queue.length+" 問 正解";return}const x=queue[i],a=answers[i];$("progress").textContent=(i+1)+" / "+queue.length+" 問";$("question").textContent=x.g+" は何科？";$("choices").classList.toggle("hidden",mode!=="quiz");$("card").classList.toggle("hidden",mode!=="card");$("marks").classList.toggle("hidden",mode!=="card");$("feedback").textContent=a?(a.ok?"○ 正解！ ":"× 不正解　")+"正答："+x.f:"";$("prev").disabled=i===0;$("next").disabled=!a;if(mode==="quiz"){const opts=shuffle(F.filter(f=>f!==x.f)).slice(0,3).concat(x.f);if(!a||!a.opts)a&&(a.opts=shuffle(opts));const choices=a?.opts||shuffle(opts);$("choices").innerHTML="";choices.forEach(f=>{const b=document.createElement("button");b.textContent=f;if(a){b.disabled=true;if(f===x.f)b.classList.add("correct");else if(f===a.choice)b.classList.add("wrong")}b.onclick=()=>{if(answers[i])return;const ok=f===x.f;answers[i]={ok,choice:f,opts:choices};if(ok)misses.delete(x.g);else misses.add(x.g);save();render()};$("choices").appendChild(b)})}else{$("card").textContent=a?x.f:"タップで答えを見る";$("card").onclick=()=>{$("card").textContent=x.f};$("marks").classList.remove("hidden")}}$("quiz").onclick=()=>{mode="quiz";$("quiz").classList.add("selected");$("flash").classList.remove("selected")};$("flash").onclick=()=>{mode="card";$("flash").classList.add("selected");$("quiz").classList.remove("selected")};$("start").onclick=start;$("prev").onclick=()=>{if(i>0)i--;render()};$("next").onclick=()=>{i++;render()};$("back").onclick=()=>show("settings");$("again").onclick=start;$("review").onclick=()=>{$("scope").value="missed";start()};function mark(ok){const x=queue[i];answers[i]={ok};if(ok)misses.delete(x.g);else misses.add(x.g);save();render()}$("good").onclick=()=>mark(true);$("bad").onclick=()=>mark(false);</script></body></html>

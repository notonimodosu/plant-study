<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>植物2級 第二段階｜種→属・科</title><style>*{box-sizing:border-box}body{margin:0;background:#f3f7f4;color:#19372a;font-family:system-ui,"Noto Sans JP",sans-serif}main{max-width:640px;margin:auto;padding:16px}h1{font-size:22px;margin:10px 0}section{background:#fff;border:1px solid #d8e6db;border-radius:16px;padding:16px;margin:12px 0}button,select{font:inherit;border-radius:11px;padding:12px;border:1px solid #b8d1be;background:white;color:#174b31}button{cursor:pointer}.primary,.selected{background:#176743;color:white}.choices{display:grid;gap:9px;margin:12px 0}.choices button{text-align:left;font-weight:700;min-height:48px}.choices button.correct{background:#d8f5e0}.choices button.wrong{background:#ffe2df}.row{display:flex;gap:8px}.row button{flex:1}.small{font-size:13px;color:#687b6c}.question{font-size:26px;font-weight:800;margin:22px 0}.hidden{display:none}.feedback{font-weight:700;margin:8px 0}.feedback:empty{display:none}#card{min-height:180px;display:grid;place-content:center;text-align:center;border:2px solid #c9e2d1;border-radius:15px;font-size:26px;font-weight:800;background:#f9fdf9;margin:15px 0}select{width:100%}label{display:block;margin:12px 0;font-size:14px}.nav{display:flex;gap:8px;margin:10px 0 8px}.nav button{flex:1;min-height:48px}</style></head><body><main><h1>🌿 種 → 属・科｜第二段階</h1><p class="small">追加20科・108種／第一段階30科は含みません</p><section id="settings"><div class="row"><button id="quiz" class="selected">四択クイズ</button><button id="flash">暗記カード</button></div><label>何を答える？<select id="target"><option value="family">種 → 科</option><option value="genus">種 → 属</option><option value="mix">科・属を混ぜる</option></select></label><label>出題数<select id="count"><option value="10">10問</option><option value="20">20問</option><option value="all">全問</option></select></label><label>出題範囲<select id="scope"><option value="all">追加20科すべて</option><option value="missed">間違えた問題だけ</option></select></label><button id="start" class="primary" style="width:100%">この設定でスタート</button></section><section id="game" class="hidden"><div class="small" id="progress"></div><div class="question" id="question"></div><div id="choices" class="choices"></div><div id="card" class="hidden"></div><div id="marks" class="row hidden"><button id="bad">× まだ覚えていない</button><button id="good" class="primary">○ 覚えた</button></div><div id="feedback" class="feedback"></div><div class="nav"><button id="prev">← 一問戻る</button><button id="next" class="primary">次の問題 →</button></div><button id="back" style="width:100%;padding:8px">設定へ戻る</button></section><section id="finish" class="hidden"><h2>おつかれさま！</h2><p id="summary"></p><div class="row"><button id="again" class="primary">もう一度</button><button id="review">間違いだけ復習</button></div></section><p class="small">現行の科・属の扱いに基づく練習用データです。過去問での出題実績を示すものではありません。</p></main><script>const DATA=[{"species":"アカネ","genus":"アカネ属","family":"アカネ科"},{"species":"オオアカネ","genus":"アカネ属","family":"アカネ科"},{"species":"ヤエムグラ","genus":"ヤエムグラ属","family":"アカネ科"},{"species":"ヨツバムグラ","genus":"ヤエムグラ属","family":"アカネ科"},{"species":"クチナシ","genus":"クチナシ属","family":"アカネ科"},{"species":"コクチナシ","genus":"クチナシ属","family":"アカネ科"},{"species":"ヘクソカズラ","genus":"ヘクソカズラ属","family":"アカネ科"},{"species":"イグサ","genus":"イグサ属","family":"イグサ科"},{"species":"コウガイゼキショウ","genus":"イグサ属","family":"イグサ科"},{"species":"スズメノヤリ","genus":"スズメノヤリ属","family":"イグサ科"},{"species":"ヤマスズメノヒエ","genus":"スズメノヤリ属","family":"イグサ科"},{"species":"スミレ","genus":"スミレ属","family":"スミレ科"},{"species":"タチツボスミレ","genus":"スミレ属","family":"スミレ科"},{"species":"アオイスミレ","genus":"スミレ属","family":"スミレ科"},{"species":"ナガバノスミレサイシン","genus":"スミレ属","family":"スミレ科"},{"species":"サクラソウ","genus":"サクラソウ属","family":"サクラソウ科"},{"species":"クリンソウ","genus":"サクラソウ属","family":"サクラソウ科"},{"species":"オカトラノオ","genus":"オカトラノオ属","family":"サクラソウ科"},{"species":"ヌマトラノオ","genus":"オカトラノオ属","family":"サクラソウ科"},{"species":"ヤブコウジ","genus":"ヤブコウジ属","family":"サクラソウ科"},{"species":"マンリョウ","genus":"ヤブコウジ属","family":"サクラソウ科"},{"species":"オオバコ","genus":"オオバコ属","family":"オオバコ科"},{"species":"ヘラオオバコ","genus":"オオバコ属","family":"オオバコ科"},{"species":"オオイヌノフグリ","genus":"クワガタソウ属","family":"オオバコ科"},{"species":"タチイヌノフグリ","genus":"クワガタソウ属","family":"オオバコ科"},{"species":"クワガタソウ","genus":"クワガタソウ属","family":"オオバコ科"},{"species":"ヒルガオ","genus":"ヒルガオ属","family":"ヒルガオ科"},{"species":"コヒルガオ","genus":"ヒルガオ属","family":"ヒルガオ科"},{"species":"サツマイモ","genus":"サツマイモ属","family":"ヒルガオ科"},{"species":"マルバアサガオ","genus":"サツマイモ属","family":"ヒルガオ科"},{"species":"ネナシカズラ","genus":"ネナシカズラ属","family":"ヒルガオ科"},{"species":"アメリカネナシカズラ","genus":"ネナシカズラ属","family":"ヒルガオ科"},{"species":"ナス","genus":"ナス属","family":"ナス科"},{"species":"ジャガイモ","genus":"ナス属","family":"ナス科"},{"species":"イヌホオズキ","genus":"ナス属","family":"ナス科"},{"species":"ホオズキ","genus":"ホオズキ属","family":"ナス科"},{"species":"ハシリドコロ","genus":"ハシリドコロ属","family":"ナス科"},{"species":"クコ","genus":"クコ属","family":"ナス科"},{"species":"キキョウ","genus":"キキョウ属","family":"キキョウ科"},{"species":"ツリガネニンジン","genus":"ツリガネニンジン属","family":"キキョウ科"},{"species":"ソバナ","genus":"ツリガネニンジン属","family":"キキョウ科"},{"species":"ホタルブクロ","genus":"ホタルブクロ属","family":"キキョウ科"},{"species":"ヤマホタルブクロ","genus":"ホタルブクロ属","family":"キキョウ科"},{"species":"リンドウ","genus":"リンドウ属","family":"リンドウ科"},{"species":"ハルリンドウ","genus":"リンドウ属","family":"リンドウ科"},{"species":"フデリンドウ","genus":"リンドウ属","family":"リンドウ科"},{"species":"センブリ","genus":"センブリ属","family":"リンドウ科"},{"species":"イヌセンブリ","genus":"センブリ属","family":"リンドウ科"},{"species":"アケボノソウ","genus":"アケボノソウ属","family":"リンドウ科"},{"species":"カラスウリ","genus":"カラスウリ属","family":"ウリ科"},{"species":"キカラスウリ","genus":"カラスウリ属","family":"ウリ科"},{"species":"アマチャヅル","genus":"アマチャヅル属","family":"ウリ科"},{"species":"キュウリ","genus":"キュウリ属","family":"ウリ科"},{"species":"メロン","genus":"キュウリ属","family":"ウリ科"},{"species":"トウダイグサ","genus":"トウダイグサ属","family":"トウダイグサ科"},{"species":"ナツトウダイ","genus":"トウダイグサ属","family":"トウダイグサ科"},{"species":"アカメガシワ","genus":"アカメガシワ属","family":"トウダイグサ科"},{"species":"エノキグサ","genus":"エノキグサ属","family":"トウダイグサ科"},{"species":"ヤマグワ","genus":"クワ属","family":"クワ科"},{"species":"マグワ","genus":"クワ属","family":"クワ科"},{"species":"イチジク","genus":"イチジク属","family":"クワ科"},{"species":"イヌビワ","genus":"イチジク属","family":"クワ科"},{"species":"オオイタビ","genus":"イチジク属","family":"クワ科"},{"species":"カジノキ","genus":"カジノキ属","family":"クワ科"},{"species":"コウゾ","genus":"カジノキ属","family":"クワ科"},{"species":"ヒメコウゾ","genus":"カジノキ属","family":"クワ科"},{"species":"イラクサ","genus":"イラクサ属","family":"イラクサ科"},{"species":"ミヤマイラクサ","genus":"イラクサ属","family":"イラクサ科"},{"species":"カラムシ","genus":"カラムシ属","family":"イラクサ科"},{"species":"ナンバンカラムシ","genus":"カラムシ属","family":"イラクサ科"},{"species":"ミズ","genus":"ミズ属","family":"イラクサ科"},{"species":"アオミズ","genus":"ミズ属","family":"イラクサ科"},{"species":"ヤブマオ","genus":"ヤブマオ属","family":"イラクサ科"},{"species":"メヤブマオ","genus":"ヤブマオ属","family":"イラクサ科"},{"species":"タヌキモ","genus":"タヌキモ属","family":"タヌキモ科"},{"species":"イヌタヌキモ","genus":"タヌキモ属","family":"タヌキモ科"},{"species":"ミミカキグサ","genus":"タヌキモ属","family":"タヌキモ科"},{"species":"ムシトリスミレ","genus":"ムシトリスミレ属","family":"タヌキモ科"},{"species":"コウシンソウ","genus":"ムシトリスミレ属","family":"タヌキモ科"},{"species":"モウセンゴケ","genus":"モウセンゴケ属","family":"モウセンゴケ科"},{"species":"ナガバノモウセンゴケ","genus":"モウセンゴケ属","family":"モウセンゴケ科"},{"species":"コモウセンゴケ","genus":"モウセンゴケ属","family":"モウセンゴケ科"},{"species":"トウカイコモウセンゴケ","genus":"モウセンゴケ属","family":"モウセンゴケ科"},{"species":"ハエトリグサ","genus":"ハエトリグサ属","family":"モウセンゴケ科"},{"species":"ヒガンバナ","genus":"ヒガンバナ属","family":"ヒガンバナ科"},{"species":"キツネノカミソリ","genus":"ヒガンバナ属","family":"ヒガンバナ科"},{"species":"ネギ","genus":"ネギ属","family":"ヒガンバナ科"},{"species":"ニラ","genus":"ネギ属","family":"ヒガンバナ科"},{"species":"ノビル","genus":"ネギ属","family":"ヒガンバナ科"},{"species":"ハマオモト","genus":"ハマオモト属","family":"ヒガンバナ科"},{"species":"ニホンズイセン","genus":"スイセン属","family":"ヒガンバナ科"},{"species":"ラッパスイセン","genus":"スイセン属","family":"ヒガンバナ科"},{"species":"アヤメ","genus":"アヤメ属","family":"アヤメ科"},{"species":"カキツバタ","genus":"アヤメ属","family":"アヤメ科"},{"species":"ハナショウブ","genus":"アヤメ属","family":"アヤメ科"},{"species":"サフラン","genus":"クロッカス属","family":"アヤメ科"},{"species":"グラジオラス","genus":"グラジオラス属","family":"アヤメ科"},{"species":"ツユクサ","genus":"ツユクサ属","family":"ツユクサ科"},{"species":"マルバツユクサ","genus":"ツユクサ属","family":"ツユクサ科"},{"species":"イボクサ","genus":"イボクサ属","family":"ツユクサ科"},{"species":"ムラサキツユクサ","genus":"ムラサキツユクサ属","family":"ツユクサ科"},{"species":"ガマ","genus":"ガマ属","family":"ガマ科"},{"species":"コガマ","genus":"ガマ属","family":"ガマ科"},{"species":"ヒメガマ","genus":"ガマ属","family":"ガマ科"},{"species":"ミクリ","genus":"ミクリ属","family":"ガマ科"},{"species":"ナガエミクリ","genus":"ミクリ属","family":"ガマ科"},{"species":"ゼンマイ","genus":"ゼンマイ属","family":"ゼンマイ科"},{"species":"ヤシャゼンマイ","genus":"ゼンマイ属","family":"ゼンマイ科"}];const KEY="plant_stage2_species_misses_v1";let mode="quiz",queue=[],i=0,answers={};const $=id=>document.getElementById(id),shuffle=a=>[...a].sort(()=>Math.random()-.5);let misses=new Set(JSON.parse(localStorage.getItem(KEY)||"[]"));function save(){localStorage.setItem(KEY,JSON.stringify([...misses]))}function show(id){["settings","game","finish"].forEach(x=>$(x).classList.toggle("hidden",x!==id))}function start(){let t=$("target").value;let pool=DATA.flatMap(x=>t==="mix"?[{...x,type:"family"},{...x,type:"genus"}]:[{...x,type:t}]).filter(x=>$("scope").value!=="missed"||misses.has(x.species+"|"+x.type));if(!pool.length){alert("復習する問題はありません");return}queue=shuffle(pool).slice(0,$("count").value==="all"?pool.length:+$("count").value);answers={};i=0;show("game");render()}function render(){if(i>=queue.length){show("finish");$("summary").textContent=Object.values(answers).filter(x=>x.ok).length+" / "+queue.length+" 問 正解";return}const x=queue[i],a=answers[i],right=x[x.type],key=x.species+"|"+x.type;$("progress").textContent=(i+1)+" / "+queue.length+" 問";$("question").textContent=x.species+" は何"+(x.type==="family"?"科":"属")+"？";$("choices").classList.toggle("hidden",mode!=="quiz");$("card").classList.toggle("hidden",mode!=="card");$("marks").classList.toggle("hidden",mode!=="card");$("feedback").textContent=a?(a.ok?"○ 正解！ ":"× 不正解　")+"正答："+right:"";$("prev").disabled=i===0;$("next").disabled=!a;if(mode==="quiz"){const options=a?.opts||shuffle(shuffle([...new Set(DATA.map(z=>z[x.type]))].filter(f=>f!==right)).slice(0,3).concat(right));$("choices").innerHTML="";options.forEach(f=>{const b=document.createElement("button");b.textContent=f;if(a){b.disabled=true;if(f===right)b.classList.add("correct");else if(f===a.choice)b.classList.add("wrong")}b.onclick=()=>{if(answers[i])return;const ok=f===right;answers[i]={ok,choice:f,opts:options};if(ok)misses.delete(key);else misses.add(key);save();render()};$("choices").appendChild(b)})}else{$("card").textContent=a?right:"タップで答えを見る";$("card").onclick=()=>{$("card").textContent=right};$("marks").classList.remove("hidden")}}$("quiz").onclick=()=>{mode="quiz";$("quiz").classList.add("selected");$("flash").classList.remove("selected")};$("flash").onclick=()=>{mode="card";$("flash").classList.add("selected");$("quiz").classList.remove("selected")};$("start").onclick=start;$("prev").onclick=()=>{if(i>0)i--;render()};$("next").onclick=()=>{i++;render()};$("back").onclick=()=>show("settings");$("again").onclick=start;$("review").onclick=()=>{$("scope").value="missed";start()};function mark(ok){const x=queue[i],key=x.species+"|"+x.type;answers[i]={ok};if(ok)misses.delete(key);else misses.add(key);save();render()}$("good").onclick=()=>mark(true);$("bad").onclick=()=>mark(false);</script></body></html>

<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>植物2級｜第二段階20科・属から科</title><style>*{box-sizing:border-box}body{margin:0;background:#f3f7f4;color:#19372a;font-family:system-ui,"Noto Sans JP",sans-serif}main{max-width:640px;margin:auto;padding:16px}h1{font-size:22px}section{background:#fff;border:1px solid #d8e6db;border-radius:16px;padding:16px;margin:12px 0}button,select{font:inherit;border-radius:11px;padding:12px;border:1px solid #b8d1be;background:white;color:#174b31}button{cursor:pointer}.primary,.selected{background:#176743;color:white}.choices{display:grid;gap:9px;margin:12px 0}.choices button{text-align:left;font-weight:700}.choices button.correct{background:#d8f5e0}.choices button.wrong{background:#ffe2df}.row{display:flex;gap:8px}.row button{flex:1}.small{font-size:13px;color:#687b6c}.question{font-size:26px;font-weight:800;margin:24px 0}.hidden{display:none}.feedback{min-height:42px;font-weight:700}#card{min-height:190px;display:grid;place-content:center;text-align:center;border:2px solid #c9e2d1;border-radius:15px;font-size:27px;font-weight:800;background:#f9fdf9;margin:15px 0}select{width:100%}label{display:block;margin:12px 0;font-size:14px}.nav{display:flex;gap:8px;margin:12px 0}.nav button{flex:1}</style></head><body><main><h1>🌿 属 → 科｜第二段階20科</h1><p class="small">追加20科・57属／第一段階30科は含みません</p><section id="settings"><div class="row"><button id="quiz" class="selected">四択クイズ</button><button id="flash">暗記カード</button></div><label>出題数<select id="count"><option value="10">10問</option><option value="20">20問</option><option value="all">全問</option></select></label><label>出題範囲<select id="scope"><option value="all">追加20科すべて</option><option value="missed">間違えた問題だけ</option></select></label><button id="start" class="primary" style="width:100%">この設定でスタート</button></section><section id="game" class="hidden"><div class="small" id="progress"></div><div class="question" id="question"></div><div id="choices" class="choices"></div><div id="card" class="hidden"></div><div id="marks" class="row hidden"><button id="bad">× まだ覚えていない</button><button id="good" class="primary">○ 覚えた</button></div><div id="feedback" class="feedback"></div><div class="nav"><button id="prev">← 一問戻る</button><button id="next" class="primary">次の問題 →</button></div><button id="back" style="width:100%;padding:8px">設定へ戻る</button></section><section id="finish" class="hidden"><h2>おつかれさま！</h2><p id="summary"></p><div class="row"><button id="again" class="primary">もう一度</button><button id="review">間違いだけ復習</button></div></section><p class="small">間違えた属はこのブラウザに記録されます。分類体系や属の範囲は資料により異なる場合があります。</p></main><script>const DATA=[{"g":"アカネ属","f":"アカネ科"},{"g":"ヤエムグラ属","f":"アカネ科"},{"g":"クチナシ属","f":"アカネ科"},{"g":"ヘクソカズラ属","f":"アカネ科"},{"g":"イグサ属","f":"イグサ科"},{"g":"スズメノヤリ属","f":"イグサ科"},{"g":"スミレ属","f":"スミレ科"},{"g":"サクラソウ属","f":"サクラソウ科"},{"g":"オカトラノオ属","f":"サクラソウ科"},{"g":"ヤブコウジ属","f":"サクラソウ科"},{"g":"オオバコ属","f":"オオバコ科"},{"g":"クワガタソウ属","f":"オオバコ科"},{"g":"キンギョソウ属","f":"オオバコ科"},{"g":"ヒルガオ属","f":"ヒルガオ科"},{"g":"サツマイモ属","f":"ヒルガオ科"},{"g":"ネナシカズラ属","f":"ヒルガオ科"},{"g":"ナス属","f":"ナス科"},{"g":"ホオズキ属","f":"ナス科"},{"g":"ハシリドコロ属","f":"ナス科"},{"g":"クコ属","f":"ナス科"},{"g":"キキョウ属","f":"キキョウ科"},{"g":"ツリガネニンジン属","f":"キキョウ科"},{"g":"ホタルブクロ属","f":"キキョウ科"},{"g":"リンドウ属","f":"リンドウ科"},{"g":"センブリ属","f":"リンドウ科"},{"g":"アケボノソウ属","f":"リンドウ科"},{"g":"カラスウリ属","f":"ウリ科"},{"g":"アマチャヅル属","f":"ウリ科"},{"g":"キュウリ属","f":"ウリ科"},{"g":"トウダイグサ属","f":"トウダイグサ科"},{"g":"アカメガシワ属","f":"トウダイグサ科"},{"g":"エノキグサ属","f":"トウダイグサ科"},{"g":"クワ属","f":"クワ科"},{"g":"イチジク属","f":"クワ科"},{"g":"コウゾ属","f":"クワ科"},{"g":"カジノキ属","f":"クワ科"},{"g":"イラクサ属","f":"イラクサ科"},{"g":"カラムシ属","f":"イラクサ科"},{"g":"ミズ属","f":"イラクサ科"},{"g":"ヤブマオ属","f":"イラクサ科"},{"g":"タヌキモ属","f":"タヌキモ科"},{"g":"ムシトリスミレ属","f":"タヌキモ科"},{"g":"モウセンゴケ属","f":"モウセンゴケ科"},{"g":"ハエトリグサ属","f":"モウセンゴケ科"},{"g":"ヒガンバナ属","f":"ヒガンバナ科"},{"g":"ネギ属","f":"ヒガンバナ科"},{"g":"ハマオモト属","f":"ヒガンバナ科"},{"g":"スイセン属","f":"ヒガンバナ科"},{"g":"アヤメ属","f":"アヤメ科"},{"g":"クロッカス属","f":"アヤメ科"},{"g":"グラジオラス属","f":"アヤメ科"},{"g":"ツユクサ属","f":"ツユクサ科"},{"g":"イボクサ属","f":"ツユクサ科"},{"g":"ムラサキツユクサ属","f":"ツユクサ科"},{"g":"ガマ属","f":"ガマ科"},{"g":"ミクリ属","f":"ガマ科"},{"g":"ゼンマイ属","f":"ゼンマイ科"}];const F=[...new Set(DATA.map(x=>x.f))],KEY="plant_stage2_genus_misses";let mode="quiz",queue=[],i=0,answers={};const $=id=>document.getElementById(id),shuffle=a=>[...a].sort(()=>Math.random()-.5);let misses=new Set(JSON.parse(localStorage.getItem(KEY)||"[]"));function save(){localStorage.setItem(KEY,JSON.stringify([...misses]))}function show(id){["settings","game","finish"].forEach(x=>$(x).classList.toggle("hidden",x!==id))}function start(){let pool=DATA.filter(x=>$("scope").value!=="missed"||misses.has(x.g));if(!pool.length){alert("復習する問題はありません");return}queue=shuffle(pool).slice(0,$("count").value==="all"?pool.length:+$("count").value);answers={};i=0;show("game");render()}function render(){if(i>=queue.length){show("finish");$("summary").textContent=Object.values(answers).filter(x=>x.ok).length+" / "+queue.length+" 問 正解";return}const x=queue[i],a=answers[i];$("progress").textContent=(i+1)+" / "+queue.length+" 問";$("question").textContent=x.g+" は何科？";$("choices").classList.toggle("hidden",mode!=="quiz");$("card").classList.toggle("hidden",mode!=="card");$("marks").classList.toggle("hidden",mode!=="card");$("feedback").textContent=a?(a.ok?"○ 正解！ ":"× 不正解　")+"正答："+x.f:"";$("prev").disabled=i===0;$("next").disabled=!a;if(mode==="quiz"){const opts=shuffle(F.filter(f=>f!==x.f)).slice(0,3).concat(x.f);if(!a||!a.opts)a&&(a.opts=shuffle(opts));const choices=a?.opts||shuffle(opts);$("choices").innerHTML="";choices.forEach(f=>{const b=document.createElement("button");b.textContent=f;if(a){b.disabled=true;if(f===x.f)b.classList.add("correct");else if(f===a.choice)b.classList.add("wrong")}b.onclick=()=>{if(answers[i])return;const ok=f===x.f;answers[i]={ok,choice:f,opts:choices};if(ok)misses.delete(x.g);else misses.add(x.g);save();render()};$("choices").appendChild(b)})}else{$("card").textContent=a?x.f:"タップで答えを見る";$("card").onclick=()=>{$("card").textContent=x.f};$("marks").classList.remove("hidden")}}$("quiz").onclick=()=>{mode="quiz";$("quiz").classList.add("selected");$("flash").classList.remove("selected")};$("flash").onclick=()=>{mode="card";$("flash").classList.add("selected");$("quiz").classList.remove("selected")};$("start").onclick=start;$("prev").onclick=()=>{if(i>0)i--;render()};$("next").onclick=()=>{i++;render()};$("back").onclick=()=>show("settings");$("again").onclick=start;$("review").onclick=()=>{$("scope").value="missed";start()};function mark(ok){const x=queue[i];answers[i]={ok};if(ok)misses.delete(x.g);else misses.add(x.g);save();render()}$("good").onclick=()=>mark(true);$("bad").onclick=()=>mark(false);</script></body></html>

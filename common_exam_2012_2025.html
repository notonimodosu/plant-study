<!doctype html><html lang="ja"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>共通問題 過去問学習・確認済み版</title><style>*{box-sizing:border-box}body{margin:0;background:#f3f6f9;color:#263140;font-family:system-ui,"Noto Sans JP",sans-serif}main{max-width:680px;margin:auto;padding:16px}h1{font-size:23px;margin:12px 0}a{color:#1164ad}.panel{padding:17px;background:white;border:1px solid #d9e1e8;border-radius:15px;margin:12px 0}button,select{font:inherit;padding:11px;border:1px solid #c7d4df;background:white;border-radius:10px;color:#24344b}.primary,.active{background:#1765b4;border-color:#1765b4;color:white}.row{display:flex;gap:8px}.row button{flex:1}.opt{display:block;width:100%;text-align:left;margin:8px 0}.good{border:2px solid #168350;background:#e8faf0}.bad{border:2px solid #b83335;background:#fff0f0}.small{font-size:13px;color:#617188}.q{font-size:19px;font-weight:700;line-height:1.7;margin:18px 0}.hidden{display:none}.full{width:100%;margin:7px 0}label{display:block;font-weight:600;margin:15px 0 7px}.foot{margin-top:16px;display:grid;grid-template-columns:1fr 1fr;gap:10px}.desc{line-height:1.7;white-space:pre-wrap}.pills{display:flex;gap:7px;flex-wrap:wrap}</style><main><a href="./index.html">← 学習ホーム</a><h1>📘 共通問題・過去問学習</h1><p class="small">2012〜2025年度を段階的に登録中。現在は問題文・解答を独立に確認した一部の文章問題のみを出題します。公式解答との完全照合は未完了です。</p><section class="panel" id="settings"><b id="count"></b><label>問題数</label><div class="row" id="nopts"><button class="active" data-n="10">10問</button><button data-n="20">20問</button><button data-n="all">全問</button></div><label>年度</label><select id="year" class="full"><option value="all">登録済み年度から混合</option></select><p class="small" id="saved"></p><button id="start" class="primary full">スタート</button><button id="wrong" class="full">間違えた問題だけ復習</button><button id="clear" class="full">間違い履歴を消す</button></section><section class="panel hidden" id="quiz"><div class="row" style="justify-content:space-between;align-items:center"><span id="progress" class="small"></span><button id="home" style="font-size:12px">設定へ戻る</button></div><div class="q" id="question"></div><div id="options"></div><div id="explain" class="desc"></div><div class="foot"><button id="prev">一問戻る</button><button id="next" class="primary">次の問題</button></div></section><section class="panel hidden" id="end"><h2>学習結果</h2><h1 id="score"></h1><button id="retry" class="primary full">今回の間違いを復習</button><button id="rehome" class="full">設定へ戻る</button></section><p class="small">過去問から転記した原文を基本にしています。一部の旧分類には現行知識の注記があります。問題番号・出典年度を表示します。</p></main><script>const DATA=[{"id":"2023-1","year":2023,"num":"1","q":"雌雄同体の動物群をひとつ選びなさい。","opts":["ウニ類","イカ類","ゴカイ類","フジツボ類"],"correct":3,"explanation":"フジツボ類は多くが雌雄同体。","note":""},{"id":"2023-2","year":2023,"num":"2","q":"他からもっとも類縁の遠い動物群をひとつ選びなさい。","opts":["環形動物","緩歩動物","節足動物","線形動物"],"correct":0,"explanation":"緩歩動物・節足動物・線形動物は脱皮動物。環形動物は螺旋卵割動物側。","note":""},{"id":"2023-4","year":2023,"num":"4","q":"完全変態をしない昆虫をひとつ選びなさい。","opts":["アメンボ","ウスバカゲロウ","ハナアブ","ミズスマシ"],"correct":0,"explanation":"アメンボは半翅目で不完全変態。他の三者は完全変態。","note":""},{"id":"2023-5","year":2023,"num":"5","q":"コケ植物をひとつ選びなさい。","opts":["ウメノキゴケ","ジャゴケ","サルオガセ","コケサルノコシカケ"],"correct":1,"explanation":"ジャゴケは苔類。ウメノキゴケとサルオガセは地衣類、コケサルノコシカケは菌類。","note":""},{"id":"2023-6","year":2023,"num":"6","q":"配偶体から独立した胞子体をつくらないものをひとつ選びなさい。","opts":["クラマゴケ","コケシノブ","ハイホラゴケ","オオミズゴケ"],"correct":3,"explanation":"コケ植物のオオミズゴケは胞子体が配偶体に依存する。シダ・小葉植物は胞子体が独立する。","note":""},{"id":"2023-8","year":2023,"num":"8","q":"雌蕊の説明として正しいものをひとつ選びなさい。","opts":["花の中心部にある、訪花動物を誘う装飾器官で、多くは柱状の形状をしている。","花の構造上の中心となる支持器官で、下部は膨らみ、上部は柱状となる。","花の雌性の生殖器官で、多くは胚珠を収納する子房、花柱、柱頭からなる。","花の生殖器官で、下部の雄性部分に対して上部の雌性部分をいう。"],"correct":2,"explanation":"雌蕊は柱頭・花柱・子房からなるのが典型。","note":""},{"id":"2023-9","year":2023,"num":"9","q":"原生生物をひとつ選びなさい。","opts":["ゾウリムシ類","コケムシ類","ホウキムシ類","ミジンコ類"],"correct":0,"explanation":"ゾウリムシは真核単細胞の繊毛虫類。他は動物。","note":"原生生物は系統的な単一群ではなく便宜的総称。"},{"id":"2023-10","year":2023,"num":"10","q":"菌類でないものをひとつ選びなさい。","opts":["タマホコリカビ","アオカビ","アカパンカビ","パンコウボ"],"correct":0,"explanation":"タマホコリカビは社会性アメーバ類（真正の菌類ではない）。","note":""},{"id":"2023-11","year":2023,"num":"11","q":"歩帯がある動物群をひとつ選びなさい。","opts":["環形動物","棘皮動物","脊索動物","節足動物"],"correct":1,"explanation":"棘皮動物の歩帯は管足の配置と関係する。","note":""},{"id":"2023-12","year":2023,"num":"12","q":"動物群と幼生との組み合わせが誤りであるものをひとつ選びなさい。","opts":["軟体動物－ベリジャー幼生","軟体動物－プルテウス幼生","節足動物－キプリス幼生","節足動物－メガロパ幼生"],"correct":1,"explanation":"プルテウス幼生は棘皮動物（ウニ・クモヒトデなど）にみられる。","note":""},{"id":"2023-14","year":2023,"num":"14","q":"国際藻類・菌類・植物命名規約に関する記述として、誤りであるものをひとつ選びなさい。","opts":["分類群の一次ランクは界・門・綱・目・科・属・種である。","分類群の二次ランクとして、科と属の間には連がある。","属と種の間の二次ランクには、節と列がある。","種より下位の二次ランクに規定されているランクはない。"],"correct":3,"explanation":"種の下位には亜種・変種・品種などのランクがある。","note":""},{"id":"2023-19","year":2023,"num":"19","q":"次の動物の分類階級が、上位から下位の順に、左から並んでいるものをひとつ選びなさい。","opts":["Class – Order – Family – Tribe – Genus","Class – Order – Tribe – Genus – Family","Order – Class – Tribe – Family – Genus","Order – Class – Genus – Tribe – Family"],"correct":0,"explanation":"綱 Class → 目 Order → 科 Family → 族 Tribe → 属 Genus。","note":""},{"id":"2023-20","year":2023,"num":"20","q":"ショウジョウバエを実験材料として、生物の遺伝を研究した人を選びなさい。","opts":["モーガン","メンデル","ヘッケル","木原均"],"correct":0,"explanation":"トーマス・ハント・モーガンのショウジョウバエ遺伝学研究。","note":""},{"id":"2022-1","year":2022,"num":"1","q":"昆虫やクモの内臓にある排出器官をひとつ選びなさい。","opts":["原腎管","ゴルジ体","ボーマン嚢","マルピーギ管"],"correct":3,"explanation":"マルピーギ管は昆虫や多くのクモ類に見られる排出器官。","note":""},{"id":"2022-2","year":2022,"num":"2","q":"他からもっとも類縁の遠い動物門をひとつ選びなさい。","opts":["環形動物","線形動物","軟体動物","扁形動物"],"correct":1,"explanation":"線形動物は脱皮動物。他は螺旋卵割動物系統に属する。","note":""},{"id":"2022-3","year":2022,"num":"3","q":"ウシにはみられない歯をひとつ選びなさい。","opts":["下顎の臼歯","下顎の切歯","上顎の臼歯","上顎の切歯"],"correct":3,"explanation":"ウシは上顎の切歯を欠き、歯床板を持つ。","note":""},{"id":"2022-4","year":2022,"num":"4","q":"体外受精をする種をひとつ選びなさい。","opts":["アカウミガメ","ウミウシ","トウサマガエル","バンドウイルカ"],"correct":2,"explanation":"多くのカエル類は体外受精する。爬虫類・哺乳類は体内受精。","note":""},{"id":"2022-6","year":2022,"num":"6","q":"種子に翼が発達している植物をひとつ選びなさい。","opts":["カエデ","カタバミ","ナズナ","ヤマノイモ"],"correct":3,"explanation":"ヤマノイモの種子は翼を持つ。カエデは翼果であり果実が翼を形成する。","note":""},{"id":"2022-7","year":2022,"num":"7","q":"次の科のうち、APG分類体系（APG III または IV）でもっとも原始的な科をひとつ選びなさい。","opts":["キク科","マツブサ科","マメ科","ユリ科"],"correct":1,"explanation":"マツブサ科は被子植物の初期分岐系統であるアウストロバイレヤ目に属する。","note":"「原始的」は進化の優劣を意味しない。"},{"id":"2022-8","year":2022,"num":"8","q":"子嚢菌類をひとつ選びなさい。","opts":["オオゴムタケ","オニフスベ","ショウロ","シロキクラゲ"],"correct":0,"explanation":"オオゴムタケは子嚢菌類。他は担子菌類。","note":""},{"id":"2022-9","year":2022,"num":"9","q":"原核生物に関する記述として誤りであるものをひとつ選びなさい。","opts":["原核生物は大きく2つのグループ、細菌（バクテリア）と古細菌より構成される。","原核生物ではRNAが遺伝子の働きをする。","原核生物は細胞膜をもつ。","原核生物は細胞核をもたない。"],"correct":1,"explanation":"細胞生物の遺伝物質はDNA。RNAは転写物として多様な働きをする。","note":""},{"id":"2022-10","year":2022,"num":"10","q":"単細胞生物だけの組み合わせをひとつ選びなさい。","opts":["ウミホタル－ヤコウチュウ","ワラジムシ－ゾウリムシ","ゾウリムシ－ヤコウチュウ","ツリガネムシ－ハリガネムシ"],"correct":2,"explanation":"ゾウリムシとヤコウチュウは単細胞の真核生物。","note":""},{"id":"2022-11-1","year":2022,"num":"11-1","q":"富栄養化した淡水域で発生するアオコの主体となる単細胞微細藻類は（A）に属する（B）である。Aにあてはまるものをひとつ選びなさい。","opts":["菌界","原核生物界","原生生物界","植物界"],"correct":1,"explanation":"アオコの主体である藍藻（シアノバクテリア）は原核生物。","note":"五界説による分類であり、現代では細菌ドメインに置く。"},{"id":"2022-11-2","year":2022,"num":"11-2","q":"富栄養化した淡水域で発生するアオコの主体となる単細胞微細藻類について、Bにあてはまるものをひとつ選びなさい。","opts":["渦鞭毛藻","珪藻","藍藻","緑藻"],"correct":2,"explanation":"アオコの主体は藍藻（シアノバクテリア）。","note":""},{"id":"2022-14","year":2022,"num":"14","q":"ハツカネズミの学名を次のように示したとき、これについて正しい記述をひとつ選びなさい。Mus musculus Linnaeus 1758","opts":["Linnaeusはハツカネズミの発見者を、1758は発見された年を意味する。","Linnaeusはハツカネズミの学名の命名者を、1758は発見された年を意味する。","Linnaeusはハツカネズミの発見者を、1758は学名が公表された年を意味する。","Linnaeusはハツカネズミの学名の命名者を、1758は学名が公表された年を意味する。"],"correct":3,"explanation":"学名後の著者と年は、発見者・発見年ではなく命名者・公表年を表す。","note":""},{"id":"2022-16","year":2022,"num":"16","q":"「カンブリアの大爆発」とはどのような現象か、ひとつ選びなさい。","opts":["多様な海洋生物が一斉に分化したこと。","巨大隕石の落下の影響を受けて多くの生物が絶滅したこと。","巨大火山の噴火後の気温低下が多くの生物の絶滅の原因になったこと。","被子植物の爆発的な大繁栄が恐竜の絶滅の一因になったこと。"],"correct":0,"explanation":"カンブリア紀初期に動物の主要な形態・系統が急速に多様化した現象。","note":""},{"id":"2022-18","year":2022,"num":"18","q":"国際動物命名規約に関する記述として、誤りであるものをひとつ選びなさい。","opts":["すでに命名されている種に別の学名を与えた場合は、先に発表された学名が優先される。","絶滅種も、現生種と同じ命名規約によって規定される。","属名を変更する際には、必ず種小名も変更しなければならない。","新種として学名を発表する際には、その種の基準となるホロタイプを指定する。"],"correct":2,"explanation":"属の組み替えでは種小名を維持することが多い。性一致などで語尾が変わる場合はある。","note":""},{"id":"2022-19","year":2022,"num":"19","q":"ラン科オフリス属（Ophrys）の一部の種が、花冠がマルハナバチ類のメスに似た形と色をしているため、この花を訪れたオスは交尾しようと行動（擬似交接）し、それにより送粉・受粉が行われる。この受粉の研究を行った生物学者を選びなさい。","opts":["ダーウィン","ビュフォン","ヘッケル","ラマルク"],"correct":0,"explanation":"ダーウィンはラン科植物の送粉機構を研究した。","note":""},{"id":"2021-1","year":2021,"num":"1","q":"海中で授乳する種を含まない動物群をひとつ選びなさい。","opts":["哺乳類","鳥類","爬虫類","両生類"],"correct":3,"explanation":"両生類には海中で授乳する種はいない。","note":""},{"id":"2021-5","year":2021,"num":"5","q":"ゴカイが属する動物群をひとつ選びなさい。","opts":["環形動物","節足動物","線形動物","扁形動物"],"correct":0,"explanation":"ゴカイ類は環形動物門の多毛類。","note":""},{"id":"2021-7","year":2021,"num":"7","q":"種子植物とシダ植物に共通する形質をひとつ選びなさい。","opts":["仮導管","種子","托葉","二次木部"],"correct":0,"explanation":"仮導管は種子植物とシダ植物に広く存在する。","note":""},{"id":"2021-8","year":2021,"num":"8","q":"光合成色素としてクロロフィルaとクロロフィルbをもつ分類群をひとつ選びなさい。","opts":["褐藻類","珪藻類","藍藻類","緑藻類"],"correct":3,"explanation":"緑藻類はクロロフィルa,bを持つ。","note":""},{"id":"2021-9","year":2021,"num":"9","q":"最近の生物分類において、菌類が所属するスーパーグループ名をひとつ選びなさい。","opts":["アーケプラスチダ","アメーボゾア","オピストコンタ","ストラメノパイル"],"correct":2,"explanation":"菌類は動物とともにオピストコンタに属する。","note":""},{"id":"2021-10","year":2021,"num":"10","q":"日本の冷温帯林の主要樹種をひとつ選びなさい。","opts":["モミ","クロマツ","スダジイ","ブナ"],"correct":3,"explanation":"ブナは日本の冷温帯落葉広葉樹林の代表的優占種。","note":""},{"id":"2021-11","year":2021,"num":"11","q":"シダ植物の世代交代にあてはまるものをひとつ選びなさい。","opts":["配偶体は胞子体内にある。","配偶体だけで、胞子体はない。","胞子体が発達し、配偶体はあまり発達しない。","胞子体は配偶体上にある。"],"correct":2,"explanation":"シダ植物では独立した胞子体が大きく発達し、配偶体は小さい前葉体。","note":""},{"id":"2021-18","year":2021,"num":"18","q":"次の地質時代のうち「魚類の時代」といえるものをひとつ選びなさい。","opts":["カンブリア紀","デボン紀","ジュラ紀","古第三紀"],"correct":1,"explanation":"デボン紀は魚類が繁栄した時代として知られる。","note":""},{"id":"2021-19","year":2021,"num":"19","q":"ハーディ・ワインベルクの法則が成立するための条件として、誤りであるものをひとつ選びなさい。","opts":["集団内の交配は作為的でなければいけない。","集団内の個体数は十分に大きくなければいけない。","他の集団との間に個体の流出や流入がないこと。","突然変異がおこらないこと。"],"correct":0,"explanation":"成立条件は無作為交配・大集団・移住なし・突然変異なし・自然選択なし。","note":""},{"id":"2021-20","year":2021,"num":"20","q":"生物の進化に関して天変地異説を唱えた生物学者の名前をひとつ選びなさい。","opts":["ウォーレス","キュヴィエ","ヘッケル","ラマルク"],"correct":1,"explanation":"キュヴィエは天変地異説で知られる。","note":""},{"id":"2025-2","year":2025,"num":"2","q":"カモ科に属さない種をひとつ選びなさい。","opts":["エトピリカ","コハクチョウ","コクガン","カリガネ"],"correct":0,"explanation":"エトピリカはウミスズメ科。コハクチョウ・コクガン・カリガネはカモ科。","note":""},{"id":"2025-3","year":2025,"num":"3","q":"チョウザメの記述として誤りであるものをひとつ選びなさい。","opts":["鰓孔は左右1対である。","尾鰭は上下非対称である。","背鰭は1基のみである。","楯鱗をもつ。"],"correct":3,"explanation":"チョウザメは硬骨魚類系統の軟質類で、体表に骨板（硬鱗状の鱗板）をもつ。楯鱗は軟骨魚類の特徴。","note":""},{"id":"2025-5","year":2025,"num":"5","q":"次の特徴をもつ節足動物の種をひとつ選びなさい。体は頭胸部と腹部に分かれ、頭胸部に8個の単眼と8本の歩脚を有する。鋏角を有し書肺および気管で呼吸する。","opts":["オニグモ","ヤエヤマサソリ","タイワンザリガニモドキ","キチマダニ"],"correct":0,"explanation":"典型的なクモ類の特徴。","note":""},{"id":"2025-6","year":2025,"num":"6","q":"生物五界説に従う場合、ネンジュモが属する界をひとつ選びなさい。","opts":["モネラ界","原生生物界","菌界","植物界"],"correct":0,"explanation":"ネンジュモはシアノバクテリアで、五界説ではモネラ界。","note":"現行の三ドメイン分類では細菌ドメイン。"},{"id":"2025-7","year":2025,"num":"7","q":"すべての種が水生である動物門をひとつ選びなさい。","opts":["環形動物門","刺胞動物門","線形動物門","扁形動物門"],"correct":1,"explanation":"刺胞動物にはクラゲ・イソギンチャク・サンゴ類などが含まれ、海水・淡水に生息する。","note":""},{"id":"2025-9","year":2025,"num":"9","q":"道管をもつ裸子植物の綱をひとつ選びなさい。","opts":["ソテツ綱","イチョウ綱","グネツム綱","マツ綱"],"correct":2,"explanation":"グネツム類には道管がある。ほかの裸子植物は主に仮導管。","note":""},{"id":"2025-10","year":2025,"num":"10","q":"花粉から精子がつくられる裸子植物の綱の組み合わせをひとつ選びなさい。","opts":["ソテツ綱－イチョウ綱","ソテツ綱－グネツム綱","イチョウ綱－マツ綱","グネツム綱－マツ綱"],"correct":0,"explanation":"ソテツとイチョウでは鞭毛をもつ運動性の精子が形成される。","note":""},{"id":"2025-11","year":2025,"num":"11","q":"次のうち、極相に現れる種をひとつ選びなさい。","opts":["アカマツ","ダケカンバ","スダジイ","クズ"],"correct":2,"explanation":"スダジイは照葉樹林の極相構成樹種。","note":""},{"id":"2025-14","year":2025,"num":"14","q":"有孔虫が地球上に出現した時期をひとつ選びなさい。","opts":["原生代","古生代","中生代","新生代"],"correct":1,"explanation":"有孔虫は古生代から知られる。","note":""},{"id":"2025-19","year":2025,"num":"19","q":"生物五界説の提唱者と賛同者の組み合わせをひとつ選びなさい。","opts":["ホイタッカー－マルグリス","ダーウィン－ウォーレス","ワトソン－クリック","メンデル－ド・フリース"],"correct":0,"explanation":"ホイタッカーが五界説を提案し、マーグリスらが発展させた。","note":""}];let n=10,bank=[],at=0,ans={},wrongThis=[];const $=s=>document.getElementById(s),key="common_exam_wrong_v1",mistakes=()=>{try{return JSON.parse(localStorage.getItem(key)||"[]")}catch{return[]}},store=a=>localStorage.setItem(key,JSON.stringify([...new Set(a)])),mix=a=>a.map(v=>[Math.random(),v]).sort((x,y)=>x[0]-y[0]).map(x=>x[1]),show=s=>["settings","quiz","end"].forEach(x=>$(x).classList.toggle("hidden",x!==s));const years=[...new Set(DATA.map(x=>x.year))].sort((a,b)=>b-a);years.forEach(y=>{let o=document.createElement("option");o.value=y;o.textContent=y+"年度";$("year").append(o)});function counts(){$("count").textContent="登録済み："+DATA.length+"問（全14年分のうち一部）";$("saved").textContent="間違い履歴："+mistakes().length+"問";$("wrong").disabled=!mistakes().length}counts();$("nopts").querySelectorAll("button").forEach(b=>b.onclick=()=>{$("nopts").querySelectorAll("button").forEach(x=>x.classList.toggle("active",x===b));n=b.dataset.n==="all"?"all":Number(b.dataset.n)});function begin(w=null){let p=DATA.filter(x=>$("year").value==="all"||x.year===$("year").value);if(w!==null)p=p.filter(x=>w.includes(x.id));bank=mix(p).slice(0,w!==null||n==="all"?p.length:n);if(!bank.length){alert("該当する問題はありません");return}at=0;ans={};wrongThis=[];show("quiz");render()}function render(){let x=bank[at],v=ans[x.id];$("progress").textContent=(at+1)+" / "+bank.length+"　"+x.year+"年度　問"+x.num;$("question").textContent=x.q;$("options").replaceChildren();x.opts.forEach((s,i)=>{let b=document.createElement("button");b.className="opt";b.textContent=(i+1)+". "+s;if(v!==undefined){b.disabled=true;if(i===x.correct)b.classList.add("good");else if(i===v)b.classList.add("bad")}else b.onclick=()=>answer(i);$("options").append(b)});$("explain").textContent=v===undefined?"":(v===x.correct?"○ 正解":"× 不正解　正答："+(x.correct+1))+"\n"+x.explanation+(x.note?"\n【補足】"+x.note:"");$("prev").disabled=at===0;$("next").disabled=v===undefined;$("next").textContent=at===bank.length-1?"結果を見る":"次の問題"}function answer(i){let x=bank[at];if(ans[x.id]!==undefined)return;ans[x.id]=i;let h=mistakes().filter(j=>j!==x.id);if(i!==x.correct){h.push(x.id);wrongThis.push(x.id)}store(h);render()}$("start").onclick=()=>begin();$("wrong").onclick=()=>begin(mistakes());$("clear").onclick=()=>{if(confirm("間違い履歴を削除しますか？")){store([]);counts()}};$("home").onclick=()=>{show("settings");counts()};$("prev").onclick=()=>{if(at>0){at--;render()}};$("next").onclick=()=>{if(ans[bank[at].id]===undefined)return;if(at===bank.length-1){$("score").textContent=bank.filter(x=>ans[x.id]===x.correct).length+" / "+bank.length+"問";$("retry").disabled=wrongThis.length===0;show("end");counts()}else{at++;render()}};$("retry").onclick=()=>begin(wrongThis);$("rehome").onclick=()=>{show("settings");counts()};</script></html>

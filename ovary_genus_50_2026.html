<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#355c3a"><title>属から判定・子房上位下位 50問</title><style>*{box-sizing:border-box}body{margin:0;background:#f4f7f1;color:#203125;font-family:system-ui,-apple-system,"Noto Sans JP",sans-serif}main{max-width:600px;margin:auto;padding:18px 16px 40px}h1{font-size:24px;margin:8px 0}p{line-height:1.6}.muted{color:#607263;font-size:14px}.panel{background:white;border:1px solid #d8e5d7;border-radius:18px;padding:18px;margin:15px 0;box-shadow:0 3px 12px #2139210b}button,select{font:inherit;border-radius:12px;padding:13px;border:1px solid #bfd2bf;background:white;color:#21412b}button{cursor:pointer}button:disabled{opacity:.4}.primary{background:#355f40;color:white;border-color:#355f40;font-weight:750}.wide{width:100%;margin:7px 0}.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}.grid button{width:100%}.top{display:flex;justify-content:space-between;align-items:center;gap:8px}.top button{font-size:13px;padding:9px}.q{font-size:21px;font-weight:750;line-height:1.5;margin:13px 0 20px}.option{display:block;text-align:left;width:100%;margin:9px 0;line-height:1.45}.chosen{border:2px solid #355f40;background:#e5f1e5}.answer{background:#edf4e9;border-radius:12px;padding:13px;margin-top:13px;line-height:1.7}.hidden{display:none}.pill{display:inline-block;border-radius:40px;background:#e1ebe0;padding:6px 11px;font-size:12px}a{color:#376442}#bottom{margin-top:7px}label{display:block;margin:14px 0}.bar{height:7px;border-radius:6px;background:#dce7d9;overflow:hidden;margin:12px 0}.bar>div{height:100%;background:#45764c;transition:width .2s}</style></head><body><main><div class="top"><a href="./index.html">‹ 学習ホームへ</a><span class="pill">生物分類技能検定2級</span></div><h1>🌸 属から判定・子房の位置</h1><p class="muted">50属の識別／学名・所属科・代表植物の解説　全50問</p><section id="settings" class="panel"><strong>出題設定</strong><label>出題範囲<br><select id="size"><option value="10">10問</option><option value="20">20問</option><option value="all">全50問</option></select></label><label><input id="miss" type="checkbox"> 前回までに間違えた問題だけ</label><label><input id="random" type="checkbox" checked> 出題順をシャッフル</label><button class="primary wide" id="start">学習スタート</button><p class="muted">一問ずつ正誤判定。途中で「一問戻る」も使えます。間違い履歴はこのブラウザに保存。</p></section><section id="study" class="panel hidden"><div class="top"><span id="progress" class="muted"></span><button id="home">設定へ戻る</button></div><div class="bar"><div id="fill"></div></div><div class="q" id="question"></div><div id="options"></div><div class="answer hidden" id="feedback"></div><div id="bottom" class="grid"><button id="prev">← 一問戻る</button><button class="primary" id="next" disabled>次の問題 →</button></div></section><section id="done" class="panel hidden"><h2>学習結果</h2><p id="summary"></p><button class="primary wide" id="again">設定へ戻る</button></section></main><script>
const DATA=[{"q":"アブラナ属（Brassica）の子房は？","a":"上位","exp":"アブラナ科。代表例：アブラナ・キャベツ。子房上位。"},{"q":"ダイコン属（Raphanus）の子房は？","a":"上位","exp":"アブラナ科。代表例：ダイコン。子房上位。"},{"q":"ナズナ属（Capsella）の子房は？","a":"上位","exp":"アブラナ科。代表例：ナズナ。子房上位。"},{"q":"エンドウ属（Pisum）の子房は？","a":"上位","exp":"マメ科。代表例：エンドウ。子房上位。"},{"q":"ソラマメ属（Vicia）の子房は？","a":"上位","exp":"マメ科。代表例：ソラマメ。子房上位。"},{"q":"フジ属（Wisteria）の子房は？","a":"上位","exp":"マメ科。代表例：フジ。子房上位。"},{"q":"ナス属（Solanum）の子房は？","a":"上位","exp":"ナス科。代表例：ナス・ジャガイモ。子房上位。"},{"q":"トウガラシ属（Capsicum）の子房は？","a":"上位","exp":"ナス科。代表例：トウガラシ。子房上位。"},{"q":"シソ属（Perilla）の子房は？","a":"上位","exp":"シソ科。代表例：シソ。子房上位。"},{"q":"サルビア属（Salvia）の子房は？","a":"上位","exp":"シソ科。代表例：アキギリ類。子房上位。"},{"q":"キンポウゲ属（Ranunculus）の子房は？","a":"上位","exp":"キンポウゲ科。代表例：キンポウゲ。子房上位。"},{"q":"オダマキ属（Aquilegia）の子房は？","a":"上位","exp":"キンポウゲ科。代表例：オダマキ。子房上位。"},{"q":"ユリ属（Lilium）の子房は？","a":"上位","exp":"ユリ科。代表例：ヤマユリ。子房上位。"},{"q":"カタクリ属（Erythronium）の子房は？","a":"上位","exp":"ユリ科。代表例：カタクリ。子房上位。"},{"q":"ツツジ属（Rhododendron）の子房は？","a":"上位","exp":"ツツジ科。代表例：ツツジ・シャクナゲ。子房上位。"},{"q":"アセビ属（Pieris）の子房は？","a":"上位","exp":"ツツジ科。代表例：アセビ。子房上位。"},{"q":"サクラ属（Prunus）の子房は？","a":"上位","exp":"バラ科。代表例：サクラ・ウメ・モモ（広義のサクラ属）。子房上位。"},{"q":"バラ属（Rosa）の子房は？","a":"上位","exp":"バラ科。代表例：バラ。子房上位。"},{"q":"イチゴ属（Fragaria）の子房は？","a":"上位","exp":"バラ科。代表例：イチゴ。子房上位。"},{"q":"キジムシロ属（Potentilla）の子房は？","a":"上位","exp":"バラ科。代表例：キジムシロ。子房上位。"},{"q":"ネギ属（Allium）の子房は？","a":"上位","exp":"ヒガンバナ科。代表例：ネギ・ニラ。子房上位。"},{"q":"ムラサキツユクサ属（Tradescantia）の子房は？","a":"上位","exp":"ツユクサ科。代表例：ムラサキツユクサ。子房上位。"},{"q":"ツユクサ属（Commelina）の子房は？","a":"上位","exp":"ツユクサ科。代表例：ツユクサ。子房上位。"},{"q":"アサガオ属（Ipomoea）の子房は？","a":"上位","exp":"ヒルガオ科。代表例：アサガオ。子房上位。"},{"q":"スミレ属（Viola）の子房は？","a":"上位","exp":"スミレ科。代表例：スミレ。子房上位。"},{"q":"タンポポ属（Taraxacum）の子房は？","a":"下位","exp":"キク科。代表例：タンポポ。子房下位。"},{"q":"ヨモギ属（Artemisia）の子房は？","a":"下位","exp":"キク科。代表例：ヨモギ。子房下位。"},{"q":"ヒマワリ属（Helianthus）の子房は？","a":"下位","exp":"キク科。代表例：ヒマワリ。子房下位。"},{"q":"キュウリ属（Cucumis）の子房は？","a":"下位","exp":"ウリ科。代表例：キュウリ・メロン。子房下位。"},{"q":"カボチャ属（Cucurbita）の子房は？","a":"下位","exp":"ウリ科。代表例：カボチャ。子房下位。"},{"q":"スイカ属（Citrullus）の子房は？","a":"下位","exp":"ウリ科。代表例：スイカ。子房下位。"},{"q":"シュンラン属（Cymbidium）の子房は？","a":"下位","exp":"ラン科。代表例：シュンラン。子房下位。"},{"q":"ネジバナ属（Spiranthes）の子房は？","a":"下位","exp":"ラン科。代表例：ネジバナ。子房下位。"},{"q":"セッコク属（Dendrobium）の子房は？","a":"下位","exp":"ラン科。代表例：セッコク。子房下位。"},{"q":"マツヨイグサ属（Oenothera）の子房は？","a":"下位","exp":"アカバナ科。代表例：マツヨイグサ。子房下位。"},{"q":"アカバナ属（Epilobium）の子房は？","a":"下位","exp":"アカバナ科。代表例：アカバナ。子房下位。"},{"q":"ニンジン属（Daucus）の子房は？","a":"下位","exp":"セリ科。代表例：ニンジン。子房下位。"},{"q":"セリ属（Oenanthe）の子房は？","a":"下位","exp":"セリ科。代表例：セリ。子房下位。"},{"q":"キキョウ属（Platycodon）の子房は？","a":"下位","exp":"キキョウ科。代表例：キキョウ。子房下位。"},{"q":"ホタルブクロ属（Campanula）の子房は？","a":"下位","exp":"キキョウ科。代表例：ホタルブクロ。子房下位。"},{"q":"アカネ属（Rubia）の子房は？","a":"下位","exp":"アカネ科。代表例：アカネ。子房下位。"},{"q":"ヤエムグラ属（Galium）の子房は？","a":"下位","exp":"アカネ科。代表例：ヤエムグラ。子房下位。"},{"q":"クチナシ属（Gardenia）の子房は？","a":"下位","exp":"アカネ科。代表例：クチナシ。子房下位。"},{"q":"スイカズラ属（Lonicera）の子房は？","a":"下位","exp":"スイカズラ科。代表例：スイカズラ。子房下位。"},{"q":"アジサイ属（Hydrangea）の子房は？","a":"下位","exp":"アジサイ科。代表例：アジサイ。子房下位。"},{"q":"アヤメ属（Iris）の子房は？","a":"下位","exp":"アヤメ科。代表例：アヤメ・カキツバタ。子房下位。"},{"q":"ヒガンバナ属（Lycoris）の子房は？","a":"下位","exp":"ヒガンバナ科。代表例：ヒガンバナ。子房下位。"},{"q":"スイセン属（Narcissus）の子房は？","a":"下位","exp":"ヒガンバナ科。代表例：スイセン。子房下位。"},{"q":"リンゴ属（Malus）の子房は？","a":"下位","exp":"バラ科。代表例：リンゴ。子房下位。"},{"q":"ナシ属（Pyrus）の子房は？","a":"下位","exp":"バラ科。代表例：ナシ。子房下位。"}];
const KEY="ovary_genus_missed_v1";
let missed=new Set();try{missed=new Set(JSON.parse(localStorage.getItem(KEY)||"[]"))}catch(e){}
let order=[],index=0,selected={};
const $=id=>document.getElementById(id);
function save(){try{localStorage.setItem(KEY,JSON.stringify([...missed]))}catch(e){}}
function shuffle(a){for(let i=a.length-1;i>0;i--){let j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
function opts(q){return ["上位","下位"].slice()}
function start(){DATA.forEach(q=>delete q._choices);let arr=DATA.map((_,i)=>i);if($("miss").checked)arr=arr.filter(i=>missed.has(i));if(!arr.length){alert("復習対象の間違い問題はまだありません");return}if($("random").checked)shuffle(arr);order=arr.slice(0,$("size").value==="all"?arr.length:Number($("size").value));index=0;selected={};$("settings").classList.add("hidden");$("done").classList.add("hidden");$("study").classList.remove("hidden");render()}
function render(){
  if(index>=order.length){finish();return}
  const id=order[index],q=DATA[id],v=selected[id];
  $("progress").textContent=(index+1)+" / "+order.length;
  $("fill").style.width=(index/order.length*100)+"%";
  $("question").textContent=q.q;
  const container=$("options");
  container.replaceChildren();
  if(!q._choices)q._choices=shuffle(opts(q));
  const choices=q._choices;
  for(const a of choices){
    const b=document.createElement("button");
    b.type="button";
    b.className="option"+(v&&v.a===a?" chosen":"");
    b.textContent=a;
    b.disabled=Boolean(v);
    b.addEventListener("click",()=>choose(id,a,choices));
    container.appendChild(b);
  }
  $("feedback").classList.toggle("hidden",!v);
  if(v)$("feedback").textContent=(v.a===q.a?"✓ 正解":"× 不正解")+"｜正答："+q.a+"。 "+q.exp;
  $("next").disabled=!v;
  $("prev").disabled=index===0;
  $("next").textContent=index===order.length-1?"結果を見る →":"次の問題 →";
}
function choose(id,a,choices){selected[id]={a,choices};if(a===DATA[id].a)missed.delete(id);else missed.add(id);save();render()}
function finish(){$("study").classList.add("hidden");$("done").classList.remove("hidden");let correct=order.filter(i=>selected[i]?.a===DATA[i].a).length;$("summary").textContent=order.length+"問中 "+correct+"問正解。間違い履歴は保存しました。"}
function reset(){$("study").classList.add("hidden");$("done").classList.add("hidden");$("settings").classList.remove("hidden")}
$("start").onclick=start;$("home").onclick=reset;$("again").onclick=reset;$("prev").onclick=()=>{if(index>0){index--;render()}};$("next").onclick=()=>{if(selected[order[index]]){index++;render()}};
</script></body></html>

<!doctype html><html lang="ja"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>専門問題 過去問学習・先行版</title><style>*{box-sizing:border-box}body{margin:0;background:#f3f6f9;color:#263140;font-family:system-ui,"Noto Sans JP",sans-serif}main{max-width:680px;margin:auto;padding:16px}h1{font-size:23px;margin:12px 0}a{color:#1164ad}.panel{padding:17px;background:white;border:1px solid #d9e1e8;border-radius:15px;margin:12px 0}button,select{font:inherit;padding:11px;border:1px solid #c7d4df;background:white;border-radius:10px;color:#24344b}.primary,.active{background:#1765b4;border-color:#1765b4;color:white}.row{display:flex;gap:8px}.row button{flex:1}.opt{display:block;width:100%;text-align:left;margin:8px 0}.good{border:2px solid #168350;background:#e8faf0}.bad{border:2px solid #b83335;background:#fff0f0}.small{font-size:13px;color:#617188}.q{font-size:19px;font-weight:700;line-height:1.7;margin:18px 0}.hidden{display:none}.full{width:100%;margin:7px 0}label{display:block;font-weight:600;margin:15px 0 7px}.foot{margin-top:16px;display:grid;grid-template-columns:1fr 1fr;gap:10px}.desc{line-height:1.7;white-space:pre-wrap}.pills{display:flex;gap:7px;flex-wrap:wrap}</style><main><a href="./index.html">← 学習ホーム</a><h1>📘 専門問題・過去問学習</h1><p class="small">2012〜2023年度を段階的に登録中。写真・検索表・記述式の一部は学習用に改題します。改題は実際の過去問原文ではありません。2024・2025年度は一切収録していません。保存資料の22例から出典を確認できる設問を先行収録しました。公式解答との完全照合は未完了です。</p><section class="panel" id="settings"><b id="count"></b><label>問題数</label><div class="row" id="nopts"><button class="active" data-n="10">10問</button><button data-n="20">20問</button><button data-n="all">全問</button></div><label>年度</label><select id="year" class="full"><option value="all">登録済み年度から混合</option></select><p class="small" id="saved"></p><button id="start" class="primary full">スタート</button><button id="wrong" class="full">間違えた問題だけ復習</button><button id="clear" class="full">間違い履歴を消す</button></section><section class="panel hidden" id="quiz"><div class="row" style="justify-content:space-between;align-items:center"><span id="progress" class="small"></span><button id="home" style="font-size:12px">設定へ戻る</button></div><div class="q" id="question"></div><div id="options"></div><div id="explain" class="desc"></div><div class="foot"><button id="prev">一問戻る</button><button id="next" class="primary">次の問題</button></div></section><section class="panel hidden" id="end"><h2>学習結果</h2><h1 id="score"></h1><button id="retry" class="primary full">今回の間違いを復習</button><button id="rehome" class="full">設定へ戻る</button></section><p class="small">過去問から転記した原文を基本にしています。一部の旧分類には現行知識の注記があります。問題番号・出典年度を表示します。</p></main><script>const DATA=[{"id":"sp-2012-Ⅱ-6A","year":2012,"num":"Ⅱ-6A","q":"モモやアンズの俗に「たね」と呼ばれるものは植物形態学的には何か、ひとつ選びなさい。","opts":["核","果実","種子","種皮"],"correct":0,"explanation":"モモなどの硬い「種」は内果皮が硬化した核。核の中に真正の種子がある。","kind":"原題","note":""},{"id":"sp-2012-Ⅱ-11A","year":2012,"num":"Ⅱ-11A","q":"花冠が合弁、左右対称で唇形花冠をつくり、子房は4個に分かれる。葉は十字対生、茎の断面は四角形。該当する科を選びなさい。","opts":["アカネ科","キツネノマゴ科","ゴマノハグサ科","シソ科"],"correct":3,"explanation":"対生葉、四角い茎、唇形花冠、4分果はシソ科の典型的形質。","kind":"原題","note":""},{"id":"sp-2012-Ⅱ-1","year":2012,"num":"Ⅱ-1","q":"新しい分類体系（2009年提唱）で、名称がなくなっている科をひとつ選びなさい。","opts":["カエデ科","ヒユ科","ユキノシタ科","ユリ科"],"correct":0,"explanation":"従来のカエデ科はAPG体系ではムクロジ科に統合される。","kind":"原題","note":"出題当時の2009年APG IIIに基づく。"},{"id":"sp-2012-Ⅱ-13","year":2012,"num":"Ⅱ-13","q":"サクラ属に用いられる学名をひとつ選びなさい。","opts":["Amygdalus","Cerasus","Malus","Pyrus"],"correct":1,"explanation":"Cerasus は狭義のサクラ属として用いられる名称。Prunus に含める広義の分類もある。","kind":"原題","note":"分類体系によって属の扱いが異なる。"},{"id":"sp-2013-Ⅱ-16","year":2013,"num":"Ⅱ-16","q":"ヤエドクダミの花序で、弁化している器官をひとつ選びなさい。","opts":["がく（萼）片","雌ずい（めしべ）","ほう（苞）葉","雄ずい（おしべ）"],"correct":2,"explanation":"ドクダミの白色部分は花弁ではなく総苞片であり、八重咲き状のものでは苞の発達が目立つ。","kind":"原題","note":""},{"id":"sp-2013-Ⅱ-8A","year":2013,"num":"Ⅱ-8A","q":"高木で、単葉で対生する葉と翼果をもつ。該当する日本の野生植物を選びなさい。","opts":["アズキナシ","アマチャ","チドリノキ","ヤブデマリ"],"correct":2,"explanation":"チドリノキはカエデ属であり、対生の葉と対になった翼果をもつ。","kind":"原題","note":""},{"id":"sp-2013-Ⅱ-27","year":2013,"num":"Ⅱ-27","q":"標本ラベルを作成する上で、欠かせない情報の組み合わせをひとつ選びなさい。","opts":["採集地、緯度経度、採集者","採集地、採集者、採集日","種名、採集地、採集日","種名、標本番号、同定者"],"correct":1,"explanation":"標本の再検証可能性のため、採集場所・採集者・採集年月日は基礎情報となる。","kind":"原題","note":""},{"id":"sp-2014-Ⅱ-26","year":2014,"num":"Ⅱ-26","q":"ハンゲショウ属は東アジアとどの地域に隔離分布するか、ひとつ選びなさい。","opts":["アフリカ東部","オーストラリア西部","北アメリカ東部","南アメリカ西部"],"correct":2,"explanation":"ハンゲショウ属は東アジアと北アメリカ東部に隔離分布する。","kind":"原題","note":""},{"id":"sp-2016-Ⅱ-9A","year":2016,"num":"Ⅱ-9A","q":"オオイヌノフグリがAPG III分類体系（2009）で属する科をひとつ選びなさい。","opts":["オオバコ科","オミナエシ科","ゴマノハグサ科","シソ科"],"correct":0,"explanation":"オオイヌノフグリはAPG体系ではオオバコ科。旧分類ではゴマノハグサ科とされた。","kind":"原題","note":""},{"id":"sp-2017-Ⅱ-35","year":2017,"num":"Ⅱ-35","q":"性染色体をもつ種をひとつ選びなさい。","opts":["イチョウ","クロモジ","スイバ","ソテツ"],"correct":2,"explanation":"スイバは性染色体による雌雄決定の代表例。","kind":"原題","note":"現在は他の選択肢についても性決定機構の研究が進んでいるため、厳密には出題当時の設問。"},{"id":"sp-2018-Ⅱ-2","year":2018,"num":"Ⅱ-2","q":"ナンジャモンジャゴケが属する分類群をひとつ選びなさい。","opts":["セン類","タイ類","ツノゴケ類","ヒカゲノカズラ類"],"correct":1,"explanation":"ナンジャモンジャゴケは特殊な形態をもつ苔類（タイ類）。","kind":"原題","note":""},{"id":"sp-2022-問38","year":2022,"num":"問38","q":"水中で開花し、受粉する種をひとつ選びなさい。","opts":["ミズオオバコ","トチカガミ","イバラモ","スブタ"],"correct":2,"explanation":"イバラモは水中で受粉する水媒花をもつ。","kind":"原題","note":""},{"id":"sp-2016-Ⅱ-23A","year":2016,"num":"Ⅱ-23A","q":"【検索表からの改題】ブナ科で、雄花が少数集まった頭状花序をつけ、子葉が地上に出る属を選びなさい。","opts":["Castanopsis","Fagus","Lithocarpus","Quercus"],"correct":1,"explanation":"Fagus（ブナ属）は他のドングリ類と異なる検索上の特徴を示す。","kind":"改題","note":"元問題Ⅱ-23の分岐A"},{"id":"sp-2016-Ⅱ-23C","year":2016,"num":"Ⅱ-23C","q":"【検索表からの改題】常緑高木で、殻斗が堅果全体を包み、熟すと裂けるブナ科の属を選びなさい。","opts":["Castanopsis","Fagus","Lithocarpus","Quercus"],"correct":0,"explanation":"Castanopsis（シイ属）の殻斗は堅果全体を包み、熟すと裂ける。","kind":"改題","note":"元問題Ⅱ-23の分岐C"},{"id":"sp-2016-Ⅱ-23D","year":2016,"num":"Ⅱ-23D","q":"【検索表からの改題】ブナ科で、殻斗が皿状・椀状で、堅果上部が露出する属を選びなさい。","opts":["Castanopsis","Fagus","Lithocarpus","Quercus"],"correct":2,"explanation":"Lithocarpus（マテバシイ属）は杯状の殻斗と露出する堅果をもつ。","kind":"改題","note":"元問題Ⅱ-23の分岐D"},{"id":"sp-2022-問55-1","year":2022,"num":"問55-1","q":"【検索表からの改題】ハコベ類で、花柱がふつう5個ある植物を選びなさい。","opts":["ウシハコベ","コハコベ","ノミノフスマ","ミドリハコベ"],"correct":0,"explanation":"ウシハコベは花柱が5個である点が識別形質となる。","kind":"改題","note":"元問題問55の分岐A"},{"id":"sp-2022-問55-2","year":2022,"num":"問55-2","q":"【検索表からの改題】ハコベ類で、花柱は3個、茎は無毛、葉には柄がない種を選びなさい。","opts":["ウシハコベ","コハコベ","ノミノフスマ","ミドリハコベ"],"correct":2,"explanation":"ノミノフスマは茎が無毛で葉が無柄。","kind":"改題","note":"元問題問55の分岐B"},{"id":"sp-2022-問55-3","year":2022,"num":"問55-3","q":"【検索表からの改題】茎に1列の毛があり、茎が紫色を帯びることが多く、種子の突起が低い半球状のハコベ類を選びなさい。","opts":["ウシハコベ","コハコベ","ノミノフスマ","ミドリハコベ"],"correct":1,"explanation":"コハコベはミドリハコベに比べ茎が紫色を帯びやすく、種子の突起が低い。","kind":"改題","note":"元問題問55の分岐C"},{"id":"sp-2022-問55-4","year":2022,"num":"問55-4","q":"【検索表からの改題】茎に1列の毛があり、通常緑色で、種子に長い円錐状突起があるハコベ類を選びなさい。","opts":["ウシハコベ","コハコベ","ノミノフスマ","ミドリハコベ"],"correct":3,"explanation":"ミドリハコベは種子表面の突起が比較的高い。","kind":"改題","note":"元問題問55の分岐D"}];let n=10,bank=[],at=0,ans={},wrongThis=[];const $=s=>document.getElementById(s),key="specialist_exam_wrong_v1",mistakes=()=>{try{return JSON.parse(localStorage.getItem(key)||"[]")}catch{return[]}},store=a=>localStorage.setItem(key,JSON.stringify([...new Set(a)])),mix=a=>a.map(v=>[Math.random(),v]).sort((x,y)=>x[0]-y[0]).map(x=>x[1]),show=s=>["settings","quiz","end"].forEach(x=>$(x).classList.toggle("hidden",x!==s));const years=[...new Set(DATA.map(x=>x.year))].sort((a,b)=>b-a);years.forEach(y=>{let o=document.createElement("option");o.value=y;o.textContent=y+"年度";$("year").append(o)});function counts(){$("count").textContent="登録済み："+DATA.length+"問（原題"+DATA.filter(x=>x.kind==="原題").length+"・改題"+DATA.filter(x=>x.kind!=="原題").length+"）";$("saved").textContent="間違い履歴："+mistakes().length+"問";$("wrong").disabled=!mistakes().length}counts();$("nopts").querySelectorAll("button").forEach(b=>b.onclick=()=>{$("nopts").querySelectorAll("button").forEach(x=>x.classList.toggle("active",x===b));n=b.dataset.n==="all"?"all":Number(b.dataset.n)});function begin(w=null){let p=DATA.filter(x=>$("year").value==="all"||String(x.year)===$("year").value);if(w!==null)p=p.filter(x=>w.includes(x.id));bank=mix(p).slice(0,w!==null||n==="all"?p.length:n);if(!bank.length){alert("該当する問題はありません");return}at=0;ans={};wrongThis=[];show("quiz");render()}function render(){let x=bank[at],v=ans[x.id];$("progress").textContent=(at+1)+" / "+bank.length+"　"+x.year+"年度　"+x.num+"　【"+x.kind+"】";$("question").textContent=x.q;$("options").replaceChildren();x.opts.forEach((s,i)=>{let b=document.createElement("button");b.className="opt";b.textContent=(i+1)+". "+s;if(v!==undefined){b.disabled=true;if(i===x.correct)b.classList.add("good");else if(i===v)b.classList.add("bad")}else b.onclick=()=>answer(i);$("options").append(b)});$("explain").textContent=v===undefined?"":(v===x.correct?"○ 正解":"× 不正解　正答："+(x.correct+1))+"\n"+x.explanation+(x.note?"\n【補足】"+x.note:"");$("prev").disabled=at===0;$("next").disabled=v===undefined;$("next").textContent=at===bank.length-1?"結果を見る":"次の問題"}function answer(i){let x=bank[at];if(ans[x.id]!==undefined)return;ans[x.id]=i;let h=mistakes().filter(j=>j!==x.id);if(i!==x.correct){h.push(x.id);wrongThis.push(x.id)}store(h);render()}$("start").onclick=()=>begin();$("wrong").onclick=()=>begin(mistakes());$("clear").onclick=()=>{if(confirm("間違い履歴を削除しますか？")){store([]);counts()}};$("home").onclick=()=>{show("settings");counts()};$("prev").onclick=()=>{if(at>0){at--;render()}};$("next").onclick=()=>{if(ans[bank[at].id]===undefined)return;if(at===bank.length-1){$("score").textContent=bank.filter(x=>ans[x.id]===x.correct).length+" / "+bank.length+"問";$("retry").disabled=wrongThis.length===0;show("end");counts()}else{at++;render()}};$("retry").onclick=()=>begin(wrongThis);$("rehome").onclick=()=>{show("settings");counts()};</script></html>

<!doctype html><html lang="ja"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>専門問題 過去問学習・先行版</title><style>*{box-sizing:border-box}body{margin:0;background:#f3f6f9;color:#263140;font-family:system-ui,"Noto Sans JP",sans-serif}main{max-width:680px;margin:auto;padding:16px}h1{font-size:23px;margin:12px 0}a{color:#1164ad}.panel{padding:17px;background:white;border:1px solid #d9e1e8;border-radius:15px;margin:12px 0}button,select{font:inherit;padding:11px;border:1px solid #c7d4df;background:white;border-radius:10px;color:#24344b}.primary,.active{background:#1765b4;border-color:#1765b4;color:white}.row{display:flex;gap:8px}.row button{flex:1}.opt{display:block;width:100%;text-align:left;margin:8px 0}.good{border:2px solid #168350;background:#e8faf0}.bad{border:2px solid #b83335;background:#fff0f0}.small{font-size:13px;color:#617188}.q{font-size:19px;font-weight:700;line-height:1.7;margin:18px 0}.hidden{display:none}.full{width:100%;margin:7px 0}label{display:block;font-weight:600;margin:15px 0 7px}.foot{margin-top:16px;display:grid;grid-template-columns:1fr 1fr;gap:10px}.desc{line-height:1.7;white-space:pre-wrap}.pills{display:flex;gap:7px;flex-wrap:wrap}</style><main><a href="./index.html">← 学習ホーム</a><h1>📘 専門問題・過去問学習</h1><p class="small">対象は2012〜2023年度の専門問題。2024・2025年度は直前チェック用に除外。現在は過去問例の資料で確認できる一部を先行登録中。検索表は一部改題し、公式解答との完全照合は未完了です。</p><section class="panel" id="settings"><b id="count"></b><label>問題数</label><div class="row" id="nopts"><button class="active" data-n="10">10問</button><button data-n="20">20問</button><button data-n="all">全問</button></div><label>年度</label><select id="year" class="full"><option value="all">登録済み年度から混合</option></select><p class="small" id="saved"></p><button id="start" class="primary full">スタート</button><button id="wrong" class="full">間違えた問題だけ復習</button><button id="clear" class="full">間違い履歴を消す</button></section><section class="panel hidden" id="quiz"><div class="row" style="justify-content:space-between;align-items:center"><span id="progress" class="small"></span><button id="home" style="font-size:12px">設定へ戻る</button></div><div class="q" id="question"></div><div id="options"></div><div id="explain" class="desc"></div><div class="foot"><button id="prev">一問戻る</button><button id="next" class="primary">次の問題</button></div></section><section class="panel hidden" id="end"><h2>学習結果</h2><h1 id="score"></h1><button id="retry" class="primary full">今回の間違いを復習</button><button id="rehome" class="full">設定へ戻る</button></section><p class="small">選択肢付きの過去問例資料に収録された問題文を基本にしています。一部の旧分類には現行知識の注記があります。問題番号・出典年度を表示します。</p></main><script>const DATA=[{"id":"2012-Ⅱ-6A","year":2012,"num":"Ⅱ-6A","q":"モモやアンズの俗に「たね」と呼ばれるものは植物形態学的には何か、ひとつ選びなさい。","opts":["核","果実","種子","種皮"],"correct":0,"explanation":"モモやアンズの硬い『種』のように見える部分は、内果皮が硬化した核（stone）で、その内側に真の種子がある。","kind":"原題","note":""},{"id":"2012-Ⅱ-11A","year":2012,"num":"Ⅱ-11A","q":"花冠が合弁、左右対称で、上下に分かれて唇形花冠をつくり、子房は4個に分かれる。葉は十字対生。茎は切り口が四角形。該当する科を選びなさい。","opts":["アカネ科","キツネノマゴ科","ゴマノハグサ科","シソ科"],"correct":3,"explanation":"対生葉・四角い茎・唇形花・4分果などはシソ科の代表的な特徴。","kind":"原題","note":""},{"id":"2012-Ⅱ-1","year":2012,"num":"Ⅱ-1","q":"新しい分類体系（2009年提唱）で、名称がなくなっている科をひとつ選びなさい。","opts":["カエデ科","ヒユ科","ユキノシタ科","ユリ科"],"correct":0,"explanation":"従来のカエデ科はAPG体系ではムクロジ科に含まれる。","kind":"原題","note":"旧来の科名は現在の体系で統合されているため、出題時点の分類体系で解釈する。"},{"id":"2012-Ⅱ-13","year":2012,"num":"Ⅱ-13","q":"サクラ属に用いられる学名をひとつ選びなさい。","opts":["Amygdalus","Cerasus","Malus","Pyrus"],"correct":1,"explanation":"この設問ではサクラ属を Cerasus として扱う。","kind":"原題","note":"現在はサクラ類を広義の Prunus に含める分類も一般的。分類体系依存の設問。"},{"id":"2013-Ⅱ-8A","year":2013,"num":"Ⅱ-8A","q":"高木で、単葉で対生する葉と翼果をもつ。該当する日本の野生植物を選びなさい。","opts":["アズキナシ","アマチャ","チドリノキ","ヤブデマリ"],"correct":2,"explanation":"チドリノキはムクロジ科カエデ属で、対生葉と翼果が特徴。","kind":"原題","note":""},{"id":"2013-Ⅱ-27","year":2013,"num":"Ⅱ-27","q":"標本ラベルを作成する上で、欠かせない情報の組み合わせをひとつ選びなさい。","opts":["採集地、緯度経度、採集者","採集地、採集者、採集日","種名、採集地、採集日","種名、標本番号、同定者"],"correct":1,"explanation":"採集地・採集日・採集者は標本の基礎情報。種名は同定後に変更される可能性もある。","kind":"原題","note":""},{"id":"2014-Ⅱ-26","year":2014,"num":"Ⅱ-26","q":"ハンゲショウ属は隔離分布をすることが知られている。それは東アジアとどの地域か、ひとつ選びなさい。","opts":["アフリカ東部","オーストラリア西部","北アメリカ東部","南アメリカ西部"],"correct":2,"explanation":"ハンゲショウ属は東アジアと北米東部の隔離分布を示し、東アジア－北米東部隔離分布の一例。","kind":"原題","note":""},{"id":"2016-Ⅱ-9A","year":2016,"num":"Ⅱ-9A","q":"オオイヌノフグリがAPGⅢ分類体系（2009）で属する科をひとつ選びなさい。","opts":["オオバコ科","オミナエシ科","ゴマノハグサ科","シソ科"],"correct":0,"explanation":"クワガタソウ属 Veronica はAPG分類体系でオオバコ科。従来のゴマノハグサ科から移された。","kind":"原題","note":""},{"id":"2016-Ⅱ-23-A","year":2016,"num":"Ⅱ-23-A","q":"ブナ科の検索表で『雄花は少数が頭状花序につく。子葉は種子の外にあり地上に出る』にあてはまる属を選びなさい。","opts":["Castanopsis","Fagus","Lithocarpus","Quercus"],"correct":1,"explanation":"ブナ属 Fagus では雄花が頭状に集まり、発芽時に子葉が地上に現れる。","kind":"改題","note":"2016年度Ⅱ-23検索表の枝問Aを単独四択化。"},{"id":"2016-Ⅱ-23-C","year":2016,"num":"Ⅱ-23-C","q":"ブナ科の検索表で『常緑高木。殻斗が堅果全体を包み、熟すと裂ける』にあてはまる属を選びなさい。","opts":["Castanopsis","Fagus","Lithocarpus","Quercus"],"correct":0,"explanation":"シイ属 Castanopsis の殻斗は堅果を包み、熟すると裂開する。","kind":"改題","note":"2016年度Ⅱ-23検索表の枝問Cを単独四択化。"},{"id":"2016-Ⅱ-23-D","year":2016,"num":"Ⅱ-23-D","q":"ブナ科の検索表で『殻斗は皿状・椀状で、堅果の上方が裸出する』にあてはまる属を選びなさい。","opts":["Castanopsis","Fagus","Lithocarpus","Quercus"],"correct":3,"explanation":"コナラ属 Quercus は一般に椀状などの殻斗をもち堅果の上部が露出する。","kind":"改題","note":"2016年度Ⅱ-23検索表の枝問Dを単独四択化。"},{"id":"2018-Ⅱ-2","year":2018,"num":"Ⅱ-2","q":"ナンジャモンジャゴケが属する分類群をひとつ選びなさい。","opts":["セン類","タイ類","ツノゴケ類","ヒカゲノカズラ類"],"correct":0,"explanation":"ナンジャモンジャゴケ（Takakia）はセン類に属する。","kind":"原題","note":""},{"id":"2022-問55-1","year":2022,"num":"問55-1","q":"ハコベ属の検索表で『花柱はふつう5個』にあてはまる種を選びなさい。","opts":["ウシハコベ","コハコベ","ノミノフスマ","ミドリハコベ"],"correct":0,"explanation":"ウシハコベは花柱が通常5個。他の3種は通常3個。","kind":"改題","note":"2022年度問55の検索表を単独四択化。"},{"id":"2022-問55-2","year":2022,"num":"問55-2","q":"ハコベ属の検索表で『花柱は3個、茎は無毛、葉は無柄』にあてはまる種を選びなさい。","opts":["ウシハコベ","コハコベ","ノミノフスマ","ミドリハコベ"],"correct":2,"explanation":"ノミノフスマは葉が無柄で茎がほぼ無毛。","kind":"改題","note":"2022年度問55の検索表を単独四択化。"},{"id":"2022-問55-3","year":2022,"num":"問55-3","q":"ハコベ属の検索表で『花柱は3個、茎は通常紫色、種子に低い半球形の突起がある』にあてはまる種を選びなさい。","opts":["ウシハコベ","コハコベ","ノミノフスマ","ミドリハコベ"],"correct":1,"explanation":"コハコベは茎の紫色味や種子突起の形が識別の手掛かりとなる。","kind":"改題","note":"2022年度問55の検索表を単独四択化。"},{"id":"2022-問55-4","year":2022,"num":"問55-4","q":"ハコベ属の検索表で『花柱は3個、茎は通常緑色、種子に長い円錐状の突起がある』にあてはまる種を選びなさい。","opts":["ウシハコベ","コハコベ","ノミノフスマ","ミドリハコベ"],"correct":3,"explanation":"ミドリハコベは緑色の茎や円錐状の種子突起などが特徴。","kind":"改題","note":"2022年度問55の検索表を単独四択化。"}];let n=10,bank=[],at=0,ans={},wrongThis=[];const $=s=>document.getElementById(s),key="common_exam_wrong_v1",mistakes=()=>{try{return JSON.parse(localStorage.getItem(key)||"[]")}catch{return[]}},store=a=>localStorage.setItem(key,JSON.stringify([...new Set(a)])),mix=a=>a.map(v=>[Math.random(),v]).sort((x,y)=>x[0]-y[0]).map(x=>x[1]),show=s=>["settings","quiz","end"].forEach(x=>$(x).classList.toggle("hidden",x!==s));const years=[...new Set(DATA.map(x=>x.year))].sort((a,b)=>b-a);years.forEach(y=>{let o=document.createElement("option");o.value=y;o.textContent=y+"年度";$("year").append(o)});function counts(){$("count").textContent="登録済み："+DATA.length+"問（原題"+DATA.filter(x=>x.kind==="原題").length+"・改題"+DATA.filter(x=>x.kind!=="原題").length+"）";$("saved").textContent="間違い履歴："+mistakes().length+"問";$("wrong").disabled=!mistakes().length}counts();$("nopts").querySelectorAll("button").forEach(b=>b.onclick=()=>{$("nopts").querySelectorAll("button").forEach(x=>x.classList.toggle("active",x===b));n=b.dataset.n==="all"?"all":Number(b.dataset.n)});function begin(w=null){let p=DATA.filter(x=>$("year").value==="all"||String(x.year)===$("year").value);if(w!==null)p=p.filter(x=>w.includes(x.id));bank=mix(p).slice(0,w!==null||n==="all"?p.length:n);if(!bank.length){alert("該当する問題はありません");return}at=0;ans={};wrongThis=[];show("quiz");render()}function render(){let x=bank[at],v=ans[x.id];$("progress").textContent=(at+1)+" / "+bank.length+"　"+x.year+"年度　"+x.num+"　【"+x.kind+"】";$("question").textContent=x.q;$("options").replaceChildren();x.opts.forEach((s,i)=>{let b=document.createElement("button");b.className="opt";b.textContent=(i+1)+". "+s;if(v!==undefined){b.disabled=true;if(i===x.correct)b.classList.add("good");else if(i===v)b.classList.add("bad")}else b.onclick=()=>answer(i);$("options").append(b)});$("explain").textContent=v===undefined?"":(v===x.correct?"○ 正解":"× 不正解　正答："+(x.correct+1))+"\n"+x.explanation+(x.note?"\n【補足】"+x.note:"");$("prev").disabled=at===0;$("next").disabled=v===undefined;$("next").textContent=at===bank.length-1?"結果を見る":"次の問題"}function answer(i){let x=bank[at];if(ans[x.id]!==undefined)return;ans[x.id]=i;let h=mistakes().filter(j=>j!==x.id);if(i!==x.correct){h.push(x.id);wrongThis.push(x.id)}store(h);render()}$("start").onclick=()=>begin();$("wrong").onclick=()=>begin(mistakes());$("clear").onclick=()=>{if(confirm("間違い履歴を削除しますか？")){store([]);counts()}};$("home").onclick=()=>{show("settings");counts()};$("prev").onclick=()=>{if(at>0){at--;render()}};$("next").onclick=()=>{if(ans[bank[at].id]===undefined)return;if(at===bank.length-1){$("score").textContent=bank.filter(x=>ans[x.id]===x.correct).length+" / "+bank.length+"問";$("retry").disabled=wrongThis.length===0;show("end");counts()}else{at++;render()}};$("retry").onclick=()=>begin(wrongThis);$("rehome").onclick=()=>{show("settings");counts()};</script></html>

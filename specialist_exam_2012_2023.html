<!doctype html><html lang="ja"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>専門問題 過去問学習・先行版</title><style>*{box-sizing:border-box}body{margin:0;background:#f3f6f9;color:#263140;font-family:system-ui,"Noto Sans JP",sans-serif}main{max-width:680px;margin:auto;padding:16px}h1{font-size:23px;margin:12px 0}a{color:#1164ad}.panel{padding:17px;background:white;border:1px solid #d9e1e8;border-radius:15px;margin:12px 0}button,select{font:inherit;padding:11px;border:1px solid #c7d4df;background:white;border-radius:10px;color:#24344b}.primary,.active{background:#1765b4;border-color:#1765b4;color:white}.row{display:flex;gap:8px}.row button{flex:1}.opt{display:block;width:100%;text-align:left;margin:8px 0}.good{border:2px solid #168350;background:#e8faf0}.bad{border:2px solid #b83335;background:#fff0f0}.small{font-size:13px;color:#617188}.q{font-size:19px;font-weight:700;line-height:1.7;margin:18px 0}.hidden{display:none}.full{width:100%;margin:7px 0}label{display:block;font-weight:600;margin:15px 0 7px}.foot{margin-top:16px;display:grid;grid-template-columns:1fr 1fr;gap:10px}.desc{line-height:1.7;white-space:pre-wrap}.pills{display:flex;gap:7px;flex-wrap:wrap}</style><main><a href="./index.html">← 学習ホーム</a><h1>📘 専門問題・過去問学習</h1><p class="small">2012〜2023年度を段階的に登録中。写真・検索表・記述式の一部は学習用に改題します。改題は実際の過去問原文ではありません。2024・2025年度は一切収録していません。保存資料の22例から出典を確認できる設問を先行収録しました。公式解答との完全照合は未完了です。</p><section class="panel" id="settings"><b id="count"></b><label>問題数</label><div class="row" id="nopts"><button class="active" data-n="10">10問</button><button data-n="20">20問</button><button data-n="all">全問</button></div><label>年度</label><select id="year" class="full"><option value="all">登録済み年度から混合</option></select><p class="small" id="saved"></p><button id="start" class="primary full">スタート</button><button id="wrong" class="full">間違えた問題だけ復習</button><button id="clear" class="full">間違い履歴を消す</button></section><section class="panel hidden" id="quiz"><div class="row" style="justify-content:space-between;align-items:center"><span id="progress" class="small"></span><button id="home" style="font-size:12px">設定へ戻る</button></div><div class="q" id="question"></div><div id="options"></div><div id="explain" class="desc"></div><div class="foot"><button id="prev">一問戻る</button><button id="next" class="primary">次の問題</button></div></section><section class="panel hidden" id="end"><h2>学習結果</h2><h1 id="score"></h1><button id="retry" class="primary full">今回の間違いを復習</button><button id="rehome" class="full">設定へ戻る</button></section><p class="small">過去問から転記した原文を基本にしています。一部の旧分類には現行知識の注記があります。問題番号・出典年度を表示します。</p></main><script>const DATA=[{"id":"sp-2012-Ⅱ-6A","year":2012,"num":"Ⅱ-6A","q":"モモやアンズの俗に「たね」と呼ばれるものは植物形態学的には何か、ひとつ選びなさい。","opts":["核","果実","種子","種皮"],"correct":0,"explanation":"モモなどの硬い「種」は内果皮が硬化した核。核の中に真正の種子がある。","kind":"原題","note":""},{"id":"sp-2012-Ⅱ-11A","year":2012,"num":"Ⅱ-11A","q":"花冠が合弁、左右対称で唇形花冠をつくり、子房は4個に分かれる。葉は十字対生、茎の断面は四角形。該当する科を選びなさい。","opts":["アカネ科","キツネノマゴ科","ゴマノハグサ科","シソ科"],"correct":3,"explanation":"対生葉、四角い茎、唇形花冠、4分果はシソ科の典型的形質。","kind":"原題","note":""},{"id":"sp-2012-Ⅱ-1","year":2012,"num":"Ⅱ-1","q":"新しい分類体系（2009年提唱）で、名称がなくなっている科をひとつ選びなさい。","opts":["カエデ科","ヒユ科","ユキノシタ科","ユリ科"],"correct":0,"explanation":"従来のカエデ科はAPG体系ではムクロジ科に統合される。","kind":"原題","note":"出題当時の2009年APG IIIに基づく。"},{"id":"sp-2012-Ⅱ-13","year":2012,"num":"Ⅱ-13","q":"サクラ属に用いられる学名をひとつ選びなさい。","opts":["Amygdalus","Cerasus","Malus","Pyrus"],"correct":1,"explanation":"Cerasus は狭義のサクラ属として用いられる名称。Prunus に含める広義の分類もある。","kind":"原題","note":"分類体系によって属の扱いが異なる。"},{"id":"sp-2013-Ⅱ-16","year":2013,"num":"Ⅱ-16","q":"ヤエドクダミの花序で、弁化している器官をひとつ選びなさい。","opts":["がく（萼）片","雌ずい（めしべ）","ほう（苞）葉","雄ずい（おしべ）"],"correct":2,"explanation":"ドクダミの白色部分は花弁ではなく総苞片であり、八重咲き状のものでは苞の発達が目立つ。","kind":"原題","note":""},{"id":"sp-2013-Ⅱ-8A","year":2013,"num":"Ⅱ-8A","q":"高木で、単葉で対生する葉と翼果をもつ。該当する日本の野生植物を選びなさい。","opts":["アズキナシ","アマチャ","チドリノキ","ヤブデマリ"],"correct":2,"explanation":"チドリノキはカエデ属であり、対生の葉と対になった翼果をもつ。","kind":"原題","note":""},{"id":"sp-2013-Ⅱ-27","year":2013,"num":"Ⅱ-27","q":"標本ラベルを作成する上で、欠かせない情報の組み合わせをひとつ選びなさい。","opts":["採集地、緯度経度、採集者","採集地、採集者、採集日","種名、採集地、採集日","種名、標本番号、同定者"],"correct":1,"explanation":"標本の再検証可能性のため、採集場所・採集者・採集年月日は基礎情報となる。","kind":"原題","note":""},{"id":"sp-2014-Ⅱ-26","year":2014,"num":"Ⅱ-26","q":"ハンゲショウ属は東アジアとどの地域に隔離分布するか、ひとつ選びなさい。","opts":["アフリカ東部","オーストラリア西部","北アメリカ東部","南アメリカ西部"],"correct":2,"explanation":"ハンゲショウ属は東アジアと北アメリカ東部に隔離分布する。","kind":"原題","note":""},{"id":"sp-2016-Ⅱ-9A","year":2016,"num":"Ⅱ-9A","q":"オオイヌノフグリがAPG III分類体系（2009）で属する科をひとつ選びなさい。","opts":["オオバコ科","オミナエシ科","ゴマノハグサ科","シソ科"],"correct":0,"explanation":"オオイヌノフグリはAPG体系ではオオバコ科。旧分類ではゴマノハグサ科とされた。","kind":"原題","note":""},{"id":"sp-2018-Ⅱ-2","year":2018,"num":"Ⅱ-2","q":"ナンジャモンジャゴケが属する分類群をひとつ選びなさい。","opts":["セン類","タイ類","ツノゴケ類","ヒカゲノカズラ類"],"correct":0,"explanation":"ナンジャモンジャゴケ（Takakia）は特殊な形態をもつセン類（蘚類）に分類される。","kind":"原題","note":""},{"id":"sp-2022-問38","year":2022,"num":"問38","q":"水中で開花し、受粉する種をひとつ選びなさい。","opts":["ミズオオバコ","トチカガミ","イバラモ","スブタ"],"correct":2,"explanation":"イバラモは水中で受粉する水媒花をもつ。","kind":"原題","note":""},{"id":"sp-2016-Ⅱ-23A","year":2016,"num":"Ⅱ-23A","q":"【検索表からの改題】ブナ科で、雄花が少数集まった頭状花序をつけ、子葉が地上に出る属を選びなさい。","opts":["Castanopsis","Fagus","Lithocarpus","Quercus"],"correct":1,"explanation":"Fagus（ブナ属）は他のドングリ類と異なる検索上の特徴を示す。","kind":"改題","note":"元問題Ⅱ-23の分岐A"},{"id":"sp-2016-Ⅱ-23C","year":2016,"num":"Ⅱ-23C","q":"【検索表からの改題】常緑高木で、殻斗が堅果全体を包み、熟すと裂けるブナ科の属を選びなさい。","opts":["Castanopsis","Fagus","Lithocarpus","Quercus"],"correct":0,"explanation":"Castanopsis（シイ属）の殻斗は堅果全体を包み、熟すと裂ける。","kind":"改題","note":"元問題Ⅱ-23の分岐C"},{"id":"sp-2016-Ⅱ-23D","year":2016,"num":"Ⅱ-23D","q":"【検索表からの改題】ブナ科で、殻斗が皿状・椀状で、堅果上部が露出する属を選びなさい。","opts":["Castanopsis","Fagus","Lithocarpus","Quercus"],"correct":2,"explanation":"Lithocarpus（マテバシイ属）は杯状の殻斗と露出する堅果をもつ。","kind":"改題","note":"元問題Ⅱ-23の分岐D"},{"id":"sp-2022-問55-1","year":2022,"num":"問55-1","q":"【検索表からの改題】ハコベ類で、花柱がふつう5個ある植物を選びなさい。","opts":["ウシハコベ","コハコベ","ノミノフスマ","ミドリハコベ"],"correct":0,"explanation":"ウシハコベは花柱が5個である点が識別形質となる。","kind":"改題","note":"元問題問55の分岐A"},{"id":"sp-2022-問55-2","year":2022,"num":"問55-2","q":"【検索表からの改題】ハコベ類で、花柱は3個、茎は無毛、葉には柄がない種を選びなさい。","opts":["ウシハコベ","コハコベ","ノミノフスマ","ミドリハコベ"],"correct":2,"explanation":"ノミノフスマは茎が無毛で葉が無柄。","kind":"改題","note":"元問題問55の分岐B"},{"id":"sp-2022-問55-3","year":2022,"num":"問55-3","q":"【検索表からの改題】茎に1列の毛があり、茎が紫色を帯びることが多く、種子の突起が低い半球状のハコベ類を選びなさい。","opts":["ウシハコベ","コハコベ","ノミノフスマ","ミドリハコベ"],"correct":1,"explanation":"コハコベはミドリハコベに比べ茎が紫色を帯びやすく、種子の突起が低い。","kind":"改題","note":"元問題問55の分岐C"},{"id":"sp-2022-問55-4","year":2022,"num":"問55-4","q":"【検索表からの改題】茎に1列の毛があり、通常緑色で、種子に長い円錐状突起があるハコベ類を選びなさい。","opts":["ウシハコベ","コハコベ","ノミノフスマ","ミドリハコベ"],"correct":3,"explanation":"ミドリハコベは種子表面の突起が比較的高い。","kind":"改題","note":"元問題問55の分岐D"},{"id":"sp-2016-Ⅱ-19","year":2016,"num":"Ⅱ-19","q":"エライオソームをもち、アリ散布される植物をひとつ選びなさい。","opts":["オオバコ","カタバミ","ゲンノショウコ","スズメノヤリ"],"correct":3,"explanation":"スズメノヤリは種子にアリを誘引するエライオソームをもち、アリ散布される。カタバミとゲンノショウコは果実から種子をはじき飛ばす散布方法が知られる。","kind":"原題","note":""},{"id":"sp-2016-Ⅱ-23B","year":2016,"num":"Ⅱ-23B","q":"【検索表からの改題】ブナ科の属のうち、雄花が多数集まった下垂する尾状花序をつける属を選びなさい。","opts":["Fagus","Castanopsis","Quercus","Lithocarpus"],"correct":2,"explanation":"Quercus（コナラ属）は一般に雄花を下垂する尾状花序につける。","kind":"改題","note":"2016年度Ⅱ-23検索表の枝問Bを独立した四択に改題。"},{"id":"sp-2019-Ⅱ-33A・関連","year":2019,"num":"Ⅱ-33A・関連","q":"【写真問題の関連知識】2019年度の写真同定問題で解答例となったウルップソウが属する科を選びなさい。","opts":["オオバコ科","キク科","アブラナ科","バラ科"],"correct":0,"explanation":"ウルップソウはオオバコ科（Lagotis 属）に属する高山植物。元の写真を見て種を同定する問題ではなく、関連する分類知識を問う追加問題。","kind":"関連問題","note":"2019年度Ⅱ-33図版Aの解答名のみ資料に残っており、写真を再掲できないため関連知識を問う問題に変更。"},{"id":"sp-2012-Ⅱ-2","year":2012,"num":"Ⅱ-2","q":"日本産のコケ植物約1,700種のうち、種数の多少を正しく示すものをひとつ選びなさい。","opts":["セン類＞タイ類＞ツノゴケ類","セン類＞ツノゴケ類＞タイ類","タイ類＞セン類＞ツノゴケ類","タイ類＞ツノゴケ類＞セン類"],"correct":0,"explanation":"日本のコケ植物ではセン類の種数が最も多く、次いでタイ類、ツノゴケ類。","kind":"原題","note":"種数は当時の概数。"},{"id":"sp-2012-Ⅱ-4","year":2012,"num":"Ⅱ-4","q":"サツマイモの塊根にできる芽のように、頂芽でも側芽でもない芽の名称をひとつ選びなさい。","opts":["混芽","潜伏芽","副芽","不定芽"],"correct":3,"explanation":"通常の茎頂や葉腋以外の位置から生じる芽を不定芽という。","kind":"原題","note":""},{"id":"sp-2012-Ⅱ-5","year":2012,"num":"Ⅱ-5","q":"サボテン類の針は何に由来するか、ひとつ選びなさい。","opts":["托葉","短枝","葉","毛状突起"],"correct":2,"explanation":"サボテン類の刺は葉の変態。","kind":"原題","note":""},{"id":"sp-2012-Ⅱ-6B","year":2012,"num":"Ⅱ-6B","q":"モモやアンズの俗に『たね』と呼ばれる核は、何に由来するか。","opts":["珠心","珠皮","中果皮","内果皮"],"correct":3,"explanation":"核は硬化した内果皮で形成される。","kind":"改題","note":"元問題Ⅱ-6の枝問B。"},{"id":"sp-2012-Ⅱ-7A","year":2012,"num":"Ⅱ-7A","q":"集散花序で、対をなす側枝が次々に出る花序をひとつ選びなさい。","opts":["陰頭花序","円錐花序","二出集散花序","輪散花序"],"correct":2,"explanation":"二出集散花序は主軸の下方から側枝が対になって分枝する。","kind":"改題","note":"元問題Ⅱ-7のAを独立。"},{"id":"sp-2012-Ⅱ-7B","year":2012,"num":"Ⅱ-7B","q":"ノカンゾウが属する科をひとつ選びなさい。","opts":["アヤメ科","オモダカ科","カンナ科","ワスレグサ科"],"correct":3,"explanation":"ノカンゾウはワスレグサ科（現行APGでツルボラン科として扱う体系もある）。","kind":"改題","note":"元問題Ⅱ-7のBを独立。科の範囲は出題当時の扱い。"},{"id":"sp-2013-Ⅱ-1","year":2013,"num":"Ⅱ-1","q":"地衣類に属するものをひとつ選びなさい。","opts":["アカミゴケ","イチョウウキゴケ","ナガバノモウセンゴケ","ナンジャモンジャゴケ"],"correct":0,"explanation":"アカミゴケは地衣類。イチョウウキゴケは苔類、ナガバノモウセンゴケは被子植物。","kind":"原題","note":""},{"id":"sp-2013-Ⅱ-2","year":2013,"num":"Ⅱ-2","q":"コケ植物ではないものをひとつ選びなさい。","opts":["カサゴケ","クロゴケ","ツボミゴケ","ツメゴケ"],"correct":3,"explanation":"ツメゴケは地衣類。","kind":"原題","note":""},{"id":"sp-2013-Ⅱ-10","year":2013,"num":"Ⅱ-10","q":"小葉植物に属する科をひとつ選びなさい。","opts":["イワヒバ科","デンジソウ科","トクサ科","ハナヤスリ科"],"correct":0,"explanation":"イワヒバ科は小葉植物。ほかは大葉植物のシダ類。","kind":"原題","note":""},{"id":"sp-2014-Ⅱ-1","year":2014,"num":"Ⅱ-1","q":"正しい記述をひとつ選びなさい。","opts":["花粉は発芽後、べん毛をもつ精子を生じる。","雌ずい（めしべ）をつくる葉を心皮という。","胚珠は雌ずい（めしべ）に1〜10数個つく。","裸子植物にも果実をもつ種がある。"],"correct":1,"explanation":"心皮は雌蕊を構成する葉由来の器官。胚珠数は種により大きく異なる。","kind":"原題","note":""},{"id":"sp-2014-Ⅱ-3A","year":2014,"num":"Ⅱ-3A","q":"コケ植物の検索表。葉状配偶体があり、ピレノイドをもち、蒴が角状で縦に2裂する群を選びなさい。","opts":["セン類","タイ類","地衣類","ツノゴケ類"],"correct":3,"explanation":"ツノゴケ類は角状の胞子体を形成する。","kind":"改題","note":"原題Ⅱ-3の検索表分岐A"},{"id":"sp-2014-Ⅱ-3B","year":2014,"num":"Ⅱ-3B","q":"コケ植物の検索表。油体があり、蒴に気孔や軸柱を欠き、胞子体の蒴が裂ける群を選びなさい。","opts":["セン類","タイ類","地衣類","ツノゴケ類"],"correct":1,"explanation":"タイ類では細胞内の油体が特徴となる。","kind":"改題","note":"原題Ⅱ-3の検索表分岐B"},{"id":"sp-2014-Ⅱ-3C","year":2014,"num":"Ⅱ-3C","q":"コケ植物の検索表。多細胞の仮根をもち、蒴が帽に覆われる群を選びなさい。","opts":["セン類","タイ類","地衣類","ツノゴケ類"],"correct":0,"explanation":"セン類は多細胞の仮根をもち、蒴帽を伴う。","kind":"改題","note":"原題Ⅱ-3の検索表分岐C"},{"id":"sp-2014-Ⅱ-4A","year":2014,"num":"Ⅱ-4A","q":"胞子が葉の縁の部分にできるシダをひとつ選びなさい。","opts":["イノモトソウ","イワガネゼンマイ","オシダ","シケシダ"],"correct":0,"explanation":"イノモトソウの胞子嚢群は葉縁に形成される。","kind":"改題","note":"原題Ⅱ-4枝問A"},{"id":"sp-2014-Ⅱ-4B","year":2014,"num":"Ⅱ-4B","q":"葉に二型性があり担根体をもつ植物をひとつ選びなさい。","opts":["クラマゴケ","トウゲシバ","ヒカゲノカズラ","マツバラン"],"correct":0,"explanation":"クラマゴケなどイワヒバ属には担根体がある。","kind":"改題","note":"原題Ⅱ-4枝問B"},{"id":"sp-2014-Ⅱ-4C","year":2014,"num":"Ⅱ-4C","q":"単葉で樹上や岩上に生えるシダをひとつ選びなさい。","opts":["イワデンダ","コバノヒノキシダ","トラノオシダ","ノキシノブ"],"correct":3,"explanation":"ノキシノブは樹幹や岩上に着生する単葉のシダ。","kind":"改題","note":"原題Ⅱ-4枝問C"},{"id":"sp-2014-Ⅱ-4D","year":2014,"num":"Ⅱ-4D","q":"葉身の細胞層が1層で薄いシダをひとつ選びなさい。","opts":["イワトラノオ","ウスヒメワラビ","ハイホラゴケ","ミズワラビ"],"correct":2,"explanation":"ハイホラゴケはコケシノブ科で、薄い一細胞層の葉身が特徴。","kind":"改題","note":"原題Ⅱ-4枝問D"},{"id":"sp-2014-Ⅱ-4E","year":2014,"num":"Ⅱ-4E","q":"胞子葉と栄養葉が分かれているシダをひとつ選びなさい。","opts":["イノデ","クサソテツ","ホシダ","ヤブソテツ"],"correct":1,"explanation":"クサソテツは栄養葉と胞子葉の二型性が明瞭。","kind":"改題","note":"原題Ⅱ-4枝問E"},{"id":"sp-2015-Ⅱ-1","year":2015,"num":"Ⅱ-1","q":"シダ植物の小胞子葉に相当する被子植物の器官をひとつ選びなさい。","opts":["萼片","花弁","苞葉","雄ずい"],"correct":3,"explanation":"雄ずいは小胞子を生じる器官と相同な構造。","kind":"原題","note":""},{"id":"sp-2015-Ⅱ-2","year":2015,"num":"Ⅱ-2","q":"単子葉類である科をひとつ選びなさい。","opts":["Compositae","Guttiferae","Labiatae","Palmae"],"correct":3,"explanation":"Palmaeはヤシ科（Arecaceae）の保存名。単子葉植物。","kind":"原題","note":""},{"id":"sp-2015-Ⅱ-5","year":2015,"num":"Ⅱ-5","q":"ずい柱についての記述として正しいものをひとつ選びなさい。","opts":["合心皮雌ずいのひとつ。","棍棒状の雌ずい。","雌ずいの一部。","雄ずいと雌ずいが合着したもの。"],"correct":3,"explanation":"ラン科などの蕊柱（ずい柱）は雄性・雌性器官が合着した構造。","kind":"原題","note":""},{"id":"sp-2015-Ⅱ-10B","year":2015,"num

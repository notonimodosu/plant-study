<!doctype html><html lang="ja"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#355c3a"><title>樹木の識別2 30問</title><style>*{box-sizing:border-box}body{margin:0;background:#f3f7f2;color:#223329;font-family:system-ui,-apple-system,"Noto Sans JP",sans-serif}main{max-width:690px;margin:auto;padding:12px 12px 35px}h1{font-size:20px;margin:9px 0}small,.muted{color:#607464}.box{background:white;border:1px solid #d8e5d8;border-radius:15px;padding:14px;margin:9px 0}label{display:block;font-weight:700;font-size:13px;margin:10px 0 5px}select,button{font:inherit;border-radius:10px;border:1px solid #b7cdb8;min-height:43px}select{width:100%;padding:8px;background:white}button{padding:9px;background:white;color:#214329;font-weight:700}.primary{background:#28613d;color:white;border-color:#28613d}.hide{display:none!important}.q{font-size:19px;line-height:1.5;font-weight:800;margin:11px 0}.opts button{width:100%;text-align:left;padding:10px 12px;margin:4px 0;min-height:43px}.opts button:disabled{opacity:1}.ok{background:#def3e0!important;border-color:#438c56!important}.ng{background:#fce6df!important;border-color:#c66a56!important}.nav{display:flex;gap:8px;margin:10px 0}.nav button{flex:1}.tip{background:#eef6ed;padding:10px;border-radius:9px;line-height:1.5;margin:8px 0}.tag{display:inline-block;border-radius:20px;background:#e5efe3;padding:4px 8px;font-size:12px}a{color:#27683a;text-decoration:none}#top{display:flex;justify-content:space-between;align-items:center;gap:12px}progress{width:100%;height:9px;accent-color:#377d4d}</style></head><body><main><div id="top"><h1>🌳 樹木の識別2 30問</h1><a href="./index.html">⌂ 学習ホーム</a></div><section class="box" id="setup"><div class="muted">重要10組 × 各3問。4択・解説・間違い復習</div><label>問題数</label><select id="limit"><option value="10">10問</option><option value="20">20問</option><option value="30" selected>全30問</option></select><label>出題範囲</label><select id="pool"><option value="all">全問題（ランダム）</option><option value="wrong">間違えた問題だけ</option><option value="unseen">未回答だけ</option></select><div id="stats" class="muted" style="margin:13px 0"></div><button id="start" class="primary" style="width:100%">学習開始</button></section><section class="box hide" id="study"><span class="tag" id="group"></span><div class="muted" id="count" style="margin:6px 0"></div><progress id="bar" value="0" max="100"></progress><div class="q" id="question"></div><div id="opts" class="opts"></div><div id="explain" class="tip hide"></div><div class="nav"><button id="back">← 一問戻る</button><button id="next" class="primary">次の問題 →</button></div><button id="quit" style="width:100%;min-height:35px;font-size:13px">設定へ戻る</button></section><section class="box hide" id="finish"><h2>学習結果</h2><p id="result"></p><button id="retry" class="primary" style="width:100%">設定へ戻る</button></section><p class="muted" style="font-size:11px">問題はオリジナルの学習用問題です。形態には個体差があるため、典型的な特徴を覚えてください。記録はこの端末のブラウザ内に保存します。</p></main><script>
const Q=[["針葉樹","モミとトウヒで、成熟した球果が枝上で崩れるのは？","モミ","トウヒ","両方とも液果を作る","両方とも殻斗を作る","モミ属の球果は上向きに付き、成熟すると鱗片がばらける。"],["針葉樹","モミとトウヒで、球果が一般に枝から垂れ下がるのは？","トウヒ","モミ","イチョウ","カヤ","トウヒ属は球果が下向きに付くのが一般的。"],["針葉樹","モミとトウヒに共通する所属科は？","マツ科","ヒノキ科","イチイ科","ブナ科","どちらもマツ科だが、モミ属とトウヒ属に分かれる。"],["針葉樹","スギとヒノキで、針状〜錐状の葉が枝を取り囲むように付くのは？","スギ","ヒノキ","どちらも5本束生","どちらも広い複葉","スギは先のとがった葉が小枝を取り囲む。"],["針葉樹","スギとヒノキで、鱗片状の葉が平たい小枝に密着するのは？","ヒノキ","スギ","アカマツ","カラマツ","ヒノキの小枝は扁平で、鱗片葉が密生する。"],["針葉樹","スギとヒノキの現行の分類での所属科は？","どちらもヒノキ科","スギはマツ科・ヒノキはヒノキ科","どちらもマツ科","どちらもイチイ科","かつてスギ科とされたスギも、現在はヒノキ科に含める。"],["広葉樹","ケヤキとエノキで、葉縁に鋭い鋸歯が連続して目立つのは？","ケヤキ","エノキ","どちらも全縁","どちらも針葉","ケヤキは鋸歯が葉縁に連続する。エノキは葉の上半部の鋸歯が目立つ。"],["広葉樹","ケヤキとエノキで、葉の上半部に鋸歯があり基部近くはほぼ全縁なのは？","エノキ","ケヤキ","クリ","ヤナギ","エノキは葉の下半部で鋸歯が少なくなることが多い。"],["広葉樹","APG系統分類で、ケヤキとエノキの科の組合せは？","ケヤキ＝ニレ科、エノキ＝アサ科","ケヤキ＝アサ科、エノキ＝ニレ科","両方ともブナ科","両方ともムクロジ科","ケヤキはニレ科、エノキはアサ科。旧分類との違いに注意。"],["広葉樹","エノキとムクノキで、成熟した葉がざらつく感触が特に顕著なのは？","ムクノキ","エノキ","両方とも針葉","両方とも葉に鋸歯がない","ムクノキの葉は硬い毛でざらつき、研磨に利用された。"],["広葉樹","エノキとムクノキで、葉の鋸歯が上半部に偏りやすいのは？","エノキ","ムクノキ","ヤマザクラ","モミ","エノキでは葉の基部付近が全縁になることが多い。"],["広葉樹","エノキとムクノキに共通する現在の所属科は？","アサ科","ニレ科","ブナ科","モクレン科","両方とも現行分類ではアサ科。"],["カバノキ科","シラカンバとダケカンバで、白く薄く剥がれる樹皮が典型的なのは？","シラカンバ","ダケカンバ","クヌギ","クロマツ","シラカンバは白い樹皮が目立つ。若齢や個体差には注意。"],["カバノキ科","シラカンバとダケカンバで、樹皮が淡褐色〜灰褐色になりやすいのは？","ダケカンバ","シラカンバ","ブナ","モミ","ダケカンバは樹皮が淡褐色〜灰褐色の個体が多く、高標高に多い。"],["カバノキ科","シラカンバとダケカンバの分布を比べて適切なのは？","ダケカンバは一般により標高の高い場所まで分布する","シラカンバだけが高山帯にある","両方とも暖地の海岸林だけに生える","ダケカンバは日本にない","ダケカンバは亜高山帯にも広く見られる。分布の重なりはある。"],["カバノキ科","ハンノキとヤシャブシで、水湿地に生えることが典型的なのは？","ハンノキ","ヤシャブシ","両方とも海中に生育","両方とも高山雪田だけに生育","ハンノキは湿地や水辺に生育する代表的な樹木。"],["カバノキ科","ハンノキとヤシャブシで、崩壊地・痩せ地に侵入する先駆樹種として知られるのは？","ヤシャブシ","ハンノキ","モミ","シラカシ","ヤシャブシは荒地の緑化にも利用されてきた。"],["カバノキ科","ハンノキとヤシャブシに共通する特徴は？","木質化した小さな松ぼっくり状の果序をつける","どんぐりに殻斗がある","5本束生の針葉をつける","赤い液果をつける","どちらもカバノキ科ハンノキ属で、木質化した果序を作る。"],["サクラ類","ヤマザクラとソメイヨシノで、開花とほぼ同時に赤褐色の若葉が展開するのは？","ヤマザクラ","ソメイヨシノ","ともに常緑樹","ともに葉がない","ヤマザクラは花と赤褐色の若葉が同時期に見られるのが典型。"],["サクラ類","ヤマザクラとソメイヨシノで、一般に葉が展開する前に花が目立つのは？","ソメイヨシノ","ヤマザクラ","モミ","コナラ","ソメイヨシノは開花時に葉がまだ小さいことが多い。"],["サクラ類","ソメイヨシノの多くの植栽個体の増やし方として一般的なのは？","接ぎ木などの栄養繁殖","どんぐりを播く","球果から種子を取り出す","胞子で増やす","ソメイヨシノは栄養繁殖で同じ遺伝子型の個体が広く植えられる。"],["葉の形","アオキとヤツデで、葉が掌状に大きく裂けるのは？","ヤツデ","アオキ","どちらも2回羽状複葉","どちらも針葉","ヤツデは大きな掌状に分裂する単葉をもつ。"],["葉の形","アオキとヤツデで、葉が対生するのは？","アオキ","ヤツデ","どちらも輪生","どちらも複葉","アオキは対生、ヤツデは互生。"],["葉の形","アオキとヤツデで、葉の付き方が互生なのは？","ヤツデ","アオキ","トチノキ","メグスリノキ","ヤツデは互生で、枝先に葉が集まりやすい。"],["複葉","トチノキとコシアブラで、一般に5〜7枚の小葉からなる掌状複葉をつけるのは？","トチノキ","コシアブラ","どちらも羽状複葉","どちらも単葉","トチノキは通常5〜7小葉、コシアブラは通常5小葉。"],["複葉","トチノキとコシアブラで、通常5枚の小葉が放射状に付くのは？","コシアブラ","トチノキ","ケヤキ","マツ","コシアブラは典型的に5小葉の掌状複葉。"],["複葉","トチノキとコシアブラで、葉が対生するのは？","トチノキ","コシアブラ","両方とも輪生","両方とも互生","トチノキは対生、コシアブラは互生。"],["カエデ類","イロハモミジとメグスリノキで、3出複葉を持つのは？","メグスリノキ","イロハモミジ","どちらも羽状複葉","どちらも鱗片葉","メグスリノキは3枚の小葉からなる複葉が特徴。"],["カエデ類","イロハモミジとメグスリノキで、掌状に深く裂ける単葉を持つのは？","イロハモミジ","メグスリノキ","トチノキ","コシアブラ","イロハモミジは掌状に裂けた単葉で、3出複葉ではない。"],["カエデ類","イロハモミジとメグスリノキに共通する特徴は？","葉が対生し、翼果をつける","両方とも常緑針葉樹","両方とも殻斗を作る","両方とも羽状複葉","両種ともカエデ属で、対生の葉と対になった翼果が特徴。"]]; const key="tree_pair_30_v2"; let history={};try{history=JSON.parse(localStorage.getItem(key)||"{}")}catch(e){};let round=[],pos=0,answers={};const $=id=>document.getElementById(id);const shuffle=a=>{const b=[...a];for(let i=b.length-1;i>0;i--){let j=Math.floor(Math.random()*(i+1));[b[i],b[j]]=[b[j],b[i]]}return b};function save(){try{localStorage.setItem(key,JSON.stringify(history))}catch(e){}}function show(id){for(const x of ["setup","study","finish"])$(x).classList.toggle("hide",x!==id)}function stats(){const vals=Object.values(history);$("stats").textContent="学習済み "+vals.length+"/30問 ｜ 要復習 "+vals.filter(v=>v===false).length+"問"}function start(){let ids=Q.map((_,i)=>i);if($("pool").value==="wrong")ids=ids.filter(i=>history[i]===false);if($("pool").value==="unseen")ids=ids.filter(i=>history[i]===undefined);if(!ids.length){alert("対象の問題がありません");return}round=shuffle(ids).slice(0,Number($("limit").value));answers={};pos=0;show("study");render()}function render(){const id=round[pos],q=Q[id];$("group").textContent=q[0];$("count").textContent=(pos+1)+" / "+round.length+"問";$("bar").value=(pos+1)/round.length*100;$("question").textContent=q[1];$("opts").innerHTML="";const opts=shuffle([q[2],q[3],q[4],q[5]]);for(const opt of opts){const b=document.createElement("button");b.textContent=opt;b.onclick=()=>answer(id,opt);$("opts").append(b)}$("explain").classList.add("hide");if(answers[id]!==undefined)reveal(id);$("back").disabled=pos===0;$("next").textContent=pos===round.length-1?"結果を見る →":"次の問題 →"}function answer(id,opt){if(answers[id]!==undefined)return;answers[id]=opt;history[id]=opt===Q[id][2];save();reveal(id)}function reveal(id){const q=Q[id],choice=answers[id];for(const b of $("opts").children){b.disabled=true;if(b.textContent===q[2])b.classList.add("ok");else if(b.textContent===choice)b.classList.add("ng")}$("explain").textContent=(choice===q[2]?"○ 正解！ ":"× 不正解。 正解："+q[2]+"。 ")+q[6];$("explain").classList.remove("hide")}function next(){if(pos<round.length-1){pos++;render()}else{const correct=round.filter(i=>answers[i]===Q[i][2]).length,done=round.filter(i=>answers[i]!==undefined).length;show("finish");$("result").textContent="正解 "+correct+" / "+round.length+"問（回答済み "+done+"問）。間違えた問題だけを復習できます。";stats()}}$("start").onclick=start;$("back").onclick=()=>{if(pos>0){pos--;render()}};$("next").onclick=next;$("quit").onclick=()=>{stats();show("setup")};$("retry").onclick=()=>{stats();show("setup")};stats();
</script></body></html>

<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>果実・種子 一問一答</title><style>*{box-sizing:border-box}body{margin:0;background:#f4f7f2;color:#26372b;font-family:system-ui,"Noto Sans JP",sans-serif}main{max-width:640px;margin:auto;padding:16px}h1{font-size:22px}.card{background:white;border-radius:16px;padding:18px;margin:12px 0}button,select{font:inherit;border:1px solid #b5c5b7;background:white;border-radius:11px;padding:12px;cursor:pointer}button.primary{background:#276849;color:white;border-color:#276849}.row{display:flex;gap:8px}.row>*{flex:1}label{display:block;margin:12px 0 6px}.muted{font-size:13px;color:#68756a}.question{font-size:23px;font-weight:700;line-height:1.6;margin:28px 0}.answer{background:#e9f5e8;padding:18px;border-radius:12px;margin:16px 0;font-size:21px;font-weight:700}.answer small{display:block;font-size:13px;font-weight:400;margin-top:10px}.hide{display:none}.ok{background:#e7f5e9}.ng{background:#ffefeb}#progressbar{height:7px;background:#e1e8e0;border-radius:8px;overflow:hidden}#fill{height:100%;background:#36815c;width:0}.top{display:flex;justify-content:space-between;align-items:center;gap:8px}.top button{padding:6px 10px;font-size:12px}.stat{line-height:1.8}</style></head><body><main><h1>🍎 果実・種子 一問一答</h1><p class="muted">100ポイントの41〜55を中心に細分化｜全50問｜インプット専用</p><section class="card" id="setup"><label>出題数</label><select id="count" style="width:100%"><option value="10">10問</option><option value="20">20問</option><option value="all">全問</option></select><label>開始位置</label><select id="offset" style="width:100%"><option value="0">1問目から</option><option value="10">11問目から</option><option value="20">21問目から</option><option value="30">31問目から</option><option value="40">41問目から</option></select><label><input id="shuffle" type="checkbox"> シャッフル</label><p class="muted stat" id="stats"></p><button class="primary" style="width:100%" onclick="start(false)">学習開始</button><button style="width:100%;margin-top:8px" onclick="start(true)">×だけ復習</button></section><section class="card hide" id="quiz"><div class="top"><span id="counter" class="muted"></span><button onclick="home()">設定へ戻る</button></div><div id="progressbar"><div id="fill"></div></div><div class="question" id="question"></div><button id="reveal" class="primary" style="width:100%" onclick="showAnswer()">答えを見る</button><div id="answerBox" class="hide"><div class="answer"><div id="answer"></div><small id="note"></small></div><div class="row"><button class="ng" onclick="mark(false)">× もう一度</button><button class="ok" onclick="mark(true)">○ 覚えていた</button></div></div><div class="row" style="margin-top:12px"><button onclick="back()">← 一問戻る</button><button class="primary" onclick="next()">次の問題 →</button></div></section><section id="result" class="card hide"><h2>学習終了！</h2><p id="summary"></p><button class="primary" style="width:100%" onclick="home()">設定へ戻る</button><button style="width:100%;margin-top:8px" onclick="start(true)">×だけ復習</button></section></main><script>const Q=[{"id":1,"q":"ブナ科の果実の型は？","a":"堅果","n":"ドングリやクリなど"},{"id":2,"q":"ブナ科の果実を包む器官は？","a":"殻斗（かくと）","n":"総苞に由来する"},{"id":3,"q":"コナラのドングリの帽子は？","a":"殻斗","n":""},{"id":4,"q":"クリのイガは何に相当する？","a":"殻斗","n":""},{"id":5,"q":"カエデ属の果実は？","a":"翼果","n":""},{"id":6,"q":"カエデ属の果実は通常何個の分果が対になる？","a":"2個","n":""},{"id":7,"q":"ニレ属の果実は？","a":"翼果","n":""},{"id":8,"q":"カバノキ属の小さな果実に多い特徴は？","a":"翼がある","n":""},{"id":9,"q":"マメ科の典型的な果実は？","a":"豆果","n":""},{"id":10,"q":"豆果は通常いくつの心皮に由来する？","a":"1個","n":""},{"id":11,"q":"アブラナ科の果実の代表的な2型は？","a":"長角果・短角果","n":""},{"id":12,"q":"長角果と短角果の区別で見るのは？","a":"果実の長さと幅の比","n":""},{"id":13,"q":"キク科の果実の型は？","a":"下位痩果（痩果状）","n":""},{"id":14,"q":"タンポポの果実の風散布を助けるものは？","a":"冠毛","n":""},{"id":15,"q":"イネ科の果実の型は？","a":"穎果（えいか）","n":""},{"id":16,"q":"穎果では果皮と種皮は？","a":"密着する","n":""},{"id":17,"q":"バラ科の果実はどれも同じ型？","a":"いいえ。多様","n":""},{"id":18,"q":"サクラの果実は？","a":"核果","n":""},{"id":19,"q":"ウメの果実は？","a":"核果","n":""},{"id":20,"q":"モモの果実は？","a":"核果","n":""},{"id":21,"q":"核果で種子を包む硬い部分は？","a":"内果皮","n":""},{"id":22,"q":"イチゴの赤い部分は主に何？","a":"花托","n":""},{"id":23,"q":"イチゴの表面の粒々は何？","a":"個々の果実","n":""},{"id":24,"q":"イチゴの粒々の果実型は？","a":"痩果","n":""},{"id":25,"q":"リンゴの食用部分は主に何に由来する？","a":"花托など","n":""},{"id":26,"q":"リンゴの果実型は？","a":"ナシ状果","n":""},{"id":27,"q":"イチジクの食べる部分は主に何由来？","a":"花序（花嚢）","n":""},{"id":28,"q":"イチジクの花はどこにある？","a":"袋状の花序の内側","n":""},{"id":29,"q":"裸子植物は真の果実をつくる？","a":"つくらない","n":""},{"id":30,"q":"裸子植物に子房はある？","a":"ない","n":""},{"id":31,"q":"ギンナンは果実？種子？","a":"種子","n":""},{"id":32,"q":"ギンナンの外側の肉質部は果皮？","a":"いいえ。種皮の一部","n":""},{"id":33,"q":"果実とは基本的に何が発達したもの？","a":"子房","n":"花托などが加わる例もある"},{"id":34,"q":"種子とは基本的に何が発達したもの？","a":"胚珠","n":""},{"id":35,"q":"翼果の翼の主な役割は？","a":"風散布","n":""},{"id":36,"q":"堅果は成熟すると自然に裂ける？","a":"通常裂けない","n":""},{"id":37,"q":"豆果は通常どこから裂開する？","a":"背側と腹側の縫合線","n":""},{"id":38,"q":"痩果の特徴は？","a":"乾燥した閉果で種子を1個含む","n":""},{"id":39,"q":"穎果と痩果の重要な違いは？","a":"穎果は果皮と種皮が密着","n":""},{"id":40,"q":"集合果は何が集まったもの？","a":"1花の複数の雌しべ由来の果実","n":""},{"id":41,"q":"複合果は何が集まったもの？","a":"複数の花に由来する果実","n":""},{"id":42,"q":"イチゴは集合果？複合果？","a":"集合果","n":""},{"id":43,"q":"イチジクは集合果？複合果？","a":"複合果（花序由来）","n":""},{"id":44,"q":"カエデの翼果は散布時に何を利用する？","a":"風","n":""},{"id":45,"q":"サクラの果実は主に何に食べられて散布される？","a":"鳥類など","n":""},{"id":46,"q":"ドングリの果実散布に関わる動物は？","a":"ネズミ・カケスなど","n":""},{"id":47,"q":"キク科の冠毛は何が変化したもの？","a":"萼","n":""},{"id":48,"q":"核果の外側の果皮は一般にどうなる？","a":"肉質になることが多い","n":""},{"id":49,"q":"果実の果皮は何層に分けられる？","a":"外果皮・中果皮・内果皮","n":""},{"id":50,"q":"イチョウの銀杏の外側の悪臭を放つ肉質部分は？","a":"種皮の外層","n":""}],KEY="fruit_seed_input_2026";let history={};try{history=JSON.parse(localStorage.getItem(KEY)||"{}")}catch(e){}let order=[],pos=0,shown={},marks={};const E=id=>document.getElementById(id);function stats(){let vals=Object.values(history);E("stats").textContent="記録済み "+vals.length+"問｜○ "+vals.filter(v=>v===true).length+"問｜× "+vals.filter(v=>v===false).length+"問"}function start(wrong){let pool=Q.map((_,i)=>i);if(wrong){pool=pool.filter(i=>history[i]===false)}else{if(E("shuffle").checked)pool.sort(()=>Math.random()-.5);pool=pool.slice(+E("offset").value);let count=E("count").value;if(count!=="all")pool=pool.slice(0,+count)}if(!pool.length){alert("対象問題がありません。");return}order=pool;pos=0;shown={};marks={};E("setup").classList.add("hide");E("result").classList.add("hide");E("quiz").classList.remove("hide");render()}function render(){let i=order[pos],q=Q[i];E("counter").textContent=(pos+1)+" / "+order.length+"問";E("fill").style.width=((pos+1)/order.length*100)+"%";E("question").textContent=q.q;E("answer").textContent=q.a;E("note").textContent=q.n;E("answerBox").classList.toggle("hide",!shown[i]);E("reveal").classList.toggle("hide",!!shown[i])}function showAnswer(){shown[order[pos]]=true;render()}function mark(v){let i=order[pos];marks[i]=v;history[i]=v;localStorage.setItem(KEY,JSON.stringify(history));if(pos<order.length-1){pos++;render()}else finish()}function next(){if(!shown[order[pos]]){showAnswer();return}if(pos<order.length-1){pos++;render()}else finish()}function back(){if(pos>0){pos--;render()}}function finish(){E("quiz").classList.add("hide");E("result").classList.remove("hide");let m=Object.values(marks);E("summary").textContent="○ "+m.filter(Boolean).length+"問、× "+m.filter(v=>v===false).length+"問（未判定 "+(order.length-m.length)+"問）"}function home(){E("quiz").classList.add("hide");E("result").classList.add("hide");E("setup").classList.remove("hide");stats()}stats();</script></body></html>

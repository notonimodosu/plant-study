<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>植物2級・ひっかけ対策</title><style>*{box-sizing:border-box}body{margin:0;background:#f3f7f4;color:#19372a;font-family:system-ui,"Noto Sans JP",sans-serif}main{max-width:650px;margin:auto;padding:16px}h1{font-size:22px}section{background:white;border:1px solid #d8e6db;border-radius:16px;padding:16px;margin:12px 0}button,select{font:inherit;border-radius:11px;padding:12px;border:1px solid #b8d1be;background:white;color:#174b31}button{cursor:pointer}.primary{background:#176743;color:white}.choices{display:grid;gap:9px;margin:12px 0}.choices button{text-align:left;font-weight:700;min-height:50px}.choices button.correct{background:#d8f5e0}.choices button.wrong{background:#ffe2df}.row{display:flex;gap:8px}.row button{flex:1}.small{font-size:13px;color:#687b6c}.question{font-size:24px;font-weight:800;margin:22px 0}.hidden{display:none!important}.feedback{font-size:14px;line-height:1.7;margin:10px 0}.feedback:empty{display:none}.nav{display:flex;gap:8px;margin:10px 0}.nav button{flex:1;min-height:50px}select{width:100%}label{display:block;margin:12px 0;font-size:14px}</style></head><body><main><h1>🌿 植物ひっかけ・仲間外れ対策</h1><p class="small">名前→科・葉序・科の仲間外れ／全75問</p><section id="settings"><label>出題モード<select id="mode"><option value="all">全部混合</option><option value="name">名前のひっかけ</option><option value="leaf">葉序</option><option value="odd">科の仲間外れ</option></select></label><label>出題数<select id="count"><option value="10">10問</option><option value="20">20問</option><option value="all">全問</option></select></label><label>出題範囲<select id="scope"><option value="all">すべて</option><option value="missed">間違えた問題だけ</option></select></label><button class="primary" id="start" style="width:100%">この設定でスタート</button></section><section id="game" class="hidden"><div class="small" id="progress"></div><div class="question" id="question"></div><div id="choices" class="choices"></div><div id {let b=document.createElement("button");b.textContent=v;if(a){b.disabled=true;if(v===x.answer)b.classList.add("correct");else if(v===a.choice)b.classList.add("wrong")}b.onclick=()=>{if(answers[i])return;let ok=v===x.answer;answers[i]={ok,choice:v,opts};if(ok)misses.delete(x.id);else misses.add(x.id);localStorage.setItem(KEY,JSON.stringify([...misses]));render()};$("choices").appendChild(b)})}$("start").onclick=start;$("next").onclick=()=>{i++;render()};$("prev").onclick=()=>{if(i>0)i--;render()};$("back").onclick=()=>show("settings");$("again").onclick=start;$("review").onclick=()=>{$("scope").value="missed";$("mode").value="all";start()};</script></body></html>

<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#355c3a"><title>子房の位置・識別 40問</title><style>*{box-sizing:border-box}body{margin:0;background:#f4f7f1;color:#203125;font-family:system-ui,-apple-system,"Noto Sans JP",sans-serif}main{max-width:600px;margin:auto;padding:18px 16px 40px}h1{font-size:24px;margin:8px 0}p{line-height:1.6}.muted{color:#607263;font-size:14px}.panel{background:white;border:1px solid #d8e5d7;border-radius:18px;padding:18px;margin:15px 0;box-shadow:0 3px 12px #2139210b}button,select{font:inherit;border-radius:12px;padding:13px;border:1px solid #bfd2bf;background:white;color:#21412b}button{cursor:pointer}button:disabled{opacity:.4}.primary{background:#355f40;color:white;border-color:#355f40;font-weight:750}.wide{width:100%;margin:7px 0}.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}.grid button{width:100%}.top{display:flex;justify-content:space-between;align-items:center;gap:8px}.top button{font-size:13px;padding:9px}.q{font-size:21px;font-weight:750;line-height:1.5;margin:13px 0 20px}.option{display:block;text-align:left;width:100%;margin:9px 0;line-height:1.45}.chosen{border:2px solid #355f40;background:#e5f1e5}.answer{background:#edf4e9;border-radius:12px;padding:13px;margin-top:13px;line-height:1.7}.hidden{display:none}.pill{display:inline-block;border-radius:40px;background:#e1ebe0;padding:6px 11px;font-size:12px}a{color:#376442}#bottom{margin-top:7px}label{display:block;margin:14px 0}.bar{height:7px;border-radius:6px;background:#dce7d9;overflow:hidden;margin:12px 0}.bar>div{height:100%;background:#45764c;transition:width .2s}</style></head><body><main><div class="top"><a href="./index.html">‹ 学習ホームへ</a><span class="pill">生物分類技能検定2級</span></div><h1>🌼 子房の位置・識別</h1><p class="muted">上位・下位・中位／科の特徴・ひっかけ・基礎　全40問</p><section id="settings" class="panel"><strong>出題設定</strong><label>出題範囲<br><select id="size"><option value="10">10問</option><option value="20">20問</option><option value="all">全40問</option></select></label><label><input id="miss" type="checkbox"> 前回までに間違えた問題だけ</label><label><input id="random" type="checkbox" checked> 出題順をシャッフル</label><button class="primary wide" id="start">学習スタート</button><p class="muted">一問ずつ正誤判定。途中で「一問戻る」も使えます。間違い履歴はこのブラウザに保存。</p></section><section id="study" class="panel hidden"><div class="top"><span id="progress" class="muted"></span><button id="home">設定へ戻る</button></div><div class="bar"><div id="fill"></div></div><div class="q" id="question"></div><div id="options"></div><div class="answer hidden" id="feedback"></div><div id="bottom" class="grid"><button id="prev">← 一問戻る</button><button class="primary" id="next" disabled>次の問題 →</button></div></section><section id="done" class="panel hidden"><h2>学習結果</h2><p id="summary"></p><button class="primary wide" id="again">設定へ戻る</button></section></main><script>
const DATA=[{"q":"アブラナ科の子房の位置は？","a":"上位","exp":"アブラナ科：子房上位。ナズナ・ダイコン。"},{"q":"マメ科の子房の位置は？","a":"上位","exp":"マメ科：子房上位。エンドウ・フジ。"},{"q":"ナス科の子房の位置は？","a":"上位","exp":"ナス科：子房上位。ナス・トマト。"},{"q":"シソ科の子房の位置は？","a":"上位","exp":"シソ科：子房上位。ホトケノザ・シソ。"},{"q":"キンポウゲ科の子房の位置は？","a":"上位","exp":"キンポウゲ科：子房上位。キンポウゲ・オダマキ。"},{"q":"ユリ科の子房の位置は？","a":"上位","exp":"ユリ科：子房上位。ユリ・カタクリ。"},{"q":"ツツジ科の子房の位置は？","a":"上位","exp":"ツツジ科：子房上位。ツツジ・アセビ（例外あり）。"},{"q":"アヤメ科の子房の位置は？","a":"下位","exp":"アヤメ科：子房下位。アヤメ・カキツバタ。"},{"q":"キク科の子房の位置は？","a":"下位","exp":"キク科：子房下位。タンポポ・ヨモギ。"},{"q":"ウリ科の子房の位置は？","a":"下位","exp":"ウリ科：子房下位。キュウリ・カボチャ。"},{"q":"ラン科の子房の位置は？","a":"下位","exp":"ラン科：子房下位。シュンラン・ネジバナ。"},{"q":"アカバナ科の子房の位置は？","a":"下位","exp":"アカバナ科：子房下位。マツヨイグサ・アカバナ。"},{"q":"セリ科の子房の位置は？","a":"下位","exp":"セリ科：子房下位。セリ・ニンジン。"},{"q":"キキョウ科の子房の位置は？","a":"下位","exp":"キキョウ科：子房下位。キキョウ・ホタルブクロ。"},{"q":"アカネ科の子房の位置は？","a":"下位","exp":"アカネ科：子房下位。アカネ・ヤエムグラ。"},{"q":"スイカズラ科の子房の位置は？","a":"下位","exp":"スイカズラ科：子房下位。スイカズラ。"},{"q":"アジサイ科の子房の位置は？","a":"下位","exp":"アジサイ科：子房下位。アジサイ（属）。"},{"q":"サクラ（バラ科）の子房の位置は？","a":"上位","exp":"サクラ（バラ科）：子房上位。リンゴと同じバラ科。"},{"q":"ウメ（バラ科）の子房の位置は？","a":"上位","exp":"ウメ（バラ科）：子房上位。サクラと同様。"},{"q":"モモ（バラ科）の子房の位置は？","a":"上位","exp":"モモ（バラ科）：子房上位。核果。"},{"q":"リンゴ（バラ科）の子房の位置は？","a":"下位","exp":"リンゴ（バラ科）：子房下位。偽果・ナシと同様。"},{"q":"ナシ（バラ科）の子房の位置は？","a":"下位","exp":"ナシ（バラ科）：子房下位。偽果。"},{"q":"ヒガンバナ（ヒガンバナ科）の子房の位置は？","a":"下位","exp":"ヒガンバナ（ヒガンバナ科）：子房下位。ネギ属とは異なる。"},{"q":"ネギ（ヒガンバナ科）の子房の位置は？","a":"上位","exp":"ネギ（ヒガンバナ科）：子房上位。APG分類・ネギ亜科。"},{"q":"ニラ（ヒガンバナ科）の子房の位置は？","a":"上位","exp":"ニラ（ヒガンバナ科）：子房上位。ネギ属。"},{"q":"子房上位とは何か？","a":"萼・花弁・雄しべが子房より下に付く","exp":"花托に対する位置関係で判断する。"},{"q":"子房下位とは何か？","a":"萼・花弁・雄しべが子房より上に付く","exp":"子房が花托などと癒合する形態。"},{"q":"子房中位とは何か？","a":"子房の一部が花托に包まれ癒合する","exp":"上位と下位の中間。子房周位とは区別する。"},{"q":"受精後、子房は原則何になる？","a":"果実","exp":"胚珠は種子、子房壁は果皮へ発達する。"},{"q":"受精後、胚珠は原則何になる？","a":"種子","exp":"子房全体からは果実が発達する。"},{"q":"受精後、子房壁は原則何になる？","a":"果皮","exp":"果皮は外果皮・中果皮・内果皮に分化する場合がある。"},{"q":"サクラとリンゴの子房の組合せは？","a":"サクラが上位、リンゴが下位","exp":"同じバラ科でも位置が異なる。"},{"q":"ネギとヒガンバナの子房の組合せは？","a":"ネギが上位、ヒガンバナが下位","exp":"APG体系で両者はヒガンバナ科。"},{"q":"子房周位とは？","a":"花托筒の縁に花被・雄しべが付く","exp":"子房の周囲を花托筒が囲み、必ずしも子房と癒合しない。"},{"q":"バラ科で子房下位の代表例は？","a":"リンゴ・ナシ","exp":"サクラ・ウメ・モモは上位。"},{"q":"バラ科で子房上位の代表例は？","a":"サクラ・ウメ・モモ","exp":"リンゴ・ナシは下位。"},{"q":"キク科とマメ科、子房下位なのは？","a":"キク科","exp":"マメ科は上位。"},{"q":"ラン科とユリ科、子房上位なのは？","a":"ユリ科","exp":"ラン科は下位。"},{"q":"アブラナ科とアカネ科、子房下位なのは？","a":"アカネ科","exp":"アブラナ科は上位。"},{"q":"ウリ科とナス科、子房上位なのは？","a":"ナス科","exp":"ウリ科は下位。"}];
const KEY="ovary_questions_missed_v1";
let missed=new Set();try{missed=new Set(JSON.parse(localStorage.getItem(KEY)||"[]"))}catch(e){}
let order=[],index=0,selected={};
const $=id=>document.getElementById(id);
function save(){try{localStorage.setItem(KEY,JSON.stringify([...missed]))}catch(e){}}
function shuffle(a){for(let i=a.length-1;i>0;i--){let j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
function opts(q){const positional=["上位","中位","下位"];const pool=positional.includes(q.a)?positional: [...new Set(DATA.map(item=>item.a).filter(a=>!positional.includes(a)))];const other=shuffle(pool.filter(a=>a!==q.a));return shuffle([q.a,...other.slice(0,3)])}
function start(){let arr=DATA.map((_,i)=>i);if($("miss").checked)arr=arr.filter(i=>missed.has(i));if(!arr.length){alert("復習対象の間違い問題はまだありません");return}if($("random").checked)shuffle(arr);order=arr.slice(0,$("size").value==="all"?arr.length:Number($("size").value));index=0;selected={};$("settings").classList.add("hidden");$("done").classList.add("hidden");$("study").classList.remove("hidden");render()}
function render(){if(index>=order.length){finish();return}const id=order[index],q=DATA[id],v=selected[id];$("progress").textContent=(index+1)+" / "+order.length;$("fill").style.width=(index/order.length*100)+"%";$("question").textContent=q.q;$("options").innerHTML="";let choices=opts(q);if(v)choices=v.choices;choices.forEach(a=>{let b=document.createElement("button");b.className="option"+(v&&v.a===a?" chosen":"");b.textContent=a;b.disabled=!!v;b.onclick=()=>choose(id,a,choices);$("options").appendChild(b)});$("feedback").classList.toggle("hidden",!v);if(v)$("feedback").textContent=(v.a===q.a?"✓ 正解":"× 不正解")+"｜正答："+q.a+"。 "+q.exp;$("next").disabled=!v;$("prev").disabled=index===0;$("next").textContent=index===order.length-1?"結果を見る →":"次の問題 →"}
function choose(id,a,choices){selected[id]={a,choices};if(a===DATA[id].a)missed.delete(id);else missed.add(id);save();render()}
function finish(){$("study").classList.add("hidden");$("done").classList.remove("hidden");let correct=order.filter(i=>selected[i]?.a===DATA[i].a).length;$("summary").textContent=order.length+"問中 "+correct+"問正解。間違い履歴は保存しました。"}
function reset(){$("study").classList.add("hidden");$("done").classList.add("hidden");$("settings").classList.remove("hidden")}
$("start").onclick=start;$("home").onclick=reset;$("again").onclick=reset;$("prev").onclick=()=>{if(index>0){index--;render()}};$("next").onclick=()=>{if(selected[order[index]]){index++;render()}};
</script></body></html>

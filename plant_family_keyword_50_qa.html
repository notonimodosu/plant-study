<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#255b43"><title>植物2級 科の識別キーワード50問</title><style>
*{box-sizing:border-box}body{margin:0;background:#f3f7f2;color:#26382d;font:15px/1.55 system-ui,-apple-system,"Noto Sans JP",sans-serif}main{max-width:650px;margin:auto;padding:14px 12px 30px}h1{font-size:22px;margin:6px 0}h2{font-size:18px;margin:0 0 12px}.muted{color:#66786a;font-size:12px}.panel{background:white;border-radius:15px;border:1px solid #dbe6dc;padding:15px;margin:10px 0}.hide{display:none!important}.btn{width:100%;border:0;border-radius:10px;background:#246e4e;color:white;min-height:48px;font-weight:700;font-size:15px;padding:9px 12px;cursor:pointer}.btn.alt{background:#e8f1e9;color:#286346}.btn.outline{background:white;border:1px solid #bdcfbf;color:#286346}.btn.red{background:#b54d45}.btn:disabled{opacity:.45}.row{display:flex;gap:9px}.row>*{flex:1;min-width:0}select{width:100%;padding:11px;border:1px solid #bdd1bf;border-radius:10px;background:white;min-height:44px}.label{font-size:12px;font-weight:700;display:block;margin:12px 0 5px}.question{font-size:24px;font-weight:800;line-height:1.55;margin:15px 0 22px;white-space:pre-wrap}.answer{padding:14px;border-radius:12px;background:#eef7f0;margin:12px 0}.answer strong{display:block;font-size:22px;margin:8px 0}.answer p{margin:5px 0}.progress{height:8px;background:#e1eae2;border-radius:8px;overflow:hidden;margin:12px 0}.progress div{height:100%;background:#2a8056}.statrow{display:flex;justify-content:space-between;gap:8px;font-size:13px;color:#57705d;margin-bottom:9px}#listPanel{max-height:450px;overflow:auto}#listPanel>div{padding:9px 0;border-bottom:1px solid #e3ece4;font-size:13px}.pill{display:inline-block;background:#e3efe5;color:#255b40;border-radius:7px;font-size:11px;padding:4px 7px}button:focus-visible,select:focus-visible{outline:3px solid #92c6a0;outline-offset:2px}
</style></head><body><main><header><span class="pill">生物分類技能検定2級・植物部門</span><h1>🌿 科の識別キーワード 50問</h1><div class="muted">キーワード → 科名を思い出す → 答えを見る → ○×で記録</div></header>
<section id="home" class="panel"><h2>学習設定</h2><div class="statrow"><span>全50問</span><span id="stats">○ 0 / × 0</span></div><label class="label" for="category">出題カテゴリー</label><select id="category"><option value="all">全カテゴリー</option><option value="A">最重要の識別キーワード（18問）</option><option value="B">候補を絞る特徴（16問）</option><option value="C">似た科・ひっかけ比較（16問）</option></select><div class="row"><div><label class="label" for="mode">出題モード</label><select id="mode"><option value="10">10問ずつ</option><option value="20">20問ずつ</option><option value="all">選択した全問</option><option value="wrong">×だけ復習</option></select></div><div><label class="label" for="order">出題順</label><select id="order"><option value="normal">順番</option><option value="random">ランダム</option></select></div></div><label class="label" for="batch">開始位置</label><select id="batch"></select><p class="muted" id="estimate"></p><button class="btn" id="start">学習を始める →</button><button class="btn alt hide" id="resume" style="margin-top:9px">続きから再開</button><div style="margin-top:14px"><button class="btn outline" id="listToggle">全カードの一覧を見る</button><div class="hide" id="listPanel"></div></div><p class="muted">○×と進行状況は端末のブラウザに保存。写真がなくても暗記できるカードです。</p></section>
<section id="quiz" class="hide"><div class="panel"><div class="statrow"><button class="btn alt" id="settings" style="width:auto;min-height:32px;padding:3px 8px;font-size:12px">← 設定</button><strong id="counter">1 / 10</strong></div><div class="progress"><div id="bar" style="width:10%"></div></div><span class="pill" id="subcat"></span><div class="question" id="question"></div><button class="btn" id="reveal">答えを表示</button><div class="answer hide" id="answerBox"><small>答え</small><strong id="answer"></strong><p id="explanation"></p></div><div class="row hide" id="gradeRow"><button class="btn red" id="wrong">× 覚えていない</button><button class="btn" id="correct">○ 覚えていた</button></div><div class="row" style="margin-top:12px"><button class="btn alt" id="prev">← 1問戻る</button><button class="btn outline" id="skip">スキップ →</button></div></div></section>
<section id="finish" class="hide"><div class="panel"><h2>今回の学習結果</h2><p id="result"></p><button class="btn" id="review">×だけ復習</button><button class="btn alt" id="restart" style="margin-top:9px">設定に戻る</button></div></section>
<footer class="muted" style="text-align:center;margin:15px 0">特徴は各科の典型例。単独では確定できない特徴には注意書きを付けています。</footer></main><script>
const CARDS=[{"id":0,"cat":"A","q":"葉間托葉＋対生葉","a":"アカネ科","e":"葉間托葉はかなり強い識別形質。子房下位も確認する。"},{"id":1,"cat":"A","q":"油点＋揉むと芳香","a":"ミカン科","e":"葉の透明な油点、香気、果実を総合する。"},{"id":2,"cat":"A","q":"四角い茎＋対生葉＋4分果","a":"シソ科","e":"四角い茎単独では決められない。唇形花冠を併せて確認。"},{"id":3,"cat":"A","q":"4花弁が十字形＋四強雄しべ","a":"アブラナ科","e":"雄しべは典型的に長4本・短2本。長角果／短角果。"},{"id":4,"cat":"A","q":"複散形花序＋2分果","a":"セリ科","e":"セリ科の典型的組み合わせ。例外もある。"},{"id":5,"cat":"A","q":"頭状花序＋総苞＋冠毛","a":"キク科","e":"多数の小花が集まる。冠毛は欠くものもある。"},{"id":6,"cat":"A","q":"三角形の茎＋3列の葉＋痩果","a":"カヤツリグサ科","e":"葉鞘は通常閉じる。小穂はあるため「小穂なし」は誤り。"},{"id":7,"cat":"A","q":"葉舌＋小穂＋穎果","a":"イネ科","e":"葉は通常2列、葉鞘は開くことが多い。"},{"id":8,"cat":"A","q":"線形葉＋6花被片＋蒴果","a":"イグサ科","e":"イネ科に似るが、通常はイネ科型の小穂をつくらない。"},{"id":9,"cat":"A","q":"蝶形花＋豆果","a":"マメ科","e":"蝶形花は典型例。マメ科には非蝶形花の仲間もある。"},{"id":10,"cat":"A","q":"巻きひげ＋子房下位＋瓜果","a":"ウリ科","e":"つる性で単性花が多い。"},{"id":11,"cat":"A","q":"仏炎苞＋肉穂花序","a":"サトイモ科","e":"ミズバショウ・テンナンショウなど。"},{"id":12,"cat":"A","q":"唇弁＋ずい柱＋花粉塊","a":"ラン科","e":"花粉塊は多くのラン科でみられるが例外もある。"},{"id":13,"cat":"A","q":"托葉鞘（筒状の付属体）","a":"タデ科","e":"葉の付け根に膜質の筒ができる。"},{"id":14,"cat":"A","q":"対生葉＋唇形花冠＋蒴果","a":"キツネノマゴ科","e":"シソ科の4分果との比較が有効。"},{"id":15,"cat":"A","q":"殻斗＋堅果（ドングリ）","a":"ブナ科","e":"殻斗の形は属・種の識別にも有用。"},{"id":16,"cat":"A","q":"孔開裂する葯＋液果","a":"ナス科の一部","e":"ナスやトマトなど。ナス科全体を一つの特徴で決めない。"},{"id":17,"cat":"A","q":"小花序が枝先に集まり白い大きな総苞片","a":"ミズキ科の一部","e":"ヤマボウシは白い部分が花弁ではなく総苞片。"},{"id":18,"cat":"B","q":"花冠が壺形・鐘形＋常緑低木","a":"ツツジ科を候補","e":"アセビなど。ただし形は他科にもある。"},{"id":19,"cat":"B","q":"花弁5枚＋雄しべ多数＋托葉","a":"バラ科を候補","e":"バラ科では果実型が核果・梨状果・集合果など多様。"},{"id":20,"cat":"B","q":"常緑木本＋雄しべ多数＋蒴果","a":"ツバキ科を候補","e":"ツバキ・サザンカなど。複数形質で確認。"},{"id":21,"cat":"B","q":"分離した大きな花被片＋雄しべ多数＋袋果","a":"キンポウゲ科を候補","e":"トリカブト・オダマキなど。科内の花は多様。"},{"id":22,"cat":"B","q":"対生葉＋翼果＋羽状複葉","a":"モクセイ科（トネリコ属）を候補","e":"トネリコ属は翼果。ニワトコの果実とは異なる。"},{"id":23,"cat":"B","q":"互生葉＋白色乳液＋杯状花序","a":"トウダイグサ科を候補","e":"トウダイグサ属の強い特徴。科全体では多様。"},{"id":24,"cat":"B","q":"対生葉＋袋果＋白い乳液","a":"キョウチクトウ科を候補","e":"果実は種による。乳液のみで確定しない。"},{"id":25,"cat":"B","q":"互生葉＋蒴果＋多数の雄しべ","a":"ツバキ科など","e":"似た科が複数あるので托葉・花・種子を比較。"},{"id":26,"cat":"B","q":"花被6枚＋雄しべ6本＋蒴果","a":"イグサ科など","e":"単独では他の単子葉類にも共通する。"},{"id":27,"cat":"B","q":"果皮の一部が翼状に広がる翼果","a":"カエデ属・トネリコ属など","e":"翼果だけで科は確定できない。"},{"id":28,"cat":"B","q":"樹液が乳白色","a":"キョウチクトウ科・トウダイグサ科など","e":"この特徴だけでは確定できない典型例。"},{"id":29,"cat":"B","q":"葉裏に星状毛","a":"アオイ科など","e":"星状毛はほかの科にも出現する。"},{"id":30,"cat":"B","q":"針葉＋樹脂道","a":"マツ科などの針葉樹","e":"マツ属などで重要。針葉樹がすべてマツ科ではない。"},{"id":31,"cat":"B","q":"カラカラした苞と小穂をもつ草本","a":"イネ科・カヤツリグサ科を比較","e":"葉列・葉鞘・果実を調べて分ける。"},{"id":32,"cat":"B","q":"葉が対生＋全縁＋托葉なし","a":"モクセイ科などを候補","e":"対生というだけで科の決め手にはならない。"},{"id":33,"cat":"B","q":"花の先端の葯が合着して筒状","a":"キク科を候補","e":"多くのキク科でみられる。頭状花序も合わせる。"},{"id":34,"cat":"C","q":"4分果と蒴果の違いで見分ける2科","a":"シソ科とキツネノマゴ科","e":"唇形花冠・対生葉が重複するため果実を確認。"},{"id":35,"cat":"C","q":"痩果と穎果で見分ける2科","a":"カヤツリグサ科とイネ科","e":"両方とも小穂をつくる。"},{"id":36,"cat":"C","q":"3列葉と2列葉で見分ける2科","a":"カヤツリグサ科とイネ科","e":"茎の断面・葉鞘も合わせて確認。"},{"id":37,"cat":"C","q":"花被片6枚と花被退化で区別する草本の科","a":"イグサ科とイネ科・カヤツリグサ科","e":"花被の発達状態と果実が大きな違い。"},{"id":38,"cat":"C","q":"葉間托葉の有無で見分けやすい対生葉の科","a":"アカネ科とモクセイ科","e":"アカネ科は葉間托葉が重要。"},{"id":39,"cat":"C","q":"殻斗のある堅果と小さな翼果で区別する科","a":"ブナ科とカバノキ科","e":"カバノキ科にも堅果状の果実があり、翼果だけで分けきれない。"},{"id":40,"cat":"C","q":"油点と芳香がある木本の科","a":"ミカン科を候補","e":"サンショウやキハダなどの複葉にも注目。"},{"id":41,"cat":"C","q":"頭状花序の個々の小花は1つの花か","a":"それぞれが1つの花","e":"キク科では多数の小花が頭状花序をつくる。"},{"id":42,"cat":"C","q":"「小穂あり」だけでイネ科と断定できるか","a":"できない","e":"カヤツリグサ科も小穂をもつ。"},{"id":43,"cat":"C","q":"「茎が四角い」だけでシソ科と断定できるか","a":"できない","e":"ほかの科にも四角い茎がある。"},{"id":44,"cat":"C","q":"「対生葉」だけでアカネ科と断定できるか","a":"できない","e":"葉間托葉や子房の位置が重要。"},{"id":45,"cat":"C","q":"「花弁4枚」だけでアブラナ科と断定できるか","a":"できない","e":"四強雄しべ・角果と組み合わせる。"},{"id":46,"cat":"C","q":"「巻きひげ」だけでウリ科と断定できるか","a":"できない","e":"ブドウ科などでも巻きひげがある。"},{"id":47,"cat":"C","q":"「乳液を出す」だけでトウダイグサ科と断定できるか","a":"できない","e":"キョウチクトウ科などにもある。"},{"id":48,"cat":"C","q":"「花粉塊」だけでラン科と断定できるか","a":"できない","e":"ガガイモ類などにもある。ずい柱・唇弁を確認。"},{"id":49,"cat":"C","q":"「小さな花が密集」だけでキク科と断定できるか","a":"できない","e":"頭状花序には総苞と多数の小花という構造が重要。"}];
const $=id=>document.getElementById(id);const KEY='plant_family_keywords_50_v1';let data={ratings:{},session:null};try{const tmp=JSON.parse(localStorage.getItem(KEY)||'null');if(tmp&&typeof tmp==='object'){data={...data,...tmp};}}catch{};let queue=[],index=0,graded={};function save(){try{localStorage.setItem(KEY,JSON.stringify(data));}catch{}}function show(section){for(const id of ['home','quiz','finish'])$(id).classList.toggle('hide',id!==section);window.scrollTo(0,0)}function filtered(){let cs=CARDS.filter(c=>$('category').value==='all'||c.cat===$('category').value);if($('mode').value==='wrong')cs=cs.filter(c=>data.ratings[c.id]===false);return cs.map(c=>c.id)}function configure(){const ids=filtered();$('stats').textContent='○ '+Object.values(data.ratings).filter(v=>v===true).length+' / × '+Object.values(data.ratings).filter(v=>v===false).length;const mode=$('mode').value,step=Number(mode)||ids.length;const start=$('batch');let old=start.value;start.innerHTML='';if((mode==='10'||mode==='20')&&$('order').value==='normal'){for(let n=0;n<ids.length;n+=step){const op=document.createElement('option');op.value=n;op.textContent=(n+1)+'〜'+Math.min(n+step,ids.length)+'問目';start.appendChild(op);}if([...start.options].some(x=>x.value===old))start.value=old;start.disabled=false;}else{const op=document.createElement('option');op.value=0;op.textContent='先頭から';start.appendChild(op);start.disabled=true;}let est=(mode==='10'||mode==='20')?Math.min(step,Math.max(0,ids.length-Number(start.value||0))):ids.length;$('estimate').textContent='対象 '+ids.length+'問／今回 '+est+'問';$('start').disabled=!est;$('resume').classList.toggle('hide',!(data.session&&data.session.queue&&data.session.queue.length));}for(const id of ['category','mode','order','batch'])$(id).addEventListener('change',configure);function persist(){data.session={queue:queue.slice(),index,graded:{...graded}};save()}function begin(ids,old=false){if(!ids.length)return;queue=ids.slice();index=0;graded={};persist();render();show('quiz')}function render(){const c=CARDS[queue[index]];if(!c){show('home');return;}$('counter').textContent=(index+1)+' / '+queue.length;$('bar').style.width=100*(index+1)/queue.length+'%';$('subcat').textContent=({A:'最重要',B:'補助形質',C:'似た科の比較'})[c.cat];$('question').textContent=c.q;$('answer').textContent=c.a;$('explanation').textContent=c.e;const done=Object.hasOwn(graded,c.id);$('answerBox').classList.toggle('hide',!done);$('gradeRow').classList.toggle('hide',!done);$('reveal').classList.toggle('hide',done);$('prev').disabled=index===0;persist()}function next(){if(index+1<queue.length){index++;render();window.scrollTo(0,0)}else complete()}function grade(value){const id=queue[index];graded[id]=value;data.ratings[id]=value;save();next()}function complete(){data.session=null;save();const values=queue.filter(id=>Object.hasOwn(graded,id));let ok=values.filter(id=>graded[id]===true).length,ng=values.filter(id=>graded[id]===false).length;$('result').textContent='○ '+ok+'問 / × '+ng+'問 / スキップ '+(queue.length-values.length)+'問';$('review').disabled=!ng;show('finish')}function random(a){for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a};$('start').onclick=()=>{let a=filtered();if($('order').value==='random')random(a);const n=Number($('mode').value);if(n){a=a.slice(Number($('batch').value||0),Number($('batch').value||0)+n)}begin(a)};$('reveal').onclick=()=>{$('answerBox').classList.remove('hide');$('gradeRow').classList.remove('hide');$('reveal').classList.add('hide')};$('correct').onclick=()=>grade(true);$('wrong').onclick=()=>grade(false);$('skip').onclick=next;$('prev').onclick=()=>{if(index){index--;render()}};$('settings').onclick=()=>{configure();show('home')};$('restart').onclick=()=>{configure();show('home')};$('review').onclick=()=>begin(queue.filter(id=>graded[id]===false));$('resume').onclick=()=>{const s=data.session;if(!s)return;queue=s.queue;index=Math.min(s.index||0,queue.length-1);graded=s.graded||{};render();show('quiz')};$('listToggle').onclick=()=>{const div=$('listPanel');div.classList.toggle('hide');if(!div.classList.contains('hide'))div.innerHTML=CARDS.map(c=>'<div><b>'+c.q+'</b><p style="margin:2px 0;color:#245b41">'+c.a+'</p><small>'+c.e+'</small></div>').join('')};configure();
</script></body></html>

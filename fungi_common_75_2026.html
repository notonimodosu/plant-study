const el=id=>document.getElementById(id),hide=x=>["setup","quiz","result"].forEach(y=>el(y).classList.toggle("hidden",y!==x)),shuffle=a=>a.map(x=>[Math.random(),x]).sort((a,b)=>a[0]-b[0]).map(x=>x[1]);

function begin(only=null){let pool=DATA.filter(x=>type==="all"||(type==="basic"?x.id<40:x.id>=40));if(only!==null)pool=pool.filter(x=>only.includes(x.id));queue=shuffle(pool).slice(0,only!==null||size==="all"?pool.length:size);if(!queue.length)return;pos=0;answers={};wrongNow=[];hide("quiz");render()}
function render(){const x=queue[pos],v=answers[x.id];el("counter").textContent=(pos+1)+" / "+queue.length+"問　"+x.cat;el("q").textContent=x.q;el("choices").replaceChildren();x.opts.forEach((s,j)=>{let b=document.createElement("button");b.className="choice";b.textContent=(j+1)+". "+s;if(v!==undefined){b.disabled=true;if(j===x.correct)b.classList.add("good");else if(j===v)b.classList.add("bad")}else b.onclick=()=>answer(j);el("choices").appendChild(b)});el("feedback").textContent=v===undefined?"":(v===x.correct?"○ 正解！　":"× 不正解　")+x.why;el("prev").disabled=pos===0;el("next").disabled=v===undefined;el("next").textContent=pos===queue.length-1?"結果を見る":"次の問題"}
function answer(j){const x=queue[pos];if(answers[x.id]!==undefined)return;answers[x.id]=j;let h=hist().filter(i=>i!==x.id);if(j!==x.correct){h.push(x.id);wrongNow.push(x.id)}save(h);render()}
function finish(){let n=queue.filter(x=>answers[x.id]===x.correct).length;el("score").textContent=n+" / "+queue.length+"問";el("review").disabled=!wrongNow.length;hide("result");stats()}
for(const [id,cb] of [["sizes",v=>size=v],["types",v=>type=v]])el(id).querySelectorAll("button").forEach(b=>b.onclick=()=>{el(id).querySelectorAll("button").forEach(x=>x.classList.toggle("active",x===b));cb(b.dataset.v)});
el("start").onclick=()=>begin();el("missed").onclick=()=>begin(hist());el("clear").onclick=()=>{if(confirm("間違い履歴を消しますか？")){save([]);stats()}};el("back").onclick=()=>{hide("setup");stats()};el("prev").onclick=()=>{if(pos>0){pos--;render()}};el("next").onclick=()=>{if(answers[queue[pos].id]===undefined)return;if(pos===queue.length-1)finish();else{pos++;render()}};el("review").onclick=()=>begin(wrongNow);el("again").onclick=()=>{hide("setup");stats()};stats();
